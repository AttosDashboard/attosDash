const OPB=[{key:'bastao',label:'Passagem de Bastão',items:['Apresentação da equipe ao cliente','Envio de briefing inicial','Acesso às plataformas','Alinhamento de expectativas']},{key:'entrada',label:'Entrada',items:['Pesquisa de referências','Definição de identidade visual','Criação de perfis','Levantamento de concorrentes']},{key:'kickoff',label:'Reunião de Kickoff',items:['Apresentação da estratégia','Definição de metas','Aprovação do calendário inicial','Assinatura de contrato']},{key:'especialista',label:'Reunião com Especialista',items:['Análise do mercado','Definição de público-alvo','Estratégia de conteúdo','Plano de tráfego']},{key:'planejamento',label:'Reunião de Planejamento',items:['Calendário do mês','Aprovação de pautas','Definição de roteiros']},{key:'finais',label:'Ações Finais',items:['Primeiro post publicado','Primeira campanha ativa','Relatório de entrada','Check-in de satisfação']}];

function Toast({msg}){return msg?<div className="toast">{msg}</div>:null;}

function MonthNav({mes,onChange,showCurrent}){
  const isCurrentMonth=mes===currentMes();
  return(
    <div className="month-nav">
      <button className="month-nav-btn" onClick={()=>onChange(prevMes(mes))}>‹</button>
      <div className="month-display">{mesLabel(mes)}</div>
      <button className="month-nav-btn" onClick={()=>onChange(nextMes(mes))} disabled={isCurrentMonth} style={{opacity:isCurrentMonth?0.3:1}}>›</button>
      {!isCurrentMonth&&showCurrent&&<button className="btn btn-ghost btn-sm" onClick={()=>onChange(currentMes())}>Hoje</button>}
    </div>
  );
}

function LineChart({labels,datasets}){
  const ref=useRef(null),ch=useRef(null);
  useEffect(()=>{if(!ref.current)return;if(ch.current)ch.current.destroy();ch.current=new Chart(ref.current,{type:'line',data:{labels,datasets:datasets.map(d=>({label:d.label,data:d.data,borderColor:d.color||'#3B82F6',backgroundColor:d.bg||'rgba(59,130,246,.08)',borderWidth:2.5,pointRadius:3,tension:0.4,fill:true}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:datasets.length>1,labels:{font:{family:'DM Sans',size:11},color:'#9CA3AF',boxWidth:10}}},scales:{x:{grid:{display:false},ticks:{font:{family:'DM Sans',size:10},color:'#9CA3AF'},border:{display:false}},y:{grid:{color:'#F3F4F6'},ticks:{font:{family:'DM Sans',size:10},color:'#9CA3AF'},border:{display:false}}}}});return()=>ch.current&&ch.current.destroy();},[labels,datasets]);
  return <div className="chart-wrap"><canvas ref={ref}/></div>;
}
function BarChart({labels,data,colors}){
  const ref=useRef(null),ch=useRef(null);
  useEffect(()=>{if(!ref.current)return;if(ch.current)ch.current.destroy();ch.current=new Chart(ref.current,{type:'bar',data:{labels,datasets:[{data,backgroundColor:colors||'#3B82F6',borderRadius:5,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{family:'DM Sans',size:10},color:'#9CA3AF'},border:{display:false}},y:{grid:{color:'#F3F4F6'},ticks:{font:{family:'DM Sans',size:10},color:'#9CA3AF'},border:{display:false}}}}});return()=>ch.current&&ch.current.destroy();},[labels,data]);
  return <div className="chart-sm"><canvas ref={ref}/></div>;
}
function DonutChart({labels,data,colors}){
  const ref=useRef(null),ch=useRef(null);
  useEffect(()=>{if(!ref.current)return;if(ch.current)ch.current.destroy();ch.current=new Chart(ref.current,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors||['#3B82F6','#7C3AED','#10B981','#F59E0B','#93C5FD'],borderWidth:0,hoverOffset:5}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{font:{family:'DM Sans',size:11},color:'#6B7280',boxWidth:9,padding:12}}}}});return()=>ch.current&&ch.current.destroy();},[labels,data]);
  return <div style={{position:'relative',height:185}}><canvas ref={ref}/></div>;
}

function Sidebar({profile,navItems,activeTab,onTab}){
  async function handleLogout(){await sb.auth.signOut();window.location.reload();}
  return(
    <div className="sidebar">
      <div className="sb-logo"><div className="sb-logo-text">Attos <span>Dashboard</span></div><div className="sb-role">{ROLE_LABELS[profile?.role]||'usuário'}</div></div>
      <nav className="sb-nav">
        {navItems.map(item=>item.section?<div key={item.section} className="sb-section">{item.section}</div>:<div key={item.id} className={`nav-item ${activeTab===item.id?'active':''}`} onClick={()=>onTab(item.id)}><span className="nav-icon">{item.icon}</span><span>{item.label}</span></div>)}
      </nav>
      <div className="sb-footer"><div className="user-row"><div className="u-avatar">{(profile?.name||'U')[0].toUpperCase()}</div><div className="u-name">{profile?.name||'Usuário'}</div></div><button className="logout-btn" onClick={handleLogout}>Sair</button></div>
    </div>
  );
}

function SharedDashboard({sdrEntries,closerEntries,leads,profiles,settings,mes,onMesChange}){
  const sdrs=profiles.filter(p=>p.role==='sdr'),closers=profiles.filter(p=>p.role==='closer');
  const[ms,me]=getMonthRangeFromMes(mes);
  const se=sdrEntries.filter(e=>e.date>=ms&&e.date<=me);
  const ce=closerEntries.filter(e=>e.date>=ms&&e.date<=me);
  const mesLeads=leads.filter(l=>l.mes===mes);
  const totalMtgs=se.reduce((a,e)=>a+(e.meetings_booked||0),0);
  let totalClos=0,totalMRR=0;
  PRODUCTS.forEach(p=>{totalClos+=ce.reduce((a,e)=>a+(e[`closings_${p.key}`]||0),0);totalMRR+=ce.reduce((a,e)=>a+((e[`closings_${p.key}`]||0)*(e[`ticket_${p.key}`]||0)),0);});
  const totalDone=ce.reduce((a,e)=>a+(e.meetings_done||0),0);
  const sdrRanking=sdrs.map(s=>({...s,meetings:se.filter(e=>e.user_id===s.id).reduce((a,e)=>a+(e.meetings_booked||0),0)})).sort((a,b)=>b.meetings-a.meetings);
  const closerRanking=closers.map(c=>({...c,closings:PRODUCTS.reduce((a,p)=>a+ce.filter(e=>e.user_id===c.id).reduce((b,e)=>b+(e[`closings_${p.key}`]||0),0),0)})).sort((a,b)=>b.closings-a.closings);
  const funnelData=KCOLS.map(col=>({...col,count:mesLeads.filter(l=>l.stage===col.id).length}));
  const fechadosCount=mesLeads.filter(l=>l.stage==='fechado').length;
  const maxF=Math.max(...funnelData.map(f=>f.count),fechadosCount,1);
  const days14=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days14.push(d.toISOString().split('T')[0]);}
  const chartLabels=days14.map(d=>{const[,m,dd]=d.split('-');return`${dd}/${m}`;});
  const chartMtg=days14.map(d=>sdrEntries.filter(e=>e.date===d).reduce((a,e)=>a+(e.meetings_booked||0),0));
  const chartClos=days14.map(d=>closerEntries.filter(e=>e.date===d).reduce((a,e)=>PRODUCTS.reduce((b,p)=>b+(e[`closings_${p.key}`]||0),0)+a,0));
  return(
    <>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
        <div style={{fontSize:13,color:'var(--muted)',fontWeight:500}}>Visão geral em tempo real</div>
        <MonthNav mes={mes} onChange={onMesChange} showCurrent={true}/>
      </div>
      <div className="g4">
        {[['Leads do Mês',mesLeads.length,'cadastrados em '+mesLabel(mes),'#1E3A5F','#3B82F6'],['Reuniões no Mês',totalMtgs,'agendadas em '+mesLabel(mes),'#1E40AF','#60A5FA'],['Fechamentos',totalClos,'contratos fechados','#065F46','#10B981'],['MRR Gerado',fmtR(totalMRR),'receita recorrente','#4C1D95','#7C3AED']].map(([label,val,sub,c1,c2])=>(
          <div key={label} style={{background:'linear-gradient(135deg,'+c1+','+c2+')',borderRadius:12,padding:'20px 22px',boxShadow:'0 4px 14px '+c2+'40'}}>
            <div style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,.7)',textTransform:'uppercase',letterSpacing:.8,marginBottom:8}}>{label}</div>
            <div style={{fontSize:typeof val==='string'&&val.length>8?22:36,fontWeight:700,color:'#fff',letterSpacing:-1,lineHeight:1}}>{val}</div>
            <div style={{fontSize:12,color:'rgba(255,255,255,.6)',marginTop:4}}>{sub}</div>
          </div>
        ))}
      </div>
      <div className="card mb">
        <div className="card-title">Funil de Vendas — {mesLabel(mes)}</div>
        {funnelData.map(col=><div key={col.id} className="funnel-row"><div className="funnel-label">{col.icon} {col.label}</div><div className="funnel-bar-wrap"><div className="funnel-bar-fill" style={{width:Math.max(pct(col.count,maxF),col.count>0?5:0)+'%',background:KCOL_COLORS[col.id]}}>{col.count>0?col.count:''}</div></div><div className="funnel-count">{col.count}</div></div>)}
        <div className="funnel-row"><div className="funnel-label">✅ Fechado</div><div className="funnel-bar-wrap"><div className="funnel-bar-fill" style={{width:Math.max(pct(fechadosCount,maxF),fechadosCount>0?5:0)+'%',background:'#10B981'}}>{fechadosCount>0?fechadosCount:''}</div></div><div className="funnel-count">{fechadosCount}</div></div>
      </div>
      <div className="g2">
        <div className="card"><div className="card-title">Agendamentos e Fechamentos — 14 dias</div><LineChart labels={chartLabels} datasets={[{label:'Agendamentos',data:chartMtg,color:'#3B82F6',bg:'rgba(59,130,246,.08)'},{label:'Fechamentos',data:chartClos,color:'#10B981',bg:'rgba(16,185,129,.06)'}]}/></div>
        <div className="card"><div className="card-title">MRR por Produto</div><DonutChart labels={PRODUCTS.map(p=>p.label)} data={PRODUCTS.map(p=>ce.reduce((a,e)=>a+((e[`closings_${p.key}`]||0)*(e[`ticket_${p.key}`]||0)),0))} colors={PRODUCTS.map(p=>p.color)}/></div>
      </div>
      <div className="g2">
        <div className="card"><div className="card-title">🏆 Ranking SDRs</div>{sdrRanking.length===0?<div className="empty">Sem SDRs</div>:sdrRanking.map((s,i)=><div key={s.id} className="rank-item"><div className={`rank-num ${i===0?'rn-1':i===1?'rn-2':i===2?'rn-3':'rn-n'}`}>{i+1}</div><div className="rank-name">{s.name}</div><div className="rank-val">{s.meetings}</div></div>)}</div>
        <div className="card"><div className="card-title">🏆 Ranking Closers</div>{closerRanking.length===0?<div className="empty">Sem Closers</div>:closerRanking.map((c,i)=><div key={c.id} className="rank-item"><div className={`rank-num ${i===0?'rn-1':i===1?'rn-2':i===2?'rn-3':'rn-n'}`}>{i+1}</div><div className="rank-name">{c.name}</div><div className="rank-val">{c.closings}</div></div>)}</div>
      </div>
      <div className="card mb"><div className="card-title">Fechamentos por Produto — {mesLabel(mes)}</div><BarChart labels={PRODUCTS.map(p=>p.label)} data={PRODUCTS.map(p=>ce.reduce((a,e)=>a+(e[`closings_${p.key}`]||0),0))} colors={PRODUCTS.map(p=>p.color)}/></div>
    </>
  );
}

function CRMKanban({leads,profiles,currentUser,currentProfile,onLeadsChange,toast,mes,onMesChange,onFechar}){
  const[showModal,setShowModal]=useState(false);const[editLead,setEditLead]=useState(null);const[viewLead,setViewLead]=useState(null);const[viewMode,setViewMode]=useState('kanban');const[showFechados,setShowFechados]=useState(false);
  const closers=profiles.filter(p=>p.role==='closer');
  const empty={name:'',company:'',phone:'',product:'',closer_id:'',meeting_date:'',est_value:'',observations:'',stage:'lead_quente'};
  const[form,setForm]=useState(empty);
  const getName=id=>profiles.find(p=>p.id===id)?.name||'—';
  const canEdit=lead=>currentProfile?.role==='gestor'||lead.sdr_id===currentUser.id;
  const mesAtual=mes||currentMes();
  const mesLeads=leads.filter(l=>l.mes===mesAtual);
  const activoLeads=mesLeads.filter(l=>l.stage!=='fechado');
  const fechadosLeads=mesLeads.filter(l=>l.stage==='fechado');
  const allFechados=leads.filter(l=>l.stage==='fechado').sort((a,b)=>(b.mes||'').localeCompare(a.mes||''));
  function openNew(){setForm({...empty,mes:mesAtual});setEditLead(null);setShowModal(true);}
  function openEdit(l){setForm({...l,est_value:l.est_value||''});setEditLead(l);setShowModal(true);}
  async function saveLead(){
    const p={...form,sdr_id:editLead?editLead.sdr_id:currentUser.id,est_value:parseFloat(form.est_value)||0,meeting_date:form.meeting_date||null,closer_id:form.closer_id||null,mes:form.mes||mesAtual,updated_at:new Date().toISOString()};
    if(editLead){const{error}=await sb.from('leads').update(p).eq('id',editLead.id);if(error)toast('Erro: '+error.message);else{toast('Lead atualizado!');onLeadsChange();}}
    else{const{error}=await sb.from('leads').insert(p);if(error)toast('Erro: '+error.message);else{toast('✅ Lead cadastrado!');onLeadsChange();}}
    setShowModal(false);
  }
  async function moveStage(lead,ns){
    if(ns==='fechado'){onFechar(lead);return;}
    await sb.from('leads').update({stage:ns,updated_at:new Date().toISOString()}).eq('id',lead.id);
    toast('Movido');
    onLeadsChange();
  }
  async function reativarLead(lead){
    await sb.from('leads').update({mes:mesAtual,stage:'lead_quente',updated_at:new Date().toISOString()}).eq('id',lead.id);
    toast('✅ Lead reativado para '+mesLabel(mesAtual)+'!');
    onLeadsChange();
  }
  async function del(id){if(!confirm('Remover lead?'))return;await sb.from('leads').delete().eq('id',id);toast('Removido');onLeadsChange();}
  const[dragId,setDragId]=useState(null);const[dragOver,setDragOver]=useState(null);
  function onDragStart(e,leadId){setDragId(leadId);e.dataTransfer.effectAllowed='move';}
  function onDragOver(e,colId){e.preventDefault();setDragOver(colId);}
  function onDragLeave(){setDragOver(null);}
  async function onDrop(e,colId){e.preventDefault();setDragOver(null);if(!dragId)return;const lead=leads.find(l=>l.id===dragId);if(!lead||lead.stage===colId){setDragId(null);return;}await moveStage(lead,colId);setDragId(null);}
  const totalPipe=mesLeads.reduce((a,l)=>a+(l.est_value||0),0);
  const totalAtivo=activoLeads.reduce((a,l)=>a+(l.est_value||0),0);
  const totalFechado=fechadosLeads.reduce((a,l)=>a+(l.est_value||0),0);
  const totalPerdido=mesLeads.filter(l=>l.stage==='perdido').reduce((a,l)=>a+(l.est_value||0),0);
  return(
    <>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
        <div style={{fontSize:13,color:'var(--muted)',fontWeight:500}}>Leads do mês</div>
        <MonthNav mes={mesAtual} onChange={onMesChange} showCurrent={true}/>
      </div>
      <div className="g4">
        {[['Total Pipeline',fmtR(totalPipe),mesLeads.length+' leads em '+mesLabel(mesAtual),'#1E3A5F','#3B82F6'],['Pipeline Ativo',fmtR(totalAtivo),activoLeads.length+' em andamento','#14532D','#16A34A'],['Fechados',fmtR(totalFechado),fechadosLeads.length+' contratos','#065F46','#10B981'],['Perdidos',fmtR(totalPerdido),mesLeads.filter(l=>l.stage==='perdido').length+' leads','#7F1D1D','#EF4444']].map(([label,val,sub,c1,c2])=>(
          <div key={label} style={{background:'linear-gradient(135deg,'+c1+','+c2+')',borderRadius:12,padding:'20px 22px',boxShadow:'0 4px 14px '+c2+'40'}}>
            <div style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,.7)',textTransform:'uppercase',letterSpacing:.8,marginBottom:8}}>{label}</div>
            <div style={{fontSize:22,fontWeight:700,color:'#fff',letterSpacing:-1,lineHeight:1}}>{val}</div>
            <div style={{fontSize:12,color:'rgba(255,255,255,.6)',marginTop:4}}>{sub}</div>
          </div>
        ))}
      </div>

      {/* SEÇÃO DE FECHADOS */}
      <div className="closed-section mb">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:showFechados?16:0}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span style={{fontSize:20}}>✅</span>
            <div>
              <div style={{fontWeight:700,fontSize:15,color:'#059669'}}>Clientes Fechados — {mesLabel(mesAtual)}</div>
              <div style={{fontSize:12,color:'#6B7280',marginTop:2}}>{fechadosLeads.length} fechados este mês · {fmtR(totalFechado)}</div>
            </div>
          </div>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-sm" style={{background:'#10B981',color:'#fff'}} onClick={()=>setShowFechados(!showFechados)}>{showFechados?'Ocultar':'Ver todos'} ✅</button>
          </div>
        </div>
        {showFechados&&<>
          {fechadosLeads.length===0&&<div style={{textAlign:'center',padding:'20px',color:'#6B7280',fontSize:13}}>Nenhum fechado em {mesLabel(mesAtual)}</div>}
          {fechadosLeads.map(l=><div key={l.id} className="closed-lead-card">
            <div><div style={{fontWeight:600,fontSize:14}}>{l.name}{l.company&&<span style={{color:'#9CA3AF',fontWeight:400}}> — {l.company}</span>}</div><div style={{fontSize:12,color:'#6B7280',marginTop:2,display:'flex',gap:12}}><span>{PRODUCTS.find(p=>p.key===l.product)?.label||'—'}</span>{l.est_value>0&&<span style={{color:'#059669',fontWeight:600}}>{fmtR(l.est_value)}</span>}{l.closer_id&&<span>🎯 {getName(l.closer_id)}</span>}</div></div>
            <div style={{display:'flex',gap:6}}><button className="btn btn-ghost btn-xs" onClick={()=>setViewLead(l)}>Ver</button></div>
          </div>)}
          {mes!==currentMes()&&<div style={{marginTop:12,padding:'12px 0',borderTop:'1px solid #A7F3D0'}}><div style={{fontSize:13,fontWeight:600,color:'#059669',marginBottom:8}}>Histórico de Fechados</div>{allFechados.filter(l=>l.mes!==mesAtual).slice(0,10).map(l=><div key={l.id} className="closed-lead-card" style={{borderColor:'#E5E7EB'}}><div><div style={{fontWeight:600,fontSize:13}}>{l.name}</div><div style={{fontSize:12,color:'#6B7280',marginTop:1}}>{PRODUCTS.find(p=>p.key===l.product)?.label||'—'} · {fmtR(l.est_value)}</div></div><div style={{display:'flex',gap:6,alignItems:'center'}}><span className="month-badge">{mesLabel(l.mes)}</span><button className="btn btn-warn btn-xs" onClick={()=>reativarLead(l)}>Reativar</button></div></div>)}</div>}
        </>}
      </div>

      <div className="sec-hdr"><h2>Pipeline — {mesLabel(mesAtual)}</h2><div style={{display:'flex',gap:8}}>
        <div style={{display:'flex',background:'#F0F0F0',borderRadius:8,padding:3,gap:2}}>
          <button onClick={()=>setViewMode('kanban')} style={{padding:'5px 10px',borderRadius:6,border:'none',background:viewMode==='kanban'?'#fff':'transparent',fontWeight:viewMode==='kanban'?600:400,fontSize:12,cursor:'pointer',fontFamily:'inherit'}}>Kanban</button>
          <button onClick={()=>setViewMode('lista')} style={{padding:'5px 10px',borderRadius:6,border:'none',background:viewMode==='lista'?'#fff':'transparent',fontWeight:viewMode==='lista'?600:400,fontSize:12,cursor:'pointer',fontFamily:'inherit'}}>Lista</button>
        </div>
        <button className="btn btn-primary btn-sm" onClick={openNew}>+ Novo Lead</button>
      </div></div>

      {viewMode==='lista'&&<div className="card mb"><div className="tbl-wrap"><table><thead><tr><th>Lead</th><th>Produto</th><th>Closer</th><th>Reunião</th><th>Valor</th><th>Etapa</th><th></th></tr></thead><tbody>{activoLeads.length===0?<tr><td colSpan={7} style={{textAlign:'center',color:'#9CA3AF'}}>Nenhum lead ativo em {mesLabel(mesAtual)}</td></tr>:activoLeads.map(l=><tr key={l.id}><td><strong>{l.name}</strong>{l.company&&<div style={{fontSize:11.5,color:'#9CA3AF'}}>{l.company}</div>}</td><td>{PRODUCTS.find(p=>p.key===l.product)?.label||'—'}</td><td>{getName(l.closer_id)}</td><td>{fmtDate(l.meeting_date)}</td><td style={{color:'#3B82F6',fontWeight:600}}>{l.est_value>0?fmtR(l.est_value):'—'}</td><td><span style={{background:KCOL_COLORS[l.stage]+'20',color:KCOL_COLORS[l.stage],borderRadius:99,padding:'2px 8px',fontSize:12,fontWeight:600}}>{ALL_STAGES.find(c=>c.id===l.stage)?.label}</span></td><td><div style={{display:'flex',gap:4}}><button className="btn btn-ghost btn-xs" onClick={()=>setViewLead(l)}>Ver</button>{canEdit(l)&&<button className="btn btn-ghost btn-xs" onClick={()=>openEdit(l)}>Editar</button>}<button className="btn btn-success btn-xs" onClick={()=>onFechar(l)}>Fechar</button></div></td></tr>)}</tbody></table></div></div>}

function ReunioesSemana({leads,profiles,currentUser,currentProfile,toast,onCloserEntryChange}){
  const[ws,we]=getWeekRange();
  const isGestor=currentProfile?.role==='gestor',isCloser=currentProfile?.role==='closer';
  const weekLeads=leads.filter(l=>l.stage==='reuniao_agendada'&&l.meeting_date&&l.meeting_date>=ws&&l.meeting_date<=we);
  const myLeads=isCloser?weekLeads.filter(l=>l.closer_id===currentUser.id):weekLeads;
  const getName=id=>profiles.find(p=>p.id===id)?.name||'—';
  const closers=profiles.filter(p=>p.role==='closer');
  async function markStatus(lead,status){
    await sb.from('closer_entries').insert({user_id:lead.closer_id||currentUser.id,date:today(),meetings_done:status==='realizada'?1:0,meetings_noshow:status==='noshow'?1:0,proposals_sent:0,closings_contabilidade:0,ticket_contabilidade:0,closings_bpo:0,ticket_bpo:0,closings_marketing:0,ticket_marketing:0,closings_comercial:0,ticket_comercial:0,closing_days:0});
    if(status==='realizada')await sb.from('leads').update({stage:'proposta_enviada',updated_at:new Date().toISOString()}).eq('id',lead.id);
    toast(status==='realizada'?'✅ Reunião realizada!':'⚠️ No-show registrado!');
    onCloserEntryChange();
  }
  const Card=({l})=>(<div style={{background:'#fff',border:'1px solid #F0F0F0',borderRadius:10,padding:14,marginBottom:10}}><div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}><div><div style={{fontWeight:600,fontSize:14}}>{l.name}{l.company&&<span style={{color:'#9CA3AF',fontWeight:400}}> — {l.company}</span>}</div><div style={{fontSize:12.5,color:'#6B7280',display:'flex',gap:14,flexWrap:'wrap',marginTop:4}}><span>📅 {fmtDate(l.meeting_date)}</span><span>{PRODUCTS.find(p=>p.key===l.product)?.label||'—'}</span>{!isCloser&&<span>🎯 {getName(l.closer_id)}</span>}{l.est_value>0&&<span style={{color:'#3B82F6',fontWeight:600}}>{fmtR(l.est_value)}</span>}</div></div>{isCloser&&<div style={{display:'flex',gap:6}}><button className="btn btn-success btn-sm" onClick={()=>markStatus(l,'realizada')}>✅ Realizada</button><button className="btn btn-danger btn-sm" onClick={()=>markStatus(l,'noshow')}>❌ No-show</button></div>}</div></div>);
  if(isGestor)return(<>{closers.map(c=>{const cr=weekLeads.filter(l=>l.closer_id===c.id);return<div key={c.id} className="card mb"><div className="sec-hdr" style={{marginBottom:12}}><h2 style={{fontSize:14}}>🎯 {c.name}</h2><span className="tag tag-blue">{cr.length}</span></div>{cr.length===0?<div style={{color:'#9CA3AF',fontSize:13}}>Nenhuma esta semana</div>:cr.map(l=><Card key={l.id} l={l}/>)}</div>;})}  {closers.length===0&&<div className="card"><div className="empty">Nenhum Closer</div></div>}</>);
  return(<><div className="sec-hdr"><h2>Reuniões da Semana</h2><span className="tag tag-blue">{myLeads.length}</span></div>{myLeads.length===0?<div className="card"><div className="empty"><div className="empty-icon">📅</div>Nenhuma reunião esta semana</div></div>:myLeads.map(l=><Card key={l.id} l={l}/>)}</>);
}

function SDRPanel({user,profile,profiles,leads,settings,sdrEntries,onEntryChange,toast,mes}){
  const[entry,setEntry]=useState({messages_sent:'',responses:'',meetings_booked:'',lead_channel:'',no_booking_reason:'',no_booking_obs:'',observations:''});
  const[saving,setSaving]=useState(false);
  const[ws,we]=getWeekRange();
  const[ms,me]=getMonthRangeFromMes(mes);
  const weekMtgs=sdrEntries.filter(e=>e.user_id===user.id&&e.date>=ws&&e.date<=we).reduce((a,e)=>a+(e.meetings_booked||0),0);
  const wg=settings.weekly_meeting_goal||8;
  const mE=sdrEntries.filter(e=>e.user_id===user.id&&e.date>=ms&&e.date<=me);
  const totalMsg=mE.reduce((a,e)=>a+(e.messages_sent||0),0),totalResp=mE.reduce((a,e)=>a+(e.responses||0),0),totalMtg=mE.reduce((a,e)=>a+(e.meetings_booked||0),0);
  const myLeads=leads.filter(l=>l.sdr_id===user.id&&l.mes===mes);
  async function handleSave(e){e.preventDefault();setSaving(true);const{error}=await sb.from('sdr_entries').insert({user_id:user.id,date:today(),messages_sent:parseInt(entry.messages_sent)||0,responses:parseInt(entry.responses)||0,meetings_booked:parseInt(entry.meetings_booked)||0,lead_channel:entry.lead_channel,no_booking_reason:entry.no_booking_reason,no_booking_obs:entry.no_booking_obs,observations:entry.observations});if(error)toast('Erro: '+error.message);else{toast('✅ Salvo!');setEntry({messages_sent:'',responses:'',meetings_booked:'',lead_channel:'',no_booking_reason:'',no_booking_obs:'',observations:''});onEntryChange();}setSaving(false);}
  return(<>
    <div className="card mb"><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}><div className="card-title" style={{margin:0}}>Meta Semanal</div><span className="tag tag-blue">{weekMtgs} / {wg}</span></div><div className="prog-wrap"><div className="prog-fill" style={{width:pct(weekMtgs,wg)+'%',background:'#3B82F6'}}/></div><div className="prog-labels"><span style={{fontSize:11.5,color:'#9CA3AF'}}>Esta semana</span><span className="prog-pct">{pct(weekMtgs,wg)}%</span></div></div>
    <div className="sdr-stats mb"><div className="sdr-stat"><div className="sdr-stat-label">Mensagens</div><div className="sdr-stat-val">{fmt(totalMsg)}</div></div><div className="sdr-stat"><div className="sdr-stat-label">Respostas</div><div className="sdr-stat-val">{fmt(totalResp)}</div><div className="sdr-stat-sub">Taxa: {pct(totalResp,totalMsg)}%</div></div><div className="sdr-stat"><div className="sdr-stat-label">Reuniões</div><div className="sdr-stat-val">{fmt(totalMtg)}</div></div><div className="sdr-stat"><div className="sdr-stat-label">Taxa Agend.</div><div className="sdr-stat-val">{pct(totalMtg,totalMsg)}%</div></div></div>
    <div className="card mb"><div className="sec-hdr" style={{marginBottom:10}}><h2 style={{fontSize:13.5}}>Meus Leads — {mesLabel(mes)}</h2><span className="tag tag-blue">{myLeads.length}</span></div><div style={{display:'flex',gap:8,flexWrap:'wrap'}}>{ALL_STAGES.map(col=>{const count=myLeads.filter(l=>l.stage===col.id).length;return<div key={col.id} style={{background:'#F8F9FB',border:'1px solid #F0F0F0',borderRadius:8,padding:'8px 14px',textAlign:'center',minWidth:88}}><div style={{fontSize:11,color:'#9CA3AF',marginBottom:2}}>{col.label}</div><div style={{fontSize:20,fontWeight:700}}>{count}</div></div>;})}</div></div>
    <div className="card"><div className="card-title">Lançamento — {new Date().toLocaleDateString('pt-BR')}</div><form onSubmit={handleSave}>
      <div className="frow"><div className="fg"><label className="flabel">Mensagens Enviadas</label><input className="finput" type="number" min={0} value={entry.messages_sent} onChange={e=>setEntry(v=>({...v,messages_sent:e.target.value}))}/></div><div className="fg"><label className="flabel">Respostas</label><input className="finput" type="number" min={0} value={entry.responses} onChange={e=>setEntry(v=>({...v,responses:e.target.value}))}/></div></div>
      <div className="frow"><div className="fg"><label className="flabel">Reuniões Agendadas</label><input className="finput" type="number" min={0} value={entry.meetings_booked} onChange={e=>setEntry(v=>({...v,meetings_booked:e.target.value}))}/></div><div className="fg"><label className="flabel">Canal de Origem</label><select className="fselect" value={entry.lead_channel} onChange={e=>setEntry(v=>({...v,lead_channel:e.target.value}))}><option value="">Selecionar...</option>{CHANNELS.map(c=><option key={c}>{c}</option>)}</select></div></div>
      <div className="fg"><label className="flabel">Observações</label><textarea className="ftextarea" value={entry.observations} onChange={e=>setEntry(v=>({...v,observations:e.target.value}))}/></div>
      <button className="btn btn-primary" type="submit" disabled={saving}>{saving?'Salvando...':'✓ Salvar'}</button>
    </form></div>
  </>);
}

function CloserPanel({user,profile,leads,closerEntries,onEntryChange,toast,mes}){
  const[entry,setEntry]=useState({meetings_done:'',meetings_noshow:'',proposals_sent:'',closings_contabilidade:'',ticket_contabilidade:'',closings_bpo:'',ticket_bpo:'',closings_marketing:'',ticket_marketing:'',closings_comercial:'',ticket_comercial:'',closing_days:'',observations:''});
  const[saving,setSaving]=useState(false);
  const[ms,me]=getMonthRangeFromMes(mes);
  const mE=closerEntries.filter(e=>e.user_id===user.id&&e.date>=ms&&e.date<=me);
  const totalDone=mE.reduce((a,e)=>a+(e.meetings_done||0),0),totalNS=mE.reduce((a,e)=>a+(e.meetings_noshow||0),0);
  let totalClos=0,totalRev=0;
  PRODUCTS.forEach(p=>{totalClos+=mE.reduce((a,e)=>a+(e[`closings_${p.key}`]||0),0);totalRev+=mE.reduce((a,e)=>a+((e[`closings_${p.key}`]||0)*(e[`ticket_${p.key}`]||0)),0);});
  const myPending=leads.filter(l=>l.closer_id===user.id&&l.stage==='reuniao_agendada');
  async function handleSave(e){e.preventDefault();setSaving(true);const payload={user_id:user.id,date:today()};Object.keys(entry).forEach(k=>{payload[k]=entry[k]===''?null:isNaN(entry[k])?entry[k]:parseFloat(entry[k]);});const{error}=await sb.from('closer_entries').insert(payload);if(error)toast('Erro: '+error.message);else{toast('✅ Salvo!');setEntry({meetings_done:'',meetings_noshow:'',proposals_sent:'',closings_contabilidade:'',ticket_contabilidade:'',closings_bpo:'',ticket_bpo:'',closings_marketing:'',ticket_marketing:'',closings_comercial:'',ticket_comercial:'',closing_days:'',observations:''});onEntryChange();}setSaving(false);}
  return(<>
    <div className="g4 mb"><div className="card"><div className="card-title">Reuniões Feitas</div><div className="metric-big">{totalDone}</div></div><div className="card"><div className="card-title">No-shows</div><div className="metric-big" style={{color:'#EF4444'}}>{totalNS}</div></div><div className="card"><div className="card-title">Fechamentos</div><div className="metric-big" style={{color:'#3B82F6'}}>{totalClos}</div></div><div className="card"><div className="card-title">MRR</div><div className="metric-big" style={{fontSize:20}}>{fmtR(totalRev)}</div></div></div>
    {myPending.length>0&&<div className="card mb"><div className="card-title">Reuniões Pendentes</div>{myPending.map(l=><div key={l.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px solid #FAFAFA'}}><div><div style={{fontWeight:600,fontSize:14}}>{l.name}</div><div style={{fontSize:12,color:'#9CA3AF',marginTop:2}}>{fmtDate(l.meeting_date)}</div></div><span className="tag tag-blue">Agendada</span></div>)}</div>}
    <div className="card"><div className="card-title">Lançamento — {new Date().toLocaleDateString('pt-BR')}</div><form onSubmit={handleSave}>
      <div className="frow"><div className="fg"><label className="flabel">Reuniões Realizadas</label><input className="finput" type="number" min={0} value={entry.meetings_done} onChange={e=>setEntry(v=>({...v,meetings_done:e.target.value}))}/></div><div className="fg"><label className="flabel">No-shows</label><input className="finput" type="number" min={0} value={entry.meetings_noshow} onChange={e=>setEntry(v=>({...v,meetings_noshow:e.target.value}))}/></div></div>
      <div className="fg"><label className="flabel">Propostas Enviadas</label><input className="finput" type="number" min={0} value={entry.proposals_sent} onChange={e=>setEntry(v=>({...v,proposals_sent:e.target.value}))}/></div>
      <hr className="divider"/><div style={{fontWeight:600,fontSize:13.5,marginBottom:12}}>Fechamentos por Produto</div>
      {PRODUCTS.map(p=><div key={p.key} className="frow" style={{marginBottom:8}}><div className="fg" style={{margin:0}}><label className="flabel">{p.icon} {p.label} — Qtd</label><input className="finput" type="number" min={0} value={entry[`closings_${p.key}`]} onChange={e=>setEntry(v=>({...v,[`closings_${p.key}`]:e.target.value}))}/></div><div className="fg" style={{margin:0}}><label className="flabel">Ticket Médio (R$)</label><input className="finput" type="number" min={0} step="0.01" value={entry[`ticket_${p.key}`]} onChange={e=>setEntry(v=>({...v,[`ticket_${p.key}`]:e.target.value}))}/></div></div>)}
      <hr className="divider"/>
      <div className="fg"><label className="flabel">Observações</label><textarea className="ftextarea" value={entry.observations} onChange={e=>setEntry(v=>({...v,observations:e.target.value}))}/></div>
      <button className="btn btn-primary" type="submit" disabled={saving}>{saving?'Salvando...':'✓ Salvar'}</button>
    </form></div>
  </>);

function GestorConfig({profiles,settings,toast,reload}){
  const[goals,setGoals]=useState({});const[wg,setWg]=useState('8');const[showAdd,setShowAdd]=useState(false);const[newUser,setNewUser]=useState({name:'',email:'',password:'',role:'sdr'});const[saving,setSaving]=useState(false);
  useEffect(()=>{const g={};PRODUCTS.forEach(p=>{g[p.key]=settings.goals[p.key]||{type:'value',target:''};});setGoals(g);setWg(String(settings.weekly_meeting_goal||8));},[settings]);
  async function saveGoal(k){const ng={...settings.goals,[k]:{type:goals[k]?.type,target:parseFloat(goals[k]?.target)||0}};await sb.from('settings').upsert({key:'goals',value:ng,updated_at:new Date().toISOString()});toast('Meta salva!');}
  async function saveWeekly(){await sb.from('settings').upsert({key:'weekly_meeting_goal',value:parseInt(wg)||8,updated_at:new Date().toISOString()});toast('Meta semanal salva!');}
  async function handleAdd(e){e.preventDefault();setSaving(true);const{data,error}=await sb.auth.signUp({email:newUser.email,password:newUser.password,options:{data:{name:newUser.name,role:newUser.role}}});if(error){toast('Erro: '+error.message);setSaving(false);return;}if(data.user)await sb.from('profiles').upsert({id:data.user.id,name:newUser.name,email:newUser.email,role:newUser.role});toast('Usuário criado!');setShowAdd(false);setNewUser({name:'',email:'',password:'',role:'sdr'});setSaving(false);reload();}
  async function handleDel(id){if(!confirm('Remover?'))return;await sb.from('profiles').delete().eq('id',id);toast('Removido');reload();}

function GestorMetas({closerEntries,settings,mes}){
  const[ms,me]=getMonthRangeFromMes(mes);
  const ce=closerEntries.filter(e=>e.date>=ms&&e.date<=me);
  const pp=PRODUCTS.map(p=>{const goal=settings.goals[p.key]||{type:'value',target:0};const achieved=goal.type==='value'?ce.reduce((a,e)=>a+((e[`closings_${p.key}`]||0)*(e[`ticket_${p.key}`]||0)),0):ce.reduce((a,e)=>a+(e[`closings_${p.key}`]||0),0);return{...p,goal,achieved,pct:pct(achieved,goal.target)};});
  return(<div className="card mb"><div className="card-title">Metas por Produto — {mesLabel(mes)}</div>{pp.map(p=><div key={p.key} style={{marginBottom:16}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}><div style={{fontWeight:600}}>{p.icon} {p.label}</div><div style={{fontSize:12.5,color:'#6B7280'}}><span style={{fontWeight:600}}>{p.goal.type==='value'?fmtR(p.achieved):p.achieved}</span><span> / {p.goal.type==='value'?fmtR(p.goal.target):p.goal.target+' fechamentos'}</span><span className="tag tag-blue" style={{marginLeft:8}}>{p.pct}%</span></div></div><div className="prog-wrap"><div className="prog-fill" style={{width:p.pct+'%',background:p.pct>=100?'#10B981':'#3B82F6'}}/></div></div>)}</div>);
}

function ChatInterno({user,profile,chatMessages,profiles,onRefresh}){
  const role=profile?.role||'gestor';
  const myChs=Object.values(CHAT_CHS).filter(ch=>ch.roles.includes(role));
  const[activeCh,setActiveCh]=useState(myChs[0]?.id||'comercial');
  const[message,setMessage]=useState('');const[sending,setSending]=useState(false);
  const bottomRef=useRef(null);
  const chMsgs=chatMessages.filter(m=>m.channel===activeCh).sort((a,b)=>a.created_at?.localeCompare(b.created_at));
  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:'smooth'});},[chMsgs.length,activeCh]);
  function getName(id){return profiles.find(p=>p.id===id)?.name||'Usuário';}
  function getColor(id){const colors=['#3B82F6','#7C3AED','#10B981','#F59E0B','#EF4444','#EC4899'];return colors[id?id.charCodeAt(0)%colors.length:0];}
  function fmtTime(ts){if(!ts)return'';const d=new Date(ts);const now=new Date();return d.toDateString()===now.toDateString()?d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
  async function sendMsg(e){e.preventDefault();if(!message.trim())return;setSending(true);await sb.from('chat_messages').insert({user_id:user.id,channel:activeCh,message:message.trim()});setMessage('');setSending(false);onRefresh();}
  const ch=CHAT_CHS[activeCh];
  return(
    <div className="chat-wrap">
      <div className="chat-sidebar">
        <div style={{padding:'16px 16px 12px',borderBottom:'1px solid #F0F0F0'}}><div style={{fontSize:13,fontWeight:700,color:'#111',marginBottom:2}}>Mensagens</div></div>
        <div style={{padding:'8px',flex:1}}>{myChs.map(c=>{const isActive=activeCh===c.id;return(<div key={c.id} onClick={()=>setActiveCh(c.id)} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:8,cursor:'pointer',background:isActive?c.color+'15':'transparent',border:isActive?`1px solid ${c.color}30`:'1px solid transparent',marginBottom:4}}><div style={{width:36,height:36,borderRadius:10,background:isActive?c.color:'#E5E7EB',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0}}>{c.icon}</div><div style={{fontSize:13,fontWeight:isActive?700:500,color:isActive?c.color:'#374151'}}>{c.label}</div></div>);})}</div>
        <div style={{padding:'12px 16px',borderTop:'1px solid #F0F0F0'}}><div style={{fontSize:11,fontWeight:700,color:'#9CA3AF',textTransform:'uppercase',letterSpacing:.6,marginBottom:8}}>Membros</div>{profiles.filter(p=>CHAT_CHS[activeCh]?.roles.includes(p.role)).map(p=><div key={p.id} style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}><div style={{width:24,height:24,borderRadius:'50%',background:getColor(p.id),display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:'#fff',flexShrink:0}}>{(p.name||'U')[0].toUpperCase()}</div><div style={{fontSize:12,color:'#374151'}}>{p.name}</div></div>)}</div>
      </div>
      <div className="chat-main">
        <div style={{padding:'14px 20px',borderBottom:'1px solid #F0F0F0',display:'flex',alignItems:'center',gap:12}}><div style={{width:38,height:38,borderRadius:10,background:(ch?.color||'#3B82F6')+'15',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>{ch?.icon}</div><div><div style={{fontSize:15,fontWeight:700}}>{ch?.label}</div><div style={{fontSize:12,color:'#9CA3AF'}}>{chMsgs.length} mensagens</div></div></div>
        <div className="chat-messages">
          {chMsgs.length===0&&<div style={{textAlign:'center',padding:'60px 20px',color:'#9CA3AF'}}><div style={{fontSize:32,marginBottom:12}}>{ch?.icon}</div><div style={{fontSize:15,fontWeight:600,marginBottom:4}}>Início do {ch?.label}</div><div style={{fontSize:13}}>Seja o primeiro a enviar uma mensagem!</div></div>}
          {chMsgs.map((msg,i)=>{const isMe=msg.user_id===user.id;const prev=chMsgs[i-1];const showHdr=!prev||prev.user_id!==msg.user_id;return(<div key={msg.id} style={{display:'flex',flexDirection:isMe?'row-reverse':'row',gap:8,alignItems:'flex-end'}}>{!isMe&&showHdr&&<div style={{width:32,height:32,borderRadius:'50%',background:getColor(msg.user_id),display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:'#fff',flexShrink:0}}>{getName(msg.user_id)[0]?.toUpperCase()}</div>}{!isMe&&!showHdr&&<div style={{width:32,flexShrink:0}}/>}<div style={{maxWidth:'70%',display:'flex',flexDirection:'column',alignItems:isMe?'flex-end':'flex-start',gap:2}}>{showHdr&&!isMe&&<div style={{fontSize:11.5,fontWeight:600,color:getColor(msg.user_id),paddingLeft:4}}>{getName(msg.user_id)}</div>}<div style={{background:isMe?(ch?.color||'#3B82F6'):'#F3F4F6',color:isMe?'#fff':'#111',padding:'9px 14px',borderRadius:isMe?'16px 16px 4px 16px':'16px 16px 16px 4px',fontSize:13.5,lineHeight:1.5,wordBreak:'break-word'}}>{msg.message}</div><div style={{fontSize:10.5,color:'#9CA3AF'}}>{fmtTime(msg.created_at)}</div></div></div>);})}
          <div ref={bottomRef}/>
        </div>
        <div style={{padding:'12px 20px',borderTop:'1px solid #F0F0F0'}}><form onSubmit={sendMsg} style={{display:'flex',gap:10,alignItems:'flex-end'}}><div style={{flex:1,background:'#F8F9FB',borderRadius:12,border:'1.5px solid #E5E7EB',padding:'8px 14px'}}><textarea value={message} onChange={e=>setMessage(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg(e);}}} placeholder={"Mensagem..."} style={{width:'100%',border:'none',background:'transparent',resize:'none',fontFamily:'inherit',fontSize:14,outline:'none',color:'#111',maxHeight:100,lineHeight:1.5}} rows={1}/></div><button type="submit" disabled={!message.trim()||sending} style={{width:42,height:42,borderRadius:10,background:message.trim()?(ch?.color||'#3B82F6'):'#E5E7EB',border:'none',cursor:message.trim()?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>➤</button></form></div>
      </div>
    </div>
  );
}










function TabOnboarding({clientId,gcOnboarding,onRefresh}){
  const my=gcOnboarding.filter(c=>c.client_id===clientId);
  const all=OPB.flatMap(f=>f.items.map((_,i)=>f.key+'_'+i));
  const done=my.filter(c=>c.done).length;
  function isChecked(fk,i){return my.find(c=>c.check_key===fk+'_'+i)?.done||false;}
  async function toggle(fk,i){const key=fk+'_'+i;const ex=my.find(c=>c.check_key===key);if(ex){await sb.from('gc_onboarding').update({done:!ex.done,updated_at:new Date().toISOString()}).eq('id',ex.id);}else{await sb.from('gc_onboarding').insert({client_id:clientId,check_key:key,done:true});}onRefresh();}
  return(<><div className="card mb"><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}><div style={{fontWeight:700}}>Progresso do Onboarding</div><span className="tag tag-blue">{done}/{all.length} — {pct(done,all.length)}%</span></div><div className="prog-wrap" style={{height:12}}><div className="prog-fill" style={{width:pct(done,all.length)+'%',background:pct(done,all.length)>=100?'#10B981':'#3B82F6'}}/></div></div>{OPB.map(fase=>{const fd=fase.items.filter((_,i)=>isChecked(fase.key,i)).length;return(<div key={fase.key} className="card mb"><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}><div style={{fontWeight:700,fontSize:14}}>{fase.label}</div><span style={{fontSize:12,color:'#9CA3AF'}}>{fd}/{fase.items.length}</span></div>{fase.items.map((item,i)=>{const checked=isChecked(fase.key,i);return(<div key={i} className="onb-check" onClick={()=>toggle(fase.key,i)}><div className={"onb-box "+(checked?'checked':'')}>{checked&&<span style={{color:'#fff',fontSize:12}}>✓</span>}</div><span style={{fontSize:14,color:checked?'#9CA3AF':'#111',textDecoration:checked?'line-through':'none'}}>{item}</span></div>);})}</div>);})}</>);
}

function TabTarefas({clientId,gcTarefas,onRefresh,toast}){

function ClienteFicha({user,profile,client,gcOnboarding,gcEstrategia,gcCalendario,gcMetricas,gcLogins,gcNps,gcConcorrentes,gcTrafego,gcTarefas,gcMetricasSemanal,onRefresh,toast,onBack}){

="flabel">Situação</label><select className="fselect" value={form.situacao||'Estável'} onChange={e=>setForm(v=>({...v,situacao:e.target.value}))}><option>Estável</option><option>Atenção</option><option>Crítico</option></select></div></div><div className="frow"><div className="fg"><label className="flabel">Orçamento (R$)</label><input className="finput" type="number" value={form.orcamento||''} onChange={e=>setForm(v=>({...v,orcamento:e.target.value}))}/></div><div className="fg"><label className="flabel">Responsável</label><input className="finput" value={form.responsavel||''} onChange={e=>setForm(v=>({...v,responsavel:e.target.value}))}/></div></div><div className="frow"><div className="fg"><label className="flabel">Telefone</label><input className="finput" value={form.telefone||''} onChange={e=>setForm(v=>({...v,telefone:e.target.value}))}/></div><div className="fg"><label className="flabel">Instagram</label><input className="finput" value={form.instagram||''} onChange={e=>setForm(v=>({...v,instagram:e.target.value}))}/></div></div><div style={{display:'flex',gap:10}}><button className="btn btn-ghost btn-sm" onClick={()=>setEditing(false)}>Cancelar</button><button className="btn btn-primary btn-sm" onClick={saveEdit} disabled={saving}>{saving?'Salvando...':'Salvar'}</button></div></div>)}</div>

function GestaoClientes({user,profile,gcClients,gcNps,onRefresh,toast,onOpenClient}){
  const isGestor=profile?.role==='gestor';
  const[search,setSearch]=useState('');const[filterStatus,setFilterStatus]=useState('');const[showAdd,setShowAdd]=useState(false);const[showChurned,setShowChurned]=useState(false);
  const[form,setForm]=useState({name:'',status:'Onboarding',produto:'',orcamento:'',situacao:'Estável',responsavel:'',telefone:'',instagram:'',observacoes:''});
  const[saving,setSaving]=useState(false);
  const filtered=gcClients.filter(c=>c.name.toLowerCase().includes(search.toLowerCase())&&(filterStatus?c.status===filterStatus:c.status!=='Churn'));
  const churnedClients=gcClients.filter(c=>c.status==='Churn'&&c.name.toLowerCase().includes(search.toLowerCase()));
  const kpis={ativos:gcClients.filter(c=>c.status==='Ativo').length,onboarding:gcClients.filter(c=>c.status==='Onboarding').length,aviso:gcClients.filter(c=>c.status==='Aviso 30 dias').length,mrr:gcClients.filter(c=>c.status==='Ativo').reduce((a,c)=>a+(c.orcamento||0),0)};
  function getLastNps(cid){const nps=gcNps.filter(n=>n.client_id===cid).sort((a,b)=>b.mes.localeCompare(a.mes));return nps[0]?.nota;}
  function npsColor(n){return n>=9?'#10B981':n>=7?'#F59E0B':'#EF4444';}
  async function saveClient(e){e.preventDefault();setSaving(true);await sb.from('gc_clients').insert({...form,created_by:user.id,orcamento:parseFloat(form.orcamento)||0});toast('✅ Cliente adicionado!');onRefresh();setShowAdd(false);setForm({name:'',status:'Onboarding',produto:'',orcamento:'',situacao:'Estável',responsavel:'',telefone:'',instagram:'',observacoes:''});setSaving(false);}
  function ClientCard(c){const nps=getLastNps(c.id);return(<div key={c.id} className="card" style={{cursor:'pointer'}} onClick={()=>onOpenClient(c)}><div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:10}}><div style={{fontWeight:700,fontSize:15}}>{c.name}</div><span className={"tag "+(GC_ST_CLR[c.status]||'tag-gray')}>{c.status}</span></div><div style={{fontSize:13,color:'#6B7280',marginBottom:4}}>{c.produto||'—'}</div><div style={{display:'flex',gap:8,alignItems:'center',marginBottom:8}}><span style={{fontSize:12,fontWeight:600,color:c.situacao==='Estável'?'#10B981':c.situacao==='Atenção'?'#F59E0B':'#EF4444'}}>● {c.situacao||'Estável'}</span>{c.orcamento>0&&<span style={{fontSize:12,color:'#9CA3AF'}}>{fmtR(c.orcamento)}/mês</span>}</div>{nps!==undefined&&<div style={{display:'flex',alignItems:'center',gap:6}}><span style={{fontSize:11,color:'#9CA3AF'}}>NPS</span><span style={{fontSize:16,fontWeight:700,color:npsColor(nps)}}>{nps}</span></div>}<div style={{fontSize:11,color:'#9CA3AF',marginTop:6}}>Ver ficha →</div></div>);}
  return(<>
