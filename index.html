const OPB=[{key:'bastao',label:'Passagem de Bastão',items:['Apresentação da equipe ao cliente','Envio de briefing inicial','Acesso às plataformas','Alinhamento de expectativas']},{key:'entrada',label:'Entrada',items:['Pesquisa de referências','Definição de identidade visual','Criação de perfis','Levantamento de concorrentes']},{key:'kickoff',label:'Reunião de Kickoff',items:['Apresentação da estratégia','Definição de metas','Aprovação do calendário inicial','Assinatura de contrato']},{key:'especialista',label:'Reunião com Especialista',items:['Análise do mercado','Definição de público-alvo','Estratégia de conteúdo','Plano de tráfego']},{key:'planejamento',label:'Reunião de Planejamento',items:['Calendário do mês','Aprovação de pautas','Definição de roteiros']},{key:'finais',label:'Ações Finais',items:['Primeiro post publicado','Primeira campanha ativa','Relatório de entrada','Check-in de satisfação']}];

function Toast({msg}){return msg?<div className="toast">{msg}</div>:null;}

function LineChart({labels,datasets}){
  const ref=useRef(null),ch=useRef(null);
  useEffect(()=>{if(!ref.current)return;if(ch.current)ch.current.destroy();ch.current=new Chart(ref.current,{type:'line',data:{labels,datasets:datasets.map(d=>({label:d.label,data:d.data,borderColor:d.color||'#3B82F6',backgroundColor:d.bg||'rgba(59,130,246,.08)',borderWidth:2.5,pointRadius:3,tension:0.4,fill:true}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:datasets.length>1,labels:{font:{family:'DM Sans',size:11},color:'#9CA3AF',boxWidth:10}}},scales:{x:{grid:{display:false},ticks:{font:{family:'DM Sans',size:10},color:'#9CA3AF'},border:{display:false}},y:{grid:{color:'#F3F4F6'},ticks:{font:{family:'DM Sans',size:10},color:'#9CA3AF'},border:{display:false}}}}});return()=>ch.current&&ch.current.destroy();},[labels,datasets]);
  return <div className="chart-wrap"><canvas ref={ref}/></div>;
}
function BarChart({labels,data,colors}){
  const ref=useRef(null),ch=useRef(null);
  useEffect(()=>{if(!ref.current)return;if(ch.current)ch.current.destroy();ch.current=new Chart(ref.current,{type:'bar',data:{labels,datasets:[{data,backgroundColor:colors||'#3B82F6',borderRadius:5,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{family:'DM Sans',size:10},color:'#9CA3AF'},border:{display:false}},y:{grid:{color:'#F3F4F6'},ticks:{font:{family:'DM Sans',size:10},color:'#9CA3AF'},border:{display:false}}}}});return()=>ch.current&&ch.current.destroy();},[labels,data]);
  return <div className="chart-sm"><canvas ref={ref}/></div>;
}
function DonutChart({labels,data,colors}){
  const ref=useRef(null),ch=useRef(null);
  useEffect(()=>{if(!ref.current)return;if(ch.current)ch.current.destroy();ch.current=new Chart(ref.current,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors||['#3B82F6','#7C3AED','#10B981','#F59E0B','#93C5FD'],borderWidth:0,hoverOffset:5}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{font:{family:'DM Sans',size:11},color:'#6B7280',boxWidth:9,padding:12}}}}});return()=>ch.current&&ch.current.destroy();},[labels,data]);
  return <div style={{position:'relative',height:185}}><canvas ref={ref}/></div>;
}

function Sidebar({profile,navItems,activeTab,onTab}){
  async function handleLogout(){await sb.auth.signOut();window.location.reload();}
  return(
    <div className="sidebar">
      <div className="sb-logo"><div className="sb-logo-text">Attos <span>Dashboard</span></div><div className="sb-role">{ROLE_LABELS[profile?.role]||'usuário'}</div></div>
      <nav className="sb-nav">
        {navItems.map(item=>item.section?<div key={item.section} className="sb-section">{item.section}</div>:<div key={item.id} className={`nav-item ${activeTab===item.id?'active':''}`} onClick={()=>onTab(item.id)}><span className="nav-icon">{item.icon}</span><span>{item.label}</span></div>)}
      </nav>
      <div className="sb-footer"><div className="user-row"><div className="u-avatar">{(profile?.name||'U')[0].toUpperCase()}</div><div className="u-name">{profile?.name||'Usuário'}</div></div><button className="logout-btn" onClick={handleLogout}>Sair</button></div>

}

function SharedDashboard({sdrEntries,closerEntries,leads,profiles,settings,dateRange}){
  const sdrs=profiles.filter(p=>p.role==='sdr'),closers=profiles.filter(p=>p.role==='closer');
  const se=sdrEntries.filter(e=>e.date>=dateRange[0]&&e.date<=dateRange[1]);
  const ce=closerEntries.filter(e=>e.date>=dateRange[0]&&e.date<=dateRange[1]);
  const totalMtgs=se.reduce((a,e)=>a+(e.meetings_booked||0),0);
  let totalClos=0,totalMRR=0;
  PRODUCTS.forEach(p=>{totalClos+=ce.reduce((a,e)=>a+(e[`closings_${p.key}`]||0),0);totalMRR+=ce.reduce((a,e)=>a+((e[`closings_${p.key}`]||0)*(e[`ticket_${p.key}`]||0)),0);});
  const totalDone=ce.reduce((a,e)=>a+(e.meetings_done||0),0);
  const sdrRanking=sdrs.map(s=>({...s,meetings:se.filter(e=>e.user_id===s.id).reduce((a,e)=>a+(e.meetings_booked||0),0)})).sort((a,b)=>b.meetings-a.meetings);
  const closerRanking=closers.map(c=>({...c,closings:PRODUCTS.reduce((a,p)=>a+ce.filter(e=>e.user_id===c.id).reduce((b,e)=>b+(e[`closings_${p.key}`]||0),0),0)})).sort((a,b)=>b.closings-a.closings);
  const funnelData=KCOLS.map(col=>({...col,count:leads.filter(l=>l.stage===col.id).length}));
  const maxF=Math.max(...funnelData.map(f=>f.count),1);
  const days14=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days14.push(d.toISOString().split('T')[0]);}
  const chartLabels=days14.map(d=>{const[,m,dd]=d.split('-');return`${dd}/${m}`;});
  const chartMtg=days14.map(d=>sdrEntries.filter(e=>e.date===d).reduce((a,e)=>a+(e.meetings_booked||0),0));
  const chartClos=days14.map(d=>closerEntries.filter(e=>e.date===d).reduce((a,e)=>PRODUCTS.reduce((b,p)=>b+(e[`closings_${p.key}`]||0),0)+a,0));
  return(
    <>
      <div className="g4">
        {[['Agendamentos',totalMtgs,'reuniões agendadas','#1E40AF','#3B82F6'],['Fechamentos',totalClos,'contratos fechados','#065F46','#10B981'],['MRR Gerado',fmtR(totalMRR),'receita recorrente','#4C1D95','#7C3AED'],['Conversão',pct(totalClos,totalDone)+'%',totalClos+' de '+totalDone+' reuniões','#92400E','#F59E0B']].map(([label,val,sub,c1,c2])=>(
          <div key={label} style={{background:'linear-gradient(135deg,'+c1+','+c2+')',borderRadius:12,padding:'20px 22px',boxShadow:'0 4px 14px '+c2+'40'}}>
            <div style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,.7)',textTransform:'uppercase',letterSpacing:.8,marginBottom:8}}>{label}</div>
            <div style={{fontSize:typeof val==='string'&&val.length>8?22:36,fontWeight:700,color:'#fff',letterSpacing:-1,lineHeight:1}}>{val}</div>
            <div style={{fontSize:12,color:'rgba(255,255,255,.6)',marginTop:4}}>{sub}</div>
          </div>
        ))}
      </div>
      <div className="card mb">
        <div className="card-title">Funil de Vendas</div>
        {funnelData.map(col=><div key={col.id} className="funnel-row"><div className="funnel-label">{col.icon} {col.label}</div><div className="funnel-bar-wrap"><div className="funnel-bar-fill" style={{width:Math.max(pct(col.count,maxF),col.count>0?5:0)+'%',background:KCOL_COLORS[col.id]}}>{col.count>0?col.count:''}</div></div><div className="funnel-count">{col.count}</div></div>)}
      </div>
      <div className="g2">
        <div className="card"><div className="card-title">Agendamentos e Fechamentos — 14 dias</div><LineChart labels={chartLabels} datasets={[{label:'Agendamentos',data:chartMtg,color:'#3B82F6',bg:'rgba(59,130,246,.08)'},{label:'Fechamentos',data:chartClos,color:'#10B981',bg:'rgba(16,185,129,.06)'}]}/></div>
        <div className="card"><div className="card-title">MRR por Produto</div><DonutChart labels={PRODUCTS.map(p=>p.label)} data={PRODUCTS.map(p=>ce.reduce((a,e)=>a+((e[`closings_${p.key}`]||0)*(e[`ticket_${p.key}`]||0)),0))} colors={PRODUCTS.map(p=>p.color)}/></div>
      </div>
      <div className="g2">
        <div className="card"><div className="card-title">🏆 Ranking SDRs</div>{sdrRanking.length===0?<div className="empty"><div className="empty-icon">📞</div>Sem SDRs</div>:sdrRanking.map((s,i)=><div key={s.id} className="rank-item"><div className={`rank-num ${i===0?'rn-1':i===1?'rn-2':i===2?'rn-3':'rn-n'}`}>{i+1}</div><div className="rank-name">{s.name}</div><div className="rank-val">{s.meetings}</div></div>)}</div>
        <div className="card"><div className="card-title">🏆 Ranking Closers</div>{closerRanking.length===0?<div className="empty"><div className="empty-icon">🎯</div>Sem Closers</div>:closerRanking.map((c,i)=><div key={c.id} className="rank-item"><div className={`rank-num ${i===0?'rn-1':i===1?'rn-2':i===2?'rn-3':'rn-n'}`}>{i+1}</div><div className="rank-name">{c.name}</div><div className="rank-val">{c.closings}</div></div>)}</div>
      </div>
      <div className="card mb"><div className="card-title">Fechamentos por Produto</div><BarChart labels={PRODUCTS.map(p=>p.label)} data={PRODUCTS.map(p=>ce.reduce((a,e)=>a+(e[`closings_${p.key}`]||0),0))} colors={PRODUCTS.map(p=>p.color)}/></div>
    </>
  );
}

function CRMKanban({leads,profiles,currentUser,currentProfile,onLeadsChange,toast}){
  const[showModal,setShowModal]=useState(false);const[editLead,setEditLead]=useState(null);const[viewLead,setViewLead]=useState(null);
  const closers=profiles.filter(p=>p.role==='closer');
  const empty={name:'',company:'',phone:'',product:'',closer_id:'',meeting_date:'',est_value:'',observations:'',stage:'lead_quente'};
  const[form,setForm]=useState(empty);
  const getName=id=>profiles.find(p=>p.id===id)?.name||'—';
  const canEdit=lead=>currentProfile?.role==='gestor'||lead.sdr_id===currentUser.id;
  function openNew(){setForm(empty);setEditLead(null);setShowModal(true);}
  function openEdit(l){setForm({...l,est_value:l.est_value||''});setEditLead(l);setShowModal(true);}
  async function saveLead(){
    const p={...form,sdr_id:editLead?editLead.sdr_id:currentUser.id,est_value:parseFloat(form.est_value)||0,meeting_date:form.meeting_date||null,closer_id:form.closer_id||null,updated_at:new Date().toISOString()};
    if(editLead){const{error}=await sb.from('leads').update(p).eq('id',editLead.id);if(error)toast('Erro: '+error.message);else{toast('Lead atualizado!');onLeadsChange();}}
    else{const{error}=await sb.from('leads').insert(p);if(error)toast('Erro: '+error.message);else{toast('✅ Lead cadastrado!');onLeadsChange();}}
    setShowModal(false);
  }
  async function moveStage(lead,ns){await sb.from('leads').update({stage:ns,updated_at:new Date().toISOString()}).eq('id',lead.id);toast('Movido');onLeadsChange();}
  async function del(id){if(!confirm('Remover lead?'))return;await sb.from('leads').delete().eq('id',id);toast('Removido');onLeadsChange();}
  const[dragId,setDragId]=useState(null);const[dragOver,setDragOver]=useState(null);
  function onDragStart(e,leadId){setDragId(leadId);e.dataTransfer.effectAllowed='move';}
  function onDragOver(e,colId){e.preventDefault();setDragOver(colId);}
  function onDragLeave(){setDragOver(null);}
  async function onDrop(e,colId){e.preventDefault();setDragOver(null);if(!dragId)return;const lead=leads.find(l=>l.id===dragId);if(!lead||lead.stage===colId){setDragId(null);return;}await moveStage(lead,colId);setDragId(null);}
  const[viewMode,setViewMode]=useState('kanban');
  const totalPipe=leads.reduce((a,l)=>a+(l.est_value||0),0);
  const totalAtivo=leads.filter(l=>!['fechado','perdido'].includes(l.stage)).reduce((a,l)=>a+(l.est_value||0),0);
  return(
    <>
      <div className="g4">
        <div className="card"><div className="card-title">Total Pipeline</div><div className="metric-big" style={{fontSize:22}}>{fmtR(totalPipe)}</div><div className="metric-sub">{leads.length} leads</div></div>
        <div className="card"><div className="card-title">Pipeline Ativo</div><div className="metric-big" style={{fontSize:22,color:'#3B82F6'}}>{fmtR(totalAtivo)}</div><div className="metric-sub">{leads.filter(l=>!['fechado','perdido'].includes(l.stage)).length} ativos</div></div>
        <div className="card"><div className="card-title">Fechados</div><div className="metric-big" style={{fontSize:22,color:'#10B981'}}>{fmtR(leads.filter(l=>l.stage==='fechado').reduce((a,l)=>a+(l.est_value||0),0))}</div><div className="metric-sub">{leads.filter(l=>l.stage==='fechado').length} contratos</div></div>
        <div className="card"><div className="card-title">Perdidos</div><div className="metric-big" style={{fontSize:22,color:'#EF4444'}}>{fmtR(leads.filter(l=>l.stage==='perdido').reduce((a,l)=>a+(l.est_value||0),0))}</div><div className="metric-sub">{leads.filter(l=>l.stage==='perdido').length} leads</div></div>
      </div>
      <div className="sec-hdr"><h2>Pipeline</h2><div style={{display:'flex',gap:8}}>
        <div style={{display:'flex',background:'#F0F0F0',borderRadius:8,padding:3,gap:2}}>
          <button onClick={()=>setViewMode('kanban')} style={{padding:'5px 10px',borderRadius:6,border:'none',background:viewMode==='kanban'?'#fff':'transparent',fontWeight:viewMode==='kanban'?600:400,fontSize:12,cursor:'pointer',fontFamily:'inherit'}}>Kanban</button>
          <button onClick={()=>setViewMode('lista')} style={{padding:'5px 10px',borderRadius:6,border:'none',background:viewMode==='lista'?'#fff':'transparent',fontWeight:viewMode==='lista'?600:400,fontSize:12,cursor:'pointer',fontFamily:'inherit'}}>Lista</button>
        </div>
        <button className="btn btn-primary btn-sm" onClick={openNew}>+ Novo Lead</button>
      </div></div>
      {viewMode==='lista'&&<div className="card mb"><div className="tbl-wrap"><table><thead><tr><th>Lead</th><th>Produto</th><th>Closer</th><th>Reunião</th><th>Valor</th><th>Etapa</th><th></th></tr></thead><tbody>{leads.length===0?<tr><td colSpan={7} style={{textAlign:'center',color:'#9CA3AF'}}>Nenhum lead</td></tr>:leads.map(l=><tr key={l.id}><td><strong>{l.name}</strong>{l.company&&<div style={{fontSize:11.5,color:'#9CA3AF'}}>{l.company}</div>}</td><td>{PRODUCTS.find(p=>p.key===l.product)?.label||'—'}</td><td>{getName(l.closer_id)}</td><td>{fmtDate(l.meeting_date)}</td><td style={{color:'#3B82F6',fontWeight:600}}>{l.est_value>0?fmtR(l.est_value):'—'}</td><td><span style={{background:KCOL_COLORS[l.stage]+'20',color:KCOL_COLORS[l.stage],borderRadius:99,padding:'2px 8px',fontSize:12,fontWeight:600}}>{KCOLS.find(c=>c.id===l.stage)?.label}</span></td><td><div style={{display:'flex',gap:4}}><button className="btn btn-ghost btn-xs" onClick={()=>setViewLead(l)}>Ver</button>{canEdit(l)&&<button className="btn btn-ghost btn-xs" onClick={()=>openEdit(l)}>Editar</button>}</div></td></tr>)}</tbody></table></div></div>}
      {viewMode==='kanban'&&<div className="kanban-board">{KCOLS.map(col=>{const colLeads=leads.filter(l=>l.stage===col.id);const isOver=dragOver===col.id;return(<div key={col.id} className={`kanban-col ${col.cls}`} style={{outline:isOver?'2px dashed #3B82F6':'none',outlineOffset:2,background:isOver?'#EFF6FF':''}} onDragOver={e=>onDragOver(e,col.id)} onDragLeave={onDragLeave} onDrop={e=>onDrop(e,col.id)}><div className="k-col-hdr"><div className="k-col-title"><span>{col.icon}</span><span>{col.label}</span></div><span className="k-col-cnt">{colLeads.length}</span></div><div className="k-cards">{colLeads.length===0&&<div style={{fontSize:12,color:'#9CA3AF',textAlign:'center',padding:'20px 0'}}>Sem leads</div>}{colLeads.map(lead=><div key={lead.id} className="k-card" draggable onDragStart={e=>onDragStart(e,lead.id)} style={{opacity:dragId===lead.id?0.5:1,cursor:'grab'}}><div style={{fontSize:10,color:'#CBD5E1',marginBottom:4}}>ARRASTAR</div><div className="kc-name">{lead.name}</div>{lead.company&&<div className="kc-info">{lead.company}</div>}<div className="kc-info">{PRODUCTS.find(p=>p.key===lead.product)?.icon} {PRODUCTS.find(p=>p.key===lead.product)?.label||'—'}</div>{lead.closer_id&&<div className="kc-info">🎯 {getName(lead.closer_id)}</div>}{lead.meeting_date&&<div className="kc-info">📅 {fmtDate(lead.meeting_date)}</div>}{lead.est_value>0&&<div style={{fontSize:12,fontWeight:600,color:'#3B82F6',marginTop:3}}>{fmtR(lead.est_value)}</div>}<div className="kc-actions"><button className="btn btn-ghost btn-xs" onClick={()=>setViewLead(lead)}>Ver</button>{canEdit(lead)&&<button className="btn btn-ghost btn-xs" onClick={()=>openEdit(lead)}>Editar</button>}</div></div>)}</div></div>);})}
      </div>}
      {showModal&&<div className="overlay" onClick={()=>setShowModal(false)}><div className="modal modal-lg" onClick={e=>e.stopPropagation()}><div className="modal-title">{editLead?'Editar Lead':'Novo Lead'}</div><div className="frow"><div className="fg"><label className="flabel">Nome *</label><input className="finput" value={form.name} onChange={e=>setForm(v=>({...v,name:e.target.value}))} placeholder="Nome"/></div><div className="fg"><label className="flabel">Empresa</label><input className="finput" value={form.company||''} onChange={e=>setForm(v=>({...v,company:e.target.value}))}/></div></div><div className="frow"><div className="fg"><label className="flabel">WhatsApp</label><input className="finput" value={form.phone||''} onChange={e=>setForm(v=>({...v,phone:e.target.value}))}/></div><div className="fg"><label className="flabel">Produto</label><select className="fselect" value={form.product||''} onChange={e=>setForm(v=>({...v,product:e.target.value}))}><option value="">Selecionar...</option>{PRODUCTS.map(p=><option key={p.key} value={p.key}>{p.icon} {p.label}</option>)}</select></div></div><div className="frow"><div className="fg"><label className="flabel">Closer</label><select className="fselect" value={form.closer_id||''} onChange={e=>setForm(v=>({...v,closer_id:e.target.value}))}><option value="">Selecionar...</option>{closers.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div><div className="fg"><label className="flabel">Data da Reunião</label><input className="finput" type="date" value={form.meeting_date||''} onChange={e=>setForm(v=>({...v,meeting_date:e.target.value}))}/></div></div><div className="frow"><div className="fg"><label className="flabel">Valor Estimado (R$)</label><input className="finput" type="number" value={form.est_value||''} onChange={e=>setForm(v=>({...v,est_value:e.target.value}))}/></div><div className="fg"><label className="flabel">Etapa</label><select className="fselect" value={form.stage} onChange={e=>setForm(v=>({...v,stage:e.target.value}))}>{KCOLS.map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}</select></div></div><div className="fg"><label className="flabel">Observações</label><textarea className="ftextarea" value={form.observations||''} onChange={e=>setForm(v=>({...v,observations:e.target.value}))}/></div><div className="modal-footer">{editLead&&<button className="btn btn-danger" onClick={()=>{del(editLead.id);setShowModal(false);}}>Remover</button>}<button className="btn btn-ghost" onClick={()=>setShowModal(false)}>Cancelar</button><button className="btn btn-primary" onClick={saveLead} disabled={!form.name}>Salvar</button></div></div></div>}
      {viewLead&&<div className="overlay" onClick={()=>setViewLead(null)}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-title">📋 {viewLead.name}</div><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px 20px',fontSize:13.5}}>{[['Empresa',viewLead.company||'—'],['WhatsApp',viewLead.phone||'—'],['Produto',PRODUCTS.find(p=>p.key===viewLead.product)?.label||'—'],['Closer',getName(viewLead.closer_id)],['SDR',getName(viewLead.sdr_id)],['Reunião',fmtDate(viewLead.meeting_date)],['Valor Est.',viewLead.est_value>0?fmtR(viewLead.est_value):'—'],['Etapa',KCOLS.find(c=>c.id===viewLead.stage)?.label||'—']].map(([k,v])=><div key={k}><span style={{color:'#9CA3AF',fontSize:12}}>{k}</span><div style={{fontWeight:600,marginTop:2}}>{v}</div></div>)}</div>{viewLead.observations&&<div style={{marginTop:16,padding:12,background:'#F8F9FB',borderRadius:8,fontSize:13.5}}>{viewLead.observations}</div>}<div className="modal-footer"><button className="btn btn-ghost" onClick={()=>setViewLead(null)}>Fechar</button></div></div></div>}
    </>
  );
}

function ReunioesSemana({leads,profiles,currentUser,currentProfile,toast,onCloserEntryChange}){
  const[ws,we]=getWeekRange();
  const isGestor=currentProfile?.role==='gestor',isCloser=currentProfile?.role==='closer';
  const weekLeads=leads.filter(l=>l.stage==='reuniao_agendada'&&l.meeting_date&&l.meeting_date>=ws&&l.meeting_date<=we);
  const myLeads=isCloser?weekLeads.filter(l=>l.closer_id===currentUser.id):weekLeads;
  const getName=id=>profiles.find(p=>p.id===id)?.name||'—';
  const closers=profiles.filter(p=>p.role==='closer');
  async function markStatus(lead,status){
    await sb.from('closer_entries').insert({user_id:lead.closer_id||currentUser.id,date:today(),meetings_done:status==='realizada'?1:0,meetings_noshow:status==='noshow'?1:0,proposals_sent:0,closings_contabilidade:0,ticket_contabilidade:0,closings_bpo:0,ticket_bpo:0,closings_marketing:0,ticket_marketing:0,closings_comercial:0,ticket_comercial:0,closing_days:0});
    if(status==='realizada')await sb.from('leads').update({stage:'proposta_enviada',updated_at:new Date().toISOString()}).eq('id',lead.id);
    toast(status==='realizada'?'✅ Reunião realizada!':'⚠️ No-show registrado!');
    onCloserEntryChange();
  }

function GestorConfig({profiles,settings,toast,reload}){
  const[goals,setGoals]=useState({});const[wg,setWg]=useState('8');const[showAdd,setShowAdd]=useState(false);const[newUser,setNewUser]=useState({name:'',email:'',password:'',role:'sdr'});const[saving,setSaving]=useState(false);

  async function saveGoal(k){const ng={...settings.goals,[k]:{type:goals[k]?.type,target:parseFloat(goals[k]?.target)||0}};await sb.from('settings').upsert({key:'goals',value:ng,updated_at:new Date().toISOString()});toast('Meta salva!');}

  </>);
}

  const meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

  const dateStr=`${dias[now.getDay()]}, ${now.getDate()} de ${meses[now.getMonth()]}`;

const OP_TASK_COLS=[{id:'todo',label:'A Fazer',icon:'📋',color:'#F59E0B'},{id:'doing',label:'Fazendo',icon:'⚡',color:'#3B82F6'},{id:'done',label:'Concluído',icon:'✅',color:'#10B981'}];

function OpTaskKanban({user,opTasks,onRefresh,toast,roleType,readOnly}){
  const[showAdd,setShowAdd]=useState(false);
  const[taskForm,setTaskForm]=useState({title:'',description:'',priority:'normal'});
  const[saving,setSaving]=useState(false);
  const[dragId,setDragId]=useState(null);
  const[dragOver,setDragOver]=useState(null);
  const today_=today();
  const myTasks=readOnly?opTasks.filter(t=>t.task_date===today_):opTasks.filter(t=>t.user_id===user.id&&t.task_date===today_);
  function onDragStart(e,id){setDragId(id);e.dataTransfer.effectAllowed='move';}
  function onDragOver(e,col){e.preventDefault();setDragOver(col);}
  function onDragLeave(){setDragOver(null);}
  async function onDrop(e,col){e.preventDefault();setDragOver(null);if(!dragId)return;await sb.from('op_tasks').update({status:col,updated_at:new Date().toISOString()}).eq('id',dragId);setDragId(null);onRefresh();}
  async function saveTask(e){e.preventDefault();setSaving(true);const{error}=await sb.from('op_tasks').insert({user_id:user.id,role_type:roleType,title:taskForm.title,description:taskForm.description,priority:taskForm.priority,status:'todo',task_date:today_});if(error)toast('Erro: '+error.message);else{toast('✅ Tarefa adicionada!');setTaskForm({title:'',description:'',priority:'normal'});setShowAdd(false);onRefresh();}setSaving(false);}
  async function deleteTask(id){await sb.from('op_tasks').delete().eq('id',id);onRefresh();}
  const priorityColor={urgent:'#EF4444',high:'#F59E0B',normal:'#3B82F6',low:'#9CA3AF'};
  const priorityLabel={urgent:'🔴 Urgente',high:'🟡 Alta',normal:'🔵 Normal',low:'⚪ Baixa'};
  return(<>
    <div className="sec-hdr"><h2>Tarefas do Dia</h2>{!readOnly&&<button className="btn btn-primary btn-sm" onClick={()=>setShowAdd(true)}>+ Tarefa</button>}</div>
    <div className="kanban-board" style={{minHeight:320}}>
      {OP_TASK_COLS.map(col=>{const colTasks=myTasks.filter(t=>t.status===col.id);const isOver=dragOver===col.id;return(<div key={col.id} style={{background:isOver?`${col.color}10`:'#F8F9FB',border:`1px solid ${isOver?col.color:'#F0F0F0'}`,borderTop:`3px solid ${col.color}`,borderRadius:12,minWidth:210,width:210,flexShrink:0,display:'flex',flexDirection:'column'}} onDragOver={e=>onDragOver(e,col.id)} onDragLeave={onDragLeave} onDrop={e=>onDrop(e,col.id)}><div style={{padding:'12px 14px 10px',borderBottom:'1px solid #F0F0F0',display:'flex',alignItems:'center',justifyContent:'space-between'}}><div style={{fontSize:12.5,fontWeight:700,display:'flex',alignItems:'center',gap:7}}><span>{col.icon}</span><span>{col.label}</span></div><span style={{background:'#F0F0F0',color:'#6B7280',borderRadius:99,fontSize:11,fontWeight:700,padding:'1px 7px'}}>{colTasks.length}</span></div><div style={{flex:1,padding:10,display:'flex',flexDirection:'column',gap:8,overflowY:'auto'}}>{colTasks.length===0&&<div style={{fontSize:12,color:'#9CA3AF',textAlign:'center',padding:'20px 0'}}>Vazio</div>}{colTasks.map(task=><div key={task.id} draggable={!readOnly} onDragStart={e=>onDragStart(e,task.id)} style={{background:'#fff',border:'1px solid #F0F0F0',borderLeft:`3px solid ${priorityColor[task.priority]||'#3B82F6'}`,borderRadius:9,padding:12,cursor:readOnly?'default':'grab',opacity:dragId===task.id?0.5:1}}><div style={{fontSize:13.5,fontWeight:600,marginBottom:3}}>{task.title}</div>{task.description&&<div style={{fontSize:12,color:'#6B7280',marginBottom:5}}>{task.description}</div>}<div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}><span style={{fontSize:11,fontWeight:600,color:priorityColor[task.priority]||'#3B82F6'}}>{priorityLabel[task.priority]||'Normal'}</span>{!readOnly&&<button onClick={()=>deleteTask(task.id)} style={{background:'none',border:'none',cursor:'pointer',fontSize:14,color:'#9CA3AF',padding:0}}>✕</button>}</div></div>)}</div></div>);})}
    </div>
    {showAdd&&<div className="overlay" onClick={()=>setShowAdd(false)}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-title">Nova Tarefa</div><form onSubmit={saveTask}><div className="fg"><label className="flabel">Título *</label><input className="finput" required value={taskForm.title} onChange={e=>setTaskForm(v=>({...v,title:e.target.value}))}/></div><div className="fg"><label className="flabel">Descrição</label><textarea className="ftextarea" value={taskForm.description} onChange={e=>setTaskForm(v=>({...v,description:e.target.value}))} style={{minHeight:60}}/></div><div className="fg"><label className="flabel">Prioridade</label><select className="fselect" value={taskForm.priority} onChange={e=>setTaskForm(v=>({...v,priority:e.target.value}))}><option value="urgent">🔴 Urgente</option><option value="high">🟡 Alta</option><option value="normal">🔵 Normal</option><option value="low">⚪ Baixa</option></select></div><div className="modal-footer"><button type="button" className="btn btn-ghost" onClick={()=>setShowAdd(false)}>Cancelar</button><button type="submit" className="btn btn-primary" disabled={saving}>{saving?'Salvando...':'Adicionar'}</button></div></form></div></div>}
  </>);

iv style={{fontSize:18,fontWeight:700,color:'#10B981'}}>{fmtR(totalRev)}</div></div><div style={{background:'#F8F9FB',borderRadius:8,padding:'12px 14px'}}><div style={{fontSize:11,color:'#9CA3AF',marginBottom:4,fontWeight:600}}>CONVERSAS</div><div style={{fontSize:18,fontWeight:700}}>{entries.reduce((a,e)=>a+(e.conversas||0),0)}</div></div><div style={{background:'#F8F9FB',borderRadius:8,padding:'12px 14px'}}><div style={{fontSize:11,color:'#9CA3AF',marginBottom:4,fontWeight:600}}>FECHAMENTOS</div><div style={{fontSize:18,fontWeight:700,color:'#3B82F6'}}>{entries.reduce((a,e)=>a+(e.fechamentos||0),0)}</div></div></div>{entries.length>0&&<div style={{marginBottom:16}}><div style={{fontWeight:600,fontSize:13.5,marginBottom:8}}>Histórico Semanal</div><div className="tbl-wrap"><table><thead><tr><th>Semana</th><th>Invest.</th><th>Retorno</th><th>Conversas</th><th>Fechamentos</th></tr></thead><tbody>{entries.map(e=><tr key={e.id}><td>S{e.week_number}</td><td>{fmtR(e.investimento)}</td><td style={{color:'#10B981',fontWeight:600}}>{fmtR(e.retorno)}</td><td>{e.conversas}</td><td>{e.fechamentos}</td></tr>)}</tbody></table></div></div>}<div style={{background:'#F0F9FF',border:'1px solid #BAE6FD',borderRadius:10,padding:16}}><div style={{fontWeight:600,fontSize:13.5,marginBottom:12,color:'#0369A1'}}>+ Semana {entries.length+1}</div><div className="frow"><div className="fg"><label className="flabel">Investimento (R$)</label><input className="finput" type="number" step="0.01" value={weekForm.investimento} onChange={e=>setWeekForm(v=>({...v,investimento:e.target.value}))}/></div><div className="fg"><label className="flabel">Retorno (R$)</label><input className="finput" type="number" step="0.01" value={weekForm.retorno} onChange={e=>setWeekForm(v=>({...v,retorno:e.target.value}))}/></div></div><div className="frow"><div className="fg"><label className="flabel">Conversas</label><input className="finput" type="number" min={0} value={weekForm.conversas} onChange={e=>setWeekForm(v=>({...v,conversas:e.target.value}))}/></div><div className="fg"><label className="flabel">Fechamentos</label><input className="finput" type="number" min={0} value={weekForm.fechamentos} onChange={e=>setWeekForm(v=>({...v,fechamentos:e.target.value}))}/></div></div><button className="btn btn-primary btn-sm" onClick={()=>saveWeekEntry(c.id)} disabled={saving}>{saving?'Salvando...':'✓ Salvar'}</button></div></div>}</div>);})}

function ChatInterno({user,profile,chatMessages,profiles,onRefresh}){
  const role=profile?.role||'gestor';
  const myChs=Object.values(CHAT_CHS).filter(ch=>ch.roles.includes(role));
  const[activeCh,setActiveCh]=useState(myChs[0]?.id||'comercial');
  const[message,setMessage]=useState('');
  const[sending,setSending]=useState(false);
  const bottomRef=useRef(null);
  const chMsgs=chatMessages.filter(m=>m.channel===activeCh).sort((a,b)=>a.created_at?.localeCompare(b.created_at));
  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:'smooth'});},[chMsgs.length,activeCh]);
  function getName(id){return profiles.find(p=>p.id===id)?.name||'Usuário';}
  function getColor(id){const colors=['#3B82F6','#7C3AED','#10B981','#F59E0B','#EF4444','#EC4899'];return colors[id?id.charCodeAt(0)%colors.length:0];}
  function fmtTime(ts){if(!ts)return'';const d=new Date(ts);const now=new Date();return d.toDateString()===now.toDateString()?d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
  async function sendMsg(e){e.preventDefault();if(!message.trim())return;setSending(true);await sb.from('chat_messages').insert({user_id:user.id,channel:activeCh,message:message.trim()});setMessage('');setSending(false);onRefresh();}
  const ch=CHAT_CHS[activeCh];
  return(
    <div className="chat-wrap">
      <div className="chat-sidebar">
        <div style={{padding:'16px 16px 12px',borderBottom:'1px solid #F0F0F0'}}><div style={{fontSize:13,fontWeight:700,color:'#111',marginBottom:2}}>Mensagens</div><div style={{fontSize:11.5,color:'#9CA3AF'}}>Comunicação interna</div></div>

        <div style={{padding:'12px 16px',borderTop:'1px solid #F0F0F0'}}><div style={{fontSize:11,fontWeight:700,color:'#9CA3AF',textTransform:'uppercase',letterSpacing:.6,marginBottom:8}}>Membros</div>{profiles.filter(p=>CHAT_CHS[activeCh]?.roles.includes(p.role)).map(p=><div key={p.id} style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}><div style={{width:24,height:24,borderRadius:'50%',background:getColor(p.id),display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:'#fff',flexShrink:0}}>{(p.name||'U')[0].toUpperCase()}</div><div style={{fontSize:12,color:'#374151'}}>{p.name}</div></div>)}</div>
      </div>
      <div className="chat-main">
        <div style={{padding:'14px 20px',borderBottom:'1px solid #F0F0F0',display:'flex',alignItems:'center',gap:12}}><div style={{width:38,height:38,borderRadius:10,background:(ch?.color||'#3B82F6')+'15',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>{ch?.icon}</div><div><div style={{fontSize:15,fontWeight:700}}>{ch?.label}</div><div style={{fontSize:12,color:'#9CA3AF'}}>{chMsgs.length} mensagens</div></div></div>
        <div className="chat-messages">
          {chMsgs.length===0&&<div style={{textAlign:'center',padding:'60px 20px',color:'#9CA3AF'}}><div style={{fontSize:32,marginBottom:12}}>{ch?.icon}</div><div style={{fontSize:15,fontWeight:600,marginBottom:4}}>Início do {ch?.label}</div><div style={{fontSize:13}}>Seja o primeiro a enviar uma mensagem!</div></div>}
          {chMsgs.map((msg,i)=>{const isMe=msg.user_id===user.id;const prev=chMsgs[i-1];const showHdr=!prev||prev.user_id!==msg.user_id;return(<div key={msg.id} style={{display:'flex',flexDirection:isMe?'row-reverse':'row',gap:8,alignItems:'flex-end'}}>{!isMe&&showHdr&&<div style={{width:32,height:32,borderRadius:'50%',background:getColor(msg.user_id),display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:'#fff',flexShrink:0}}>{getName(msg.user_id)[0]?.toUpperCase()}</div>}{!isMe&&!showHdr&&<div style={{width:32,flexShrink:0}}/>}<div style={{maxWidth:'70%',display:'flex',flexDirection:'column',alignItems:isMe?'flex-end':'flex-start',gap:2}}>{showHdr&&!isMe&&<div style={{fontSize:11.5,fontWeight:600,color:getColor(msg.user_id),paddingLeft:4}}>{getName(msg.user_id)}</div>}<div style={{background:isMe?(ch?.color||'#3B82F6'):'#F3F4F6',color:isMe?'#fff':'#111',padding:'9px 14px',borderRadius:isMe?'16px 16px 4px 16px':'16px 16px 16px 4px',fontSize:13.5,lineHeight:1.5,wordBreak:'break-word'}}>{msg.message}</div><div style={{fontSize:10.5,color:'#9CA3AF'}}>{fmtTime(msg.created_at)}</div></div></div>);})}
          <div ref={bottomRef}/>
        </div>
        <div style={{padding:'12px 20px',borderTop:'1px solid #F0F0F0'}}><form onSubmit={sendMsg} style={{display:'flex',gap:10,alignItems:'flex-end'}}><div style={{flex:1,background:'#F8F9FB',borderRadius:12,border:'1.5px solid #E5E7EB',padding:'8px 14px'}}><textarea value={message} onChange={e=>setMessage(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg(e);}}} placeholder={"Mensagem para "+ch?.label+"..."} style={{width:'100%',border:'none',background:'transparent',resize:'none',fontFamily:'inherit',fontSize:14,outline:'none',color:'#111',maxHeight:100,lineHeight:1.5}} rows={1}/></div><button type="submit" disabled={!message.trim()||sending} style={{width:42,height:42,borderRadius:10,background:message.trim()?(ch?.color||'#3B82F6'):'#E5E7EB',border:'none',cursor:message.trim()?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>➤</button></form></div>
      </div>
    </div>
  );
}

function TabOnboarding({clientId,gcOnboarding,onRefresh}){
  const my=gcOnboarding.filter(c=>c.client_id===clientId);
  const all=OPB.flatMap(f=>f.items.map((_,i)=>f.key+'_'+i));
  const done=my.filter(c=>c.done).length;
  function isChecked(fk,i){return my.find(c=>c.check_key===fk+'_'+i)?.done||false;}
  async function toggle(fk,i){const key=fk+'_'+i;const ex=my.find(c=>c.check_key===key);if(ex){await sb.from('gc_onboarding').update({done:!ex.done,updated_at:new Date().toISOString()}).eq('id',ex.id);}else{await sb.from('gc_onboarding').insert({client_id:clientId,check_key:key,done:true});}onRefresh();}

    {showN&&<div className="overlay" onClick={()=>setShowN(false)}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-title">Lançar NPS</div><form onSubmit={saveN}><div className="frow"><div className="fg"><label className="flabel">Mês (AAAA-MM)</label><input className="finput" required value={nForm.mes} onChange={e=>setNForm(v=>({...v,mes:e.target.value}))} placeholder="2026-05"/></div><div className="fg"><label className="flabel">Nota (0-10)</label><input className="finput" type="number" min={0} max={10} required value={nForm.nota} onChange={e=>setNForm(v=>({...v,nota:e.target.value}))}/></div></div><div className="fg"><label className="flabel">O que poderia melhorar?</label><textarea className="ftextarea" value={nForm.pergunta_melhora} onChange={e=>setNForm(v=>({...v,pergunta_melhora:e.target.value}))}/></div><div className="fg"><label className="flabel">O que mais agradou?</label><textarea className="ftextarea" value={nForm.pergunta_agradou} onChange={e=>setNForm(v=>({...v,pergunta_agradou:e.target.value}))}/></div><div className="fg"><label className="flabel">Indicaria?</label><input className="finput" value={nForm.indicaria} onChange={e=>setNForm(v=>({...v,indicaria:e.target.value}))} placeholder="Sim / Não / Talvez"/></div><div className="modal-footer"><button type="button" className="btn btn-ghost" onClick={()=>setShowN(false)}>Cancelar</button><button type="submit" className="btn btn-primary" disabled={saving}>{saving?'Salvando...':'Salvar'}</button></div></form></div></div>}
  </div>);

  function toast(msg){setToastMsg(msg);setTimeout(()=>setToastMsg(''),3000);}
  const dateRange=useMemo(()=>getPeriodRange(period),[period]);
  useEffect(()=>{sb.auth.getSession().then(async({data:{session}})=>{if(session){const{data:prof}=await sb.from('profiles').select('*').eq('id',session.user.id).single();setUser(session.user);setProfile(prof);}setLoading(false);});},[]);
  useEffect(()=>{if(!user)return;loadAll();
    const channels=[
      sb.channel('rt1').on('postgres_changes',{event:'*',schema:'public',table:'sdr_entries'},()=>loadSdr()).subscribe(),
      sb.channel('rt2').on('postgres_changes',{event:'*',schema:'public',table:'closer_entries'},()=>loadCloser()).subscribe(),
      sb.channel('rt3').on('postgres_changes',{event:'*',schema:'public',table:'leads'},()=>loadLeads()).subscribe(),
      sb.channel('rt4').on('postgres_changes',{event:'*',schema:'public',table:'settings'},()=>loadSettings()).subscribe(),
      sb.channel('rt5').on('postgres_changes',{event:'*',schema:'public',table:'profiles'},()=>loadProfiles()).subscribe(),
      sb.channel('rt6').on('postgres_changes',{event:'*',schema:'public',table:'op_clients'},()=>loadOp()).subscribe(),
      sb.channel('rt7').on('postgres_changes',{event:'*',schema:'public',table:'op_entries'},()=>loadOp()).subscribe(),
      sb.channel('rt8').on('postgres_changes',{event:'*',schema:'public',table:'op_solicitacoes'},()=>loadOp()).subscribe(),
      sb.channel('rt9').on('postgres_changes',{event:'*',schema:'public',table:'op_tasks'},()=>loadOpTasks()).subscribe(),
      sb.channel('rt10').on('postgres_changes',{event:'*',schema:'public',table:'chat_messages'},()=>loadChat()).subscribe(),
      sb.channel('rt11').on('postgres_changes',{event:'*',schema:'public',table:'gc_clients'},()=>loadGC()).subscribe(),
      sb.channel('rt12').on('postgres_changes',{event:'*',schema:'public',table:'gc_calendario'},()=>loadGC()).subscribe(),
    ];
    return()=>channels.forEach(c=>sb.removeChannel(c));
  },[user]);
  async function loadChat(){const{data}=await sb.from('chat_messages').select('*').order('created_at',{ascending:true}).limit(300);if(data)setChatMessages(data);}
  async function loadGC(){const[c1,c2,c3,c4,c5,c6,c7,c8,c9,c10]=await Promise.all([sb.from('gc_clients').select('*').order('created_at',{ascending:true}),sb.from('gc_onboarding').select('*'),sb.from('gc_estrategia').select('*'),sb.from('gc_calendario').select('*').order('created_at',{ascending:true}),sb.from('gc_metricas').select('*').order('created_at',{ascending:true}),sb.from('gc_roteiros').select('*').order('created_at',{ascending:true}),sb.from('gc_atas').select('*').order('created_at',{ascending:true}),sb.from('gc_logins').select('*').order('created_at',{ascending:true}),sb.from('gc_churns').select('*').order('created_at',{ascending:true}),sb.from('gc_nps').select('*').order('created_at',{ascending:true})]);if(c1.data)setGcClients(c1.data);if(c2.data)setGcOnboarding(c2.data);if(c3.data)setGcEstrategia(c3.data);if(c4.data)setGcCalendario(c4.data);if(c5.data)setGcMetricas(c5.data);if(c6.data)setGcRoteiros(c6.data);if(c7.data)setGcAtas(c7.data);if(c8.data)setGcLogins(c8.data);if(c9.data)setGcChurns(c9.data);if(c10.data)setGcNps(c10.data);}
  async function loadAll(){await Promise.all([loadSdr(),loadCloser(),loadLeads(),loadProfiles(),loadSettings(),loadOp(),loadOpTasks(),loadChat(),loadGC()]);}
  async function loadSdr(){const{data}=await sb.from('sdr_entries').select('*');setSdrEntries(data||[]);}
  async function loadCloser(){const{data}=await sb.from('closer_entries').select('*');setCloserEntries(data||[]);}
  async function loadLeads(){const{data,error}=await sb.from('leads').select('*').order('created_at',{ascending:false});if(error?.message?.includes('does not exist')){setNeedsMig(true);}else setLeads(data||[]);}
  async function loadProfiles(){const{data}=await sb.from('profiles').select('*');setProfiles(data||[]);}
  async function loadSettings(){const{data}=await sb.from('settings').select('*');if(!data)return;const s={};data.forEach(r=>{s[r.key]=r.value;});setSettings({goals:s.goals||{},weekly_meeting_goal:s.weekly_meeting_goal||8});}
  async function loadOp(){const[{data:c},{data:e},{data:s}]=await Promise.all([sb.from('op_clients').select('*'),sb.from('op_entries').select('*').order('created_at',{ascending:true}),sb.from('op_solicitacoes').select('*').order('created_at',{ascending:false})]);setOpClients(c||[]);setOpEntries(e||[]);setOpSolicitacoes(s||[]);}
  async function loadOpTasks(){const{data,error}=await sb.from('op_tasks').select('*').order('created_at',{ascending:true});if(!error)setOpTasks(data||[]);}

  if(loading)return<div className="loading"><div className="spinner"/><span>Carregando...</span></div>;
  const _urlParams=new URLSearchParams(window.location.search);
  const _postId=_urlParams.get('post');
  if(_postId)return<ApprovalPage postId={_postId}/>;
  if(!user)return<AuthScreen onLogin={(u,p)=>{setUser(u);setProfile(p);}}/>;
  const role=profile?.role;
  const isGestor=role==='gestor';

  const navByRole={
    gestor:[{section:'Comercial'},{id:'dashboard',icon:'📊',label:'Dashboard'},{id:'metas',icon:'🎯',label:'Metas'},{id:'reunioes',icon:'📅',label:'Reuniões'},{id:'crm',icon:'🔥',label:'CRM'},{id:'sdr-panel',icon:'📞',label:'Painel SDR'},{id:'closer-panel',icon:'🤝',label:'Painel Closer'},{section:'Operacional'},{id:'op-overview',icon:'📋',label:'Visão Geral'},{id:'op-social',icon:'📱',label:'Social Mídia'},{id:'op-design',icon:'🎨',label:'Design'},{id:'op-video',icon:'🎬',label:'Editor de Vídeo'},{id:'op-trafego',icon:'📈',label:'Tráfego'},{section:'Clientes'},{id:'clientes',icon:'👥',label:'Gestão de Clientes'},{section:'Comunicação'},{id:'chat',icon:'💬',label:'Chat Interno'},{section:'Gestão'},{id:'config',icon:'⚙️',label:'Configurações'}],
    sdr:[{section:'Meu Painel'},{id:'dashboard',icon:'📊',label:'Dashboard'},{id:'sdr-panel',icon:'✏️',label:'Lançamento'},{id:'crm',icon:'🔥',label:'Meus Leads'},{id:'reunioes',icon:'📅',label:'Reuniões'},{section:'Clientes'},{id:'clientes',icon:'👥',label:'Clientes'},{section:'Comunicação'},{id:'chat',icon:'💬',label:'Chat Comercial'}],
    closer:[{section:'Meu Painel'},{id:'dashboard',icon:'📊',label:'Dashboard'},{id:'closer-panel',icon:'✏️',label:'Lançamento'},{id:'reunioes',icon:'📅',label:'Reuniões'},{id:'crm',icon:'🔥',label:'Pipeline'},{section:'Clientes'},{id:'clientes',icon:'👥',label:'Clientes'},{section:'Comunicação'},{id:'chat',icon:'💬',label:'Chat Comercial'}],
    social:[{section:'Meu Painel'},{id:'op-social',icon:'📱',label:'Clientes'},{id:'op-tasks-social',icon:'📋',label:'Tarefas'},{section:'Clientes'},{id:'clientes',icon:'👥',label:'Clientes'},{section:'Comunicação'},{id:'chat',icon:'💬',label:'Chat Operacional'}],
    design:[{section:'Meu Painel'},{id:'op-design',icon:'🎨',label:'Clientes'},{id:'op-tasks-design',icon:'📋',label:'Tarefas'},{section:'Clientes'},{id:'clientes',icon:'👥',label:'Clientes'},{section:'Comunicação'},{id:'chat',icon:'💬',label:'Chat Operacional'}],
    video:[{section:'Meu Painel'},{id:'op-video',icon:'🎬',label:'Clientes'},{id:'op-tasks-video',icon:'📋',label:'Tarefas'},{section:'Clientes'},{id:'clientes',icon:'👥',label:'Clientes'},{section:'Comunicação'},{id:'chat',icon:'💬',label:'Chat Operacional'}],
    trafego:[{section:'Meu Painel'},{id:'op-trafego',icon:'📈',label:'Clientes'},{id:'op-tasks-trafego',icon:'📋',label:'Tarefas'},{section:'Clientes'},{id:'clientes',icon:'👥',label:'Clientes'},{section:'Comunicação'},{id:'chat',icon:'💬',label:'Chat Operacional'}],
  };

  const pageLabels={dashboard:'Dashboard',metas:'Metas',reunioes:'Reuniões da Semana',crm:'CRM','sdr-panel':'Painel SDR','closer-panel':'Painel Closer',config:'Configurações','op-overview':'Visão Geral Operacional','op-social':'Social Mídia','op-design':'Design','op-video':'Editor de Vídeo','op-trafego':'Tráfego','op-tasks-social':'Tarefas — Social','op-tasks-design':'Tarefas — Design','op-tasks-video':'Tarefas — Vídeo','op-tasks-trafego':'Tarefas — Tráfego',clientes:'Gestão de Clientes',chat:'Chat Interno'};
  const navItems=navByRole[role]||navByRole.sdr;

  return(<div className="app">
    <Sidebar profile={profile} navItems={navItems} activeTab={activeTab} onTab={t=>{setActiveTab(t);if(t!=='clientes')setOpenClient(null);}}/>
    <div className="main">
      <TopBar profile={profile} activeTab={activeTab} pageLabels={pageLabels} period={period} setPeriod={setPeriod}/>
      <div className="content">
        {activeTab==='dashboard'&&<SharedDashboard sdrEntries={sdrEntries} closerEntries={closerEntries} leads={leads} profiles={profiles} settings={settings} dateRange={dateRange}/>}
        {activeTab==='metas'&&isGestor&&<GestorMetas closerEntries={closerEntries} settings={settings} dateRange={dateRange}/>}
        {activeTab==='reunioes'&&<ReunioesSemana leads={leads} profiles={profiles} currentUser={user} currentProfile={profile} toast={toast} onCloserEntryChange={loadCloser}/>}
        {activeTab==='crm'&&<CRMKanban leads={leads} profiles={profiles} currentUser={user} currentProfile={profile} onLeadsChange={loadLeads} toast={toast}/>}
        {activeTab==='sdr-panel'&&<SDRPanel user={user} profile={profile} profiles={profiles} leads={leads} settings={settings} sdrEntries={sdrEntries} onEntryChange={loadSdr} toast={toast}/>}
        {activeTab==='closer-panel'&&<CloserPanel user={user} profile={profile} leads={leads} closerEntries={closerEntries} onEntryChange={loadCloser} toast={toast}/>}
        {activeTab==='config'&&isGestor&&<GestorConfig profiles={profiles} settings={settings} toast={toast} reload={loadProfiles}/>}
        {activeTab==='clientes'&&!openClient&&<GestaoClientes user={user} profile={profile} gcClients={gcClients} gcNps={gcNps} onRefresh={loadGC} toast={toast} onOpenClient={c=>setOpenClient(c)}/>}
        {activeTab==='clientes'&&openClient&&<ClienteFicha user={user} profile={profile} client={openClient} gcOnboarding={gcOnboarding} gcEstrategia={gcEstrategia} gcCalendario={gcCalendario} gcMetricas={gcMetricas} gcRoteiros={gcRoteiros} gcAtas={gcAtas} gcLogins={gcLogins} gcChurns={gcChurns} gcNps={gcNps} onRefresh={loadGC} toast={toast} onBack={()=>setOpenClient(null)}/>}
        {activeTab==='op-overview'&&<GestorOpOverview opClients={opClients} opEntries={opEntries}/>}
        {activeTab==='op-social'&&<SocialPanel user={user} profile={profile} opClients={opClients} opEntries={opEntries} onRefresh={loadOp} toast={toast} isGestor={isGestor}/>}
        {activeTab==='op-design'&&<DesignVideoPanel user={user} profile={profile} opClients={opClients} opEntries={opEntries} opSolicitacoes={opSolicitacoes} onRefresh={loadOp} toast={toast} isGestor={isGestor} roleType="design" label="Design" icon="🎨" itemLabel="peças"/>}
        {activeTab==='op-video'&&<DesignVideoPanel user={user} profile={profile} opClients={opClients} opEntries={opEntries} opSolicitacoes={opSolicitacoes} onRefresh={loadOp} toast={toast} isGestor={isGestor} roleType="video" label="Editor de Vídeo" icon="🎬" itemLabel="vídeos"/>}
        {activeTab==='op-trafego'&&<TrafegoPanel user={user} profile={profile} opClients={opClients} opEntries={opEntries} onRefresh={loadOp} toast={toast} isGestor={isGestor}/>}
        {activeTab==='op-tasks-social'&&<OpTaskKanban user={user} opTasks={opTasks} onRefresh={loadOpTasks} toast={toast} roleType="social" readOnly={false}/>}
        {activeTab==='op-tasks-design'&&<OpTaskKanban user={user} opTasks={opTasks} onRefresh={loadOpTasks} toast={toast} roleType="design" readOnly={false}/>}
        {activeTab==='op-tasks-video'&&<OpTaskKanban user={user} opTasks={opTasks} onRefresh={loadOpTasks} toast={toast} roleType="video" readOnly={false}/>}
        {activeTab==='op-tasks-trafego'&&<OpTaskKanban user={user} opTasks={opTasks} onRefresh={loadOpTasks} toast={toast} roleType="trafego" readOnly={false}/>}
        {/* CORREÇÃO: Chat agora está sendo renderizado */}
        {activeTab==='chat'&&<ChatInterno user={user} profile={profile} chatMessages={chatMessages} profiles={profiles} onRefresh={loadChat}/>}
      </div>
    </div>
    <Toast msg={toastMsg}/>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
