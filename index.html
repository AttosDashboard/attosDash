<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attos Dashboard</title>

<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#3B82F6;--blue-pale:#EFF6FF;--black:#000;--text:#111;--muted:#6B7280;--border:#F0F0F0;--white:#fff;--success:#10B981;--warn:#F59E0B;--danger:#EF4444;--purple:#7C3AED;--sidebar-w:230px}
body{font-family:'DM Sans',sans-serif;background:#F8F9FB;color:var(--text);min-height:100vh}
#root{min-height:100vh}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#ddd;border-radius:99px}
/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000}
.auth-card{background:#fff;border-radius:20px;padding:48px 40px;width:400px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.auth-logo{font-size:24px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}.auth-logo span{color:var(--blue)}
.auth-sub{color:var(--muted);font-size:14px;margin-bottom:32px}
.auth-label{font-size:13px;font-weight:500;display:block;margin-bottom:6px}
.auth-input{width:100%;border:1.5px solid #E5E7EB;border-radius:8px;padding:11px 14px;font-size:14px;font-family:inherit;outline:none;transition:border .2s;margin-bottom:16px}.auth-input:focus{border-color:var(--blue)}
.auth-btn{width:100%;background:var(--blue);color:#fff;border:none;border-radius:8px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}.auth-btn:hover{background:#2563EB}
.err{color:var(--danger);font-size:13px;margin-top:6px}
/* LAYOUT */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--black);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:100;overflow-y:auto}
.sb-logo{padding:26px 20px 22px;border-bottom:1px solid #1a1a1a}.sb-logo-text{font-size:17px;font-weight:700;color:#fff;letter-spacing:-.3px}.sb-logo-text span{color:var(--blue)}.sb-role{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-top:4px}
.sb-nav{flex:1;padding:14px 10px}
.sb-section{font-size:10px;color:#444;text-transform:uppercase;letter-spacing:1.2px;font-weight:600;padding:0 10px;margin:18px 0 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#888;font-size:13.5px;font-weight:500;cursor:pointer;transition:all .15s;margin-bottom:1px;user-select:none}.nav-item:hover{background:#111;color:#fff}.nav-item.active{background:var(--blue);color:#fff}
.nav-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.sb-footer{padding:14px 10px;border-top:1px solid #111}.user-row{display:flex;align-items:center;gap:10px;padding:8px 10px}.u-avatar{width:32px;height:32px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}.u-name{font-size:13px;font-weight:500;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logout-btn{width:100%;background:transparent;border:1px solid #222;color:#555;border-radius:6px;padding:8px;font-size:12px;cursor:pointer;font-family:inherit;margin-top:6px;transition:all .15s}.logout-btn:hover{border-color:#444;color:#888}
/* MAIN */
.main{margin-left:var(--sidebar-w);flex:1;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}.page-title{font-size:17px;font-weight:700;letter-spacing:-.3px}.topbar-right{display:flex;align-items:center;gap:10px}
.period-sel{border:1.5px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px;font-family:inherit;outline:none;cursor:pointer;background:#fff}
.content{padding:24px 28px}
/* CARDS */
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04)}.card-title{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}.metric-big{font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1}.metric-sub{font-size:12px;color:var(--muted);margin-top:4px}
/* GRIDS */
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}.mb{margin-bottom:18px}
/* PROGRESS */
.prog-wrap{background:var(--border);border-radius:99px;height:8px;overflow:hidden;margin-top:8px}.prog-fill{height:100%;border-radius:99px;transition:width .5s}.prog-labels{display:flex;justify-content:space-between;margin-top:5px}.prog-pct{font-size:12px;font-weight:600;color:var(--blue)}
/* TAGS */
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600}
.tag-blue{background:var(--blue-pale);color:var(--blue)}.tag-green{background:#ECFDF5;color:#059669}.tag-red{background:#FEF2F2;color:#DC2626}.tag-yellow{background:#FFFBEB;color:#D97706}.tag-purple{background:#F5F3FF;color:#7C3AED}.tag-gray{background:#F9FAFB;color:#6B7280;border:1px solid #E5E7EB}
/* TABLE */
.tbl-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:9px 14px;text-align:left;border-bottom:1px solid var(--border)}td{padding:11px 14px;font-size:13.5px;border-bottom:1px solid #FAFAFA;color:var(--text)}tr:last-child td{border-bottom:none}tr:hover td{background:#FAFBFF}
/* FORM */
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}.flabel{font-size:12.5px;font-weight:500}.finput,.fselect,.ftextarea{border:1.5px solid #E5E7EB;border-radius:8px;padding:9px 13px;font-size:13.5px;font-family:inherit;outline:none;transition:border .2s;width:100%;background:#fff;color:var(--text)}.finput:focus,.fselect:focus,.ftextarea:focus{border-color:var(--blue)}.ftextarea{resize:vertical;min-height:76px}
/* BUTTONS */
.btn{padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#2563EB}.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border)}.btn-ghost:hover{border-color:#CBD5E1;color:var(--text)}.btn-danger{background:#FEF2F2;color:var(--danger);border:1.5px solid #FECACA}.btn-success{background:#ECFDF5;color:#059669;border:1.5px solid #A7F3D0}.btn-sm{padding:5px 11px;font-size:12px}.btn-xs{padding:3px 8px;font-size:11px;border-radius:5px}
/* RANKING */
.rank-item{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #FAFAFA}.rank-item:last-child{border-bottom:none}.rank-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}.rn-1{background:#FEF3C7;color:#D97706}.rn-2{background:#F1F5F9;color:#64748B}.rn-3{background:#FEF7EE;color:#C2410C}.rn-n{background:var(--blue-pale);color:var(--blue)}.rank-name{flex:1;font-size:13.5px;font-weight:500}.rank-val{font-size:15px;font-weight:700;color:var(--blue)}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}.modal{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.2)}.modal-lg{max-width:720px}.modal-title{font-size:17px;font-weight:700;margin-bottom:22px}.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
/* CHARTS */
.chart-wrap{position:relative;height:210px}.chart-sm{position:relative;height:175px}
/* KANBAN */
.kanban-board{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;min-height:460px}
.kanban-col{background:#F8F9FB;border:1px solid var(--border);border-radius:12px;min-width:210px;width:210px;flex-shrink:0;display:flex;flex-direction:column}
.k-col-hdr{padding:12px 14px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.k-col-title{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px}.k-col-cnt{background:var(--border);color:var(--muted);border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}
.k-cards{flex:1;padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.k-card{background:#fff;border:1px solid var(--border);border-radius:9px;padding:12px;cursor:pointer;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.04)}.k-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
.kc-name{font-size:13.5px;font-weight:600;margin-bottom:3px}.kc-info{font-size:11.5px;color:var(--muted);margin-bottom:3px}.kc-actions{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.col-lead{border-top:3px solid #F59E0B}.col-agendada{border-top:3px solid #3B82F6}.col-proposta{border-top:3px solid #7C3AED}.col-fechado{border-top:3px solid #10B981}.col-perdido{border-top:3px solid #EF4444}
/* MISC */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.sec-hdr h2{font-size:15px;font-weight:700}
.divider{border:none;border-top:1px solid var(--border);margin:18px 0}
.empty{text-align:center;padding:36px 20px;color:var(--muted);font-size:13.5px}.empty-icon{font-size:30px;margin-bottom:10px}
.loading{display:flex;align-items:center;justify-content:center;min-height:300px;color:var(--muted);font-size:14px;gap:10px}
@keyframes spin{to{transform:rotate(360deg)}}.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
.toast{position:fixed;bottom:24px;right:24px;background:#111;color:#fff;padding:13px 18px;border-radius:10px;font-size:13.5px;z-index:9999;animation:fadeUp .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.3)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.sdr-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}.sdr-stat{background:var(--blue-pale);border-radius:10px;padding:14px}.sdr-stat-label{font-size:11px;color:var(--blue);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}.sdr-stat-val{font-size:22px;font-weight:700}.sdr-stat-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.funnel-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}.funnel-label{font-size:12.5px;font-weight:500;width:145px;flex-shrink:0}.funnel-bar-wrap{flex:1;background:var(--border);border-radius:99px;height:22px;overflow:hidden}.funnel-bar-fill{height:100%;border-radius:99px;display:flex;align-items:center;padding-left:10px;font-size:11.5px;font-weight:700;color:#fff;transition:width .5s}.funnel-count{font-size:13px;font-weight:700;width:28px;text-align:right;flex-shrink:0}
.reuniao-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}.reuniao-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}.reuniao-name{font-size:14px;font-weight:600}.reuniao-info{font-size:12.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}
/* OPERACIONAL */
.op-client-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px}
.op-client-name{font-size:15px;font-weight:700;margin-bottom:4px}
.op-weeks{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.op-week-btn{width:44px;height:44px;border-radius:8px;border:2px solid var(--border);background:#fff;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px}
.op-week-btn.done{background:var(--blue);border-color:var(--blue);color:#fff}
.op-week-btn.partial{background:var(--blue-pale);border-color:var(--blue);color:var(--blue)}
.op-total-bar{background:linear-gradient(135deg,#EFF6FF,#DBEAFE);border:1px solid #BFDBFE;border-radius:12px;padding:18px;margin-bottom:18px}
.op-total-label{font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.op-total-pct{font-size:32px;font-weight:700;color:var(--text);letter-spacing:-1px}
.op-task-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #FAFAFA}
.op-task-item:last-child{border-bottom:none}
.op-check{width:18px;height:18px;border-radius:4px;border:2px solid #D1D5DB;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.op-check.checked{background:var(--blue);border-color:var(--blue)}
.op-solicitacao{background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.trafego-client-card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px}
.trafego-client-header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .15s}.trafego-client-header:hover{background:#FAFBFF}
.trafego-weekly-entry{background:#F8F9FB;border-radius:8px;padding:14px;margin-bottom:10px}
@media(max-width:1200px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){:root{--sidebar-w:0px}.sidebar{display:none}.content{padding:16px 14px}.g4,.g3,.g2{grid-template-columns:1fr}}
</style>

<script type="text/babel">

// HELPERS
const fmt=n=>(n||0).toLocaleString('pt-BR');
const fmtR=n=>'R$ '+(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(a,b)=>b?Math.min(Math.round((a/b)*100),100):0;
const today=()=>new Date().toISOString().split('T')[0];
const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'—';
function getWeekRange(){const now=new Date(),day=now.getDay();const mon=new Date(now);mon.setDate(now.getDate()-(day===0?6:day-1));const sun=new Date(mon);sun.setDate(mon.getDate()+6);return[mon.toISOString().split('T')[0],sun.toISOString().split('T')[0]];}
function getMonthRange(){const now=new Date();return[new Date(now.getFullYear(),now.getMonth(),1).toISOString().split('T')[0],new Date(now.getFullYear(),now.getMonth()+1,0).toISOString().split('T')[0]];}
function getPeriodRange(p){if(p==='today')return[today(),today()];if(p==='week')return getWeekRange();return getMonthRange();}

const KCOL_COLORS={lead_quente:'#F59E0B',reuniao_agendada:'#3B82F6',proposta_enviada:'#7C3AED',fechado:'#10B981',perdido:'#EF4444'};

function Toast({msg}){return msg?<div className="toast">{msg}</div>:null;}

// CHARTS
function LineChart({labels,datasets}){
  const ref=useRef(null),ch=useRef(null);
  useEffect(()=>{if(!ref.current)return;if(ch.current)ch.current.destroy();ch.current=new Chart(ref.current,{type:'line',data:{labels,datasets:datasets.map(d=>({label:d.label,data:d.data,borderColor:d.color||'#3B82F6',backgroundColor:d.bg||'rgba(59,130,246,.08)',borderWidth:2.5,pointRadius:3,tension:0.4,fill:true}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:datasets.length>1,labels:{font:{family:'DM Sans',size:11},color:'#9CA3AF',boxWidth:10}}},scales:{x:{grid:{display:false},ticks:{font:{family:'DM Sans',size:10},color:'#9CA3AF'},border:{display:false}},y:{grid:{color:'#F3F4F6'},ticks:{font:{family:'DM Sans',size:10},color:'#9CA3AF'},border:{display:false}}}}});return()=>ch.current&&ch.current.destroy();},[labels,datasets]);
  return <div className="chart-wrap"><canvas ref={ref}/></div>;
}
function BarChart({labels,data,colors}){
  const ref=useRef(null),ch=useRef(null);
  useEffect(()=>{if(!ref.current)return;if(ch.current)ch.current.destroy();ch.current=new Chart(ref.current,{type:'bar',data:{labels,datasets:[{data,backgroundColor:colors||'#3B82F6',borderRadius:5,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{family:'DM Sans',size:10},color:'#9CA3AF'},border:{display:false}},y:{grid:{color:'#F3F4F6'},ticks:{font:{family:'DM Sans',size:10},color:'#9CA3AF'},border:{display:false}}}}});return()=>ch.current&&ch.current.destroy();},[labels,data]);
  return <div className="chart-sm"><canvas ref={ref}/></div>;
}
function DonutChart({labels,data,colors}){
  const ref=useRef(null),ch=useRef(null);
  useEffect(()=>{if(!ref.current)return;if(ch.current)ch.current.destroy();ch.current=new Chart(ref.current,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors||['#3B82F6','#7C3AED','#10B981','#F59E0B','#93C5FD'],borderWidth:0,hoverOffset:5}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{font:{family:'DM Sans',size:11},color:'#6B7280',boxWidth:9,padding:12}}}}});return()=>ch.current&&ch.current.destroy();},[labels,data]);
  return <div style={{position:'relative',height:185}}><canvas ref={ref}/></div>;
}

// SIDEBAR
function Sidebar({profile,navItems,activeTab,onTab}){
  async function handleLogout(){await sb.auth.signOut();window.location.reload();}
  return(
    <div className="sidebar">
      <div className="sb-logo"><div className="sb-logo-text">Attos <span>Dashboard</span></div><div className="sb-role">{ROLE_LABELS[profile?.role]||'usuário'}</div></div>
      <nav className="sb-nav">
        {navItems.map(item=>item.section?<div key={item.section} className="sb-section">{item.section}</div>:<div key={item.id} className={`nav-item ${activeTab===item.id?'active':''}`} onClick={()=>onTab(item.id)}><span className="nav-icon">{item.icon}</span><span>{item.label}</span></div>)}
      </nav>
      <div className="sb-footer"><div className="user-row"><div className="u-avatar">{(profile?.name||'U')[0].toUpperCase()}</div><div className="u-name">{profile?.name||'Usuário'}</div></div><button className="logout-btn" onClick={handleLogout}>Sair</button></div>
    </div>
  );
}

// SHARED DASHBOARD
function SharedDashboard({sdrEntries,closerEntries,leads,profiles,settings,dateRange}){
  const sdrs=profiles.filter(p=>p.role==='sdr'),closers=profiles.filter(p=>p.role==='closer');
  const se=sdrEntries.filter(e=>e.date>=dateRange[0]&&e.date<=dateRange[1]);
  const ce=closerEntries.filter(e=>e.date>=dateRange[0]&&e.date<=dateRange[1]);
  const totalMtgs=se.reduce((a,e)=>a+(e.meetings_booked||0),0);
  let totalClos=0,totalMRR=0;
  PRODUCTS.forEach(p=>{totalClos+=ce.reduce((a,e)=>a+(e[`closings_${p.key}`]||0),0);totalMRR+=ce.reduce((a,e)=>a+((e[`closings_${p.key}`]||0)*(e[`ticket_${p.key}`]||0)),0);});
  // MRR also includes closed leads from CRM
  const crmMRR=leads.filter(l=>l.stage==='fechado'&&l.date>=dateRange[0]&&l.date<=dateRange[1]).reduce((a,l)=>a+(l.est_value||0),0);
  const allLeadsMRR=leads.filter(l=>l.stage==='fechado').reduce((a,l)=>a+(l.est_value||0),0);
  const totalDone=ce.reduce((a,e)=>a+(e.meetings_done||0),0);
  const sdrRanking=sdrs.map(s=>({...s,meetings:se.filter(e=>e.user_id===s.id).reduce((a,e)=>a+(e.meetings_booked||0),0)})).sort((a,b)=>b.meetings-a.meetings);
  const closerAndGestores=profiles.filter(p=>p.role==='closer'||p.role==='gestor');
  const closerRanking=closerAndGestores.map(c=>({...c,closings:PRODUCTS.reduce((a,p)=>a+ce.filter(e=>e.user_id===c.id).reduce((b,e)=>b+(e[`closings_${p.key}`]||0),0),0)})).filter(c=>c.closings>0||profiles.find(p=>p.id===c.id)?.role==='closer').sort((a,b)=>b.closings-a.closings);
  const funnelData=KCOLS.map(col=>({...col,count:leads.filter(l=>l.stage===col.id).length}));
  const maxF=Math.max(...funnelData.map(f=>f.count),1);
  const days14=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days14.push(d.toISOString().split('T')[0]);}
  const chartLabels=days14.map(d=>{const[,m,dd]=d.split('-');return`${dd}/${m}`;});
  const chartMtg=days14.map(d=>sdrEntries.filter(e=>e.date===d).reduce((a,e)=>a+(e.meetings_booked||0),0));
  const chartClos=days14.map(d=>closerEntries.filter(e=>e.date===d).reduce((a,e)=>PRODUCTS.reduce((b,p)=>b+(e[`closings_${p.key}`]||0),0)+a,0));
  return(
    <>
      <div className="g4">
        <div style={{background:'linear-gradient(135deg,#1E40AF,#3B82F6)',borderRadius:12,padding:'20px 22px',boxShadow:'0 4px 14px rgba(59,130,246,.3)'}}>
          <div style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,.7)',textTransform:'uppercase',letterSpacing:.8,marginBottom:8}}>Agendamentos</div>
          <div style={{fontSize:36,fontWeight:700,color:'#fff',letterSpacing:-1,lineHeight:1}}>{totalMtgs}</div>
          <div style={{fontSize:12,color:'rgba(255,255,255,.6)',marginTop:4}}>reuniões agendadas</div>
        </div>
        <div style={{background:'linear-gradient(135deg,#065F46,#10B981)',borderRadius:12,padding:'20px 22px',boxShadow:'0 4px 14px rgba(16,185,129,.3)'}}>
          <div style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,.7)',textTransform:'uppercase',letterSpacing:.8,marginBottom:8}}>Fechamentos</div>
          <div style={{fontSize:36,fontWeight:700,color:'#fff',letterSpacing:-1,lineHeight:1}}>{totalClos}</div>
          <div style={{fontSize:12,color:'rgba(255,255,255,.6)',marginTop:4}}>contratos fechados</div>
        </div>
        <div style={{background:'linear-gradient(135deg,#4C1D95,#7C3AED)',borderRadius:12,padding:'20px 22px',boxShadow:'0 4px 14px rgba(124,58,237,.3)'}}>
          <div style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,.7)',textTransform:'uppercase',letterSpacing:.8,marginBottom:8}}>MRR Gerado</div>
          <div style={{fontSize:22,fontWeight:700,color:'#fff',letterSpacing:-1,lineHeight:1}}>{fmtR(totalMRR)}</div>
          <div style={{fontSize:12,color:'rgba(255,255,255,.6)',marginTop:4}}>receita recorrente</div>
        </div>
        <div style={{background:'linear-gradient(135deg,#92400E,#F59E0B)',borderRadius:12,padding:'20px 22px',boxShadow:'0 4px 14px rgba(245,158,11,.3)'}}>
          <div style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,.7)',textTransform:'uppercase',letterSpacing:.8,marginBottom:8}}>Conversão</div>
          <div style={{fontSize:36,fontWeight:700,color:'#fff',letterSpacing:-1,lineHeight:1}}>{pct(totalClos,totalDone)}%</div>
          <div style={{fontSize:12,color:'rgba(255,255,255,.6)',marginTop:4}}>{totalClos} de {totalDone} reuniões</div>
        </div>
      </div>
      <div className="card mb">
        <div className="card-title">Funil de Vendas</div>
        {funnelData.map(col=><div key={col.id} className="funnel-row"><div className="funnel-label">{col.icon} {col.label}</div><div className="funnel-bar-wrap"><div className="funnel-bar-fill" style={{width:Math.max(pct(col.count,maxF),col.count>0?5:0)+'%',background:KCOL_COLORS[col.id]}}>{col.count>0?col.count:''}</div></div><div className="funnel-count">{col.count}</div></div>)}
      </div>
      <div className="g2">
        <div className="card"><div className="card-title">Agendamentos e Fechamentos — 14 dias</div><LineChart labels={chartLabels} datasets={[{label:'Agendamentos',data:chartMtg,color:'#3B82F6',bg:'rgba(59,130,246,.08)'},{label:'Fechamentos',data:chartClos,color:'#10B981',bg:'rgba(16,185,129,.06)'}]}/></div>
        <div className="card"><div className="card-title">MRR por Produto</div><DonutChart labels={PRODUCTS.map(p=>p.label)} data={PRODUCTS.map(p=>ce.reduce((a,e)=>a+((e[`closings_${p.key}`]||0)*(e[`ticket_${p.key}`]||0)),0))} colors={PRODUCTS.map(p=>p.color)}/></div>
      </div>
      <div className="g2">
        <div className="card"><div className="card-title">🏆 Ranking SDRs</div>{sdrRanking.length===0?<div className="empty"><div className="empty-icon">📞</div>Sem SDRs</div>:sdrRanking.map((s,i)=><div key={s.id} className="rank-item"><div className={`rank-num ${i===0?'rn-1':i===1?'rn-2':i===2?'rn-3':'rn-n'}`}>{i+1}</div><div className="rank-name">{s.name}</div><div className="rank-val">{s.meetings}</div></div>)}</div>
        <div className="card"><div className="card-title">🏆 Ranking Closers</div>{closerRanking.length===0?<div className="empty"><div className="empty-icon">🎯</div>Sem Closers</div>:closerRanking.map((c,i)=><div key={c.id} className="rank-item"><div className={`rank-num ${i===0?'rn-1':i===1?'rn-2':i===2?'rn-3':'rn-n'}`}>{i+1}</div><div className="rank-name">{c.name}</div><div className="rank-val">{c.closings}</div></div>)}</div>
      </div>
      <div className="card mb"><div className="card-title">Fechamentos por Produto</div><BarChart labels={PRODUCTS.map(p=>p.label)} data={PRODUCTS.map(p=>ce.reduce((a,e)=>a+(e[`closings_${p.key}`]||0),0))} colors={PRODUCTS.map(p=>p.color)}/></div>
    </>
  );
}

// CRM KANBAN
function CRMKanban({leads,profiles,currentUser,currentProfile,onLeadsChange,toast}){
  const[showModal,setShowModal]=useState(false);const[editLead,setEditLead]=useState(null);const[viewLead,setViewLead]=useState(null);
  const closers=profiles.filter(p=>p.role==='closer');
  const empty={name:'',company:'',phone:'',product:'',closer_id:'',meeting_date:'',est_value:'',observations:'',stage:'lead_quente'};
  const[form,setForm]=useState(empty);
  const getName=id=>profiles.find(p=>p.id===id)?.name||'—';
  const canEdit=lead=>currentProfile?.role==='gestor'||lead.sdr_id===currentUser.id;
  function openNew(){setForm(empty);setEditLead(null);setShowModal(true);}
  function openEdit(l){setForm({...l,est_value:l.est_value||''});setEditLead(l);setShowModal(true);}
  async function saveLead(){
    const p={...form,sdr_id:editLead?editLead.sdr_id:currentUser.id,est_value:parseFloat(form.est_value)||0,meeting_date:form.meeting_date||null,closer_id:form.closer_id||null,updated_at:new Date().toISOString()};
    if(editLead){const{error}=await sb.from('leads').update(p).eq('id',editLead.id);if(error)toast('Erro: '+error.message);else{toast('Lead atualizado!');onLeadsChange();}}
    else{const{error}=await sb.from('leads').insert(p);if(error)toast('Erro: '+error.message);else{toast('✅ Lead cadastrado!');onLeadsChange();}}
    setShowModal(false);
  }
  async function moveStage(lead,ns){await sb.from('leads').update({stage:ns,updated_at:new Date().toISOString()}).eq('id',lead.id);toast('Movido → '+KCOLS.find(c=>c.id===ns)?.label);onLeadsChange();}
  async function del(id){if(!confirm('Remover lead?'))return;await sb.from('leads').delete().eq('id',id);toast('Removido');onLeadsChange();}
  const[dragId,setDragId]=useState(null);
  const[dragOver,setDragOver]=useState(null);
  const totalPipeline=leads.reduce((a,l)=>a+(l.est_value||0),0);
  const totalAtivos=leads.filter(l=>!['fechado','perdido'].includes(l.stage)).reduce((a,l)=>a+(l.est_value||0),0);
  function onDragStart(e,leadId){setDragId(leadId);e.dataTransfer.effectAllowed='move';}
  function onDragOver(e,colId){e.preventDefault();setDragOver(colId);}
  function onDragLeave(){setDragOver(null);}
  async function onDrop(e,colId){e.preventDefault();setDragOver(null);if(!dragId)return;const lead=leads.find(l=>l.id===dragId);if(!lead||lead.stage===colId){setDragId(null);return;}await moveStage(lead,colId);setDragId(null);}
  const[viewMode,setViewMode]=useState('kanban');
  return(
    <>
      <div className="g4" style={{marginBottom:16}}>
        <div className="card"><div className="card-title">Total no Pipeline</div><div className="metric-big" style={{fontSize:24}}>{fmtR(totalPipeline)}</div><div className="metric-sub">{leads.length} leads</div></div>
        <div className="card"><div className="card-title">Pipeline Ativo</div><div className="metric-big" style={{fontSize:24,color:'#3B82F6'}}>{fmtR(totalAtivos)}</div><div className="metric-sub">{leads.filter(l=>!['fechado','perdido'].includes(l.stage)).length} leads ativos</div></div>
        <div className="card"><div className="card-title">Fechados</div><div className="metric-big" style={{fontSize:24,color:'#10B981'}}>{fmtR(leads.filter(l=>l.stage==='fechado').reduce((a,l)=>a+(l.est_value||0),0))}</div><div className="metric-sub">{leads.filter(l=>l.stage==='fechado').length} contratos</div></div>
        <div className="card"><div className="card-title">Perdidos</div><div className="metric-big" style={{fontSize:24,color:'#EF4444'}}>{fmtR(leads.filter(l=>l.stage==='perdido').reduce((a,l)=>a+(l.est_value||0),0))}</div><div className="metric-sub">{leads.filter(l=>l.stage==='perdido').length} leads</div></div>
      </div>
      <div className="sec-hdr"><h2>Pipeline de Vendas</h2><div style={{display:'flex',gap:8,alignItems:'center'}}>
        <div style={{display:'flex',background:'#F0F0F0',borderRadius:8,padding:3,gap:2}}>
          <button onClick={()=>setViewMode('kanban')} style={{padding:'5px 12px',borderRadius:6,border:'none',background:viewMode==='kanban'?'#fff':'transparent',fontWeight:viewMode==='kanban'?600:400,fontSize:12,cursor:'pointer',fontFamily:'inherit'}}>⠿ Kanban</button>
          <button onClick={()=>setViewMode('lista')} style={{padding:'5px 12px',borderRadius:6,border:'none',background:viewMode==='lista'?'#fff':'transparent',fontWeight:viewMode==='lista'?600:400,fontSize:12,cursor:'pointer',fontFamily:'inherit'}}>≡ Lista</button>
        </div>
        {viewMode==='kanban'&&<span style={{fontSize:12,color:'#9CA3AF'}}>Arraste entre colunas</span>}
        <button className="btn btn-primary btn-sm" onClick={openNew}>+ Novo Lead</button>
      </div></div>
      {viewMode==='lista'&&(
        <div className="card mb">
          <div className="tbl-wrap"><table><thead><tr><th>Lead</th><th>Empresa</th><th>Produto</th><th>Closer</th><th>Reunião</th><th>Valor Est.</th><th>Etapa</th><th></th></tr></thead>
          <tbody>{leads.length===0?<tr><td colSpan={8} style={{textAlign:'center',color:'#9CA3AF'}}>Nenhum lead</td></tr>:
            leads.map(l=>(
              <tr key={l.id}>
                <td><strong>{l.name}</strong>{l.company&&<div style={{fontSize:11.5,color:'#9CA3AF'}}>{l.company}</div>}</td>
                <td>{l.company||'—'}</td>
                <td>{PRODUCTS.find(p=>p.key===l.product)?.label||'—'}</td>
                <td>{getName(l.closer_id)}</td>
                <td>{fmtDate(l.meeting_date)}</td>
                <td style={{color:'#3B82F6',fontWeight:600}}>{l.est_value>0?fmtR(l.est_value):'—'}</td>
                <td><span style={{background:KCOL_COLORS[l.stage]+'20',color:KCOL_COLORS[l.stage],borderRadius:99,padding:'2px 8px',fontSize:12,fontWeight:600}}>{KCOLS.find(c=>c.id===l.stage)?.label}</span></td>
                <td><div style={{display:'flex',gap:4}}>
                  <button className="btn btn-ghost btn-xs" onClick={()=>setViewLead(l)}>Ver</button>
                  {canEdit(l)&&<button className="btn btn-ghost btn-xs" onClick={()=>openEdit(l)}>Editar</button>}
                  {NEXT[l.stage]?.slice(0,1).map(ns=><button key={ns} className={`btn btn-xs ${ns==='perdido'?'btn-danger':ns==='fechado'?'btn-success':'btn-primary'}`} onClick={()=>moveStage(l,ns)}>{ns==='fechado'?'✅':ns==='perdido'?'❌':'→'}</button>)}
                </div></td>
              </tr>
            ))
          }</tbody></table></div>
        </div>
      )}
      {viewMode==='kanban'&&<div className="kanban-board">
        {KCOLS.map(col=>{
          const colLeads=leads.filter(l=>l.stage===col.id);
          const isOver=dragOver===col.id;
          return(<div key={col.id} className={`kanban-col ${col.cls}`} style={{transition:'all .2s',outline:isOver?'2px dashed #3B82F6':'none',outlineOffset:2,background:isOver?'#EFF6FF':''}} onDragOver={e=>onDragOver(e,col.id)} onDragLeave={onDragLeave} onDrop={e=>onDrop(e,col.id)}><div className="k-col-hdr"><div className="k-col-title"><span>{col.icon}</span><span>{col.label}</span></div><span className="k-col-cnt">{colLeads.length}</span></div>
            <div className="k-cards">
              {colLeads.length===0&&<div style={{fontSize:12,color:isOver?'#3B82F6':'#9CA3AF',textAlign:'center',padding:'20px 0',transition:'color .2s'}}>{isOver?'Soltar aqui':'Sem leads'}</div>}
              {colLeads.map(lead=><div key={lead.id} className="k-card" draggable onDragStart={e=>onDragStart(e,lead.id)} style={{opacity:dragId===lead.id?0.5:1,cursor:'grab'}}>
                <div style={{fontSize:10,color:'#CBD5E1',marginBottom:4,letterSpacing:.5}}>⠿ ARRASTAR</div>
                <div className="kc-name">{lead.name}</div>
                {lead.company&&<div className="kc-info">{lead.company}</div>}
                <div className="kc-info">{PRODUCTS.find(p=>p.key===lead.product)?.icon} {PRODUCTS.find(p=>p.key===lead.product)?.label||'—'}</div>
                {lead.closer_id&&<div className="kc-info">🎯 {getName(lead.closer_id)}</div>}
                {lead.meeting_date&&<div className="kc-info">📅 {fmtDate(lead.meeting_date)}</div>}
                {lead.est_value>0&&<div style={{fontSize:12,fontWeight:600,color:'#3B82F6',marginTop:3}}>{fmtR(lead.est_value)}</div>}
                <div style={{fontSize:11,color:'#9CA3AF',marginTop:3}}>SDR: {getName(lead.sdr_id)}</div>
                <div className="kc-actions">
                  <button className="btn btn-ghost btn-xs" onClick={()=>setViewLead(lead)}>Ver</button>
                  {canEdit(lead)&&<button className="btn btn-ghost btn-xs" onClick={()=>openEdit(lead)}>Editar</button>}
                </div>
              </div>)}
            </div>
          </div>);
        })}
      </div>}
      {showModal&&<div className="overlay" onClick={()=>setShowModal(false)}><div className="modal modal-lg" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">{editLead?'Editar Lead':'Novo Lead'}</div>
        <div className="frow"><div className="fg"><label className="flabel">Nome *</label><input className="finput" value={form.name} onChange={e=>setForm(v=>({...v,name:e.target.value}))} placeholder="Nome"/></div><div className="fg"><label className="flabel">Empresa</label><input className="finput" value={form.company||''} onChange={e=>setForm(v=>({...v,company:e.target.value}))} placeholder="Empresa"/></div></div>
        <div className="frow"><div className="fg"><label className="flabel">WhatsApp</label><input className="finput" value={form.phone||''} onChange={e=>setForm(v=>({...v,phone:e.target.value}))} placeholder="(21) 99999-9999"/></div><div className="fg"><label className="flabel">Produto</label><select className="fselect" value={form.product||''} onChange={e=>setForm(v=>({...v,product:e.target.value}))}><option value="">Selecionar...</option>{PRODUCTS.map(p=><option key={p.key} value={p.key}>{p.icon} {p.label}</option>)}</select></div></div>
        <div className="frow"><div className="fg"><label className="flabel">Closer</label><select className="fselect" value={form.closer_id||''} onChange={e=>setForm(v=>({...v,closer_id:e.target.value}))}><option value="">Selecionar...</option>{closers.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div><div className="fg"><label className="flabel">Data da Reunião</label><input className="finput" type="date" value={form.meeting_date||''} onChange={e=>setForm(v=>({...v,meeting_date:e.target.value}))}/></div></div>
        <div className="frow"><div className="fg"><label className="flabel">Valor Estimado (R$)</label><input className="finput" type="number" value={form.est_value||''} onChange={e=>setForm(v=>({...v,est_value:e.target.value}))} placeholder="0"/></div><div className="fg"><label className="flabel">Etapa</label><select className="fselect" value={form.stage} onChange={e=>setForm(v=>({...v,stage:e.target.value}))}>{KCOLS.map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}</select></div></div>
        <div className="fg"><label className="flabel">Observações</label><textarea className="ftextarea" value={form.observations||''} onChange={e=>setForm(v=>({...v,observations:e.target.value}))} placeholder="Detalhes sobre o lead..."/></div>
        <div className="modal-footer">{editLead&&<button className="btn btn-danger" onClick={()=>{del(editLead.id);setShowModal(false);}}>Remover</button>}<button className="btn btn-ghost" onClick={()=>setShowModal(false)}>Cancelar</button><button className="btn btn-primary" onClick={saveLead} disabled={!form.name}>Salvar</button></div>
      </div></div>}
      {viewLead&&<div className="overlay" onClick={()=>setViewLead(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">📋 {viewLead.name}</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px 20px',fontSize:13.5}}>
          {[['Empresa',viewLead.company||'—'],['WhatsApp',viewLead.phone||'—'],['Produto',PRODUCTS.find(p=>p.key===viewLead.product)?.label||'—'],['Closer',getName(viewLead.closer_id)],['SDR',getName(viewLead.sdr_id)],['Reunião',fmtDate(viewLead.meeting_date)],['Valor Est.',viewLead.est_value>0?fmtR(viewLead.est_value):'—'],['Etapa',KCOLS.find(c=>c.id===viewLead.stage)?.label||'—']].map(([k,v])=><div key={k}><span style={{color:'#9CA3AF',fontSize:12}}>{k}</span><div style={{fontWeight:600,marginTop:2}}>{v}</div></div>)}
        </div>
        {viewLead.observations&&<div style={{marginTop:16,padding:12,background:'#F8F9FB',borderRadius:8,fontSize:13.5}}><div style={{color:'#9CA3AF',fontSize:11,marginBottom:4}}>OBSERVAÇÕES</div>{viewLead.observations}</div>}
        <div className="modal-footer"><button className="btn btn-ghost" onClick={()=>setViewLead(null)}>Fechar</button></div>
      </div></div>}
    </>
  );
}

// REUNIÕES DA SEMANA
function ReunioesSemana({leads,profiles,currentUser,currentProfile,toast,onCloserEntryChange}){
  const[ws,we]=getWeekRange();
  const isGestor=currentProfile?.role==='gestor',isCloser=currentProfile?.role==='closer';
  const weekLeads=leads.filter(l=>l.stage==='reuniao_agendada'&&l.meeting_date&&l.meeting_date>=ws&&l.meeting_date<=we);
  const myLeads=isCloser?weekLeads.filter(l=>l.closer_id===currentUser.id):weekLeads;
  const getName=id=>profiles.find(p=>p.id===id)?.name||'—';
  const closers=profiles.filter(p=>p.role==='closer');
  async function markStatus(lead,status){
    const payload={user_id:lead.closer_id||currentUser.id,date:today(),meetings_done:status==='realizada'?1:0,meetings_noshow:status==='noshow'?1:0,proposals_sent:0,closings_contabilidade:0,ticket_contabilidade:0,closings_bpo:0,ticket_bpo:0,closings_marketing:0,ticket_marketing:0,closings_comercial:0,ticket_comercial:0,closing_days:0};
    await sb.from('closer_entries').insert(payload);
    if(status==='realizada')await sb.from('leads').update({stage:'proposta_enviada',updated_at:new Date().toISOString()}).eq('id',lead.id);
    toast(status==='realizada'?'✅ Reunião realizada!':'⚠️ No-show registrado!');
    onCloserEntryChange();
  }
  const Card=({l})=>(
    <div className="reuniao-card">
      <div className="reuniao-hdr">
        <div><div className="reuniao-name">{l.name}{l.company&&<span style={{color:'#9CA3AF',fontWeight:400}}> — {l.company}</span>}</div>
          <div className="reuniao-info"><span>📅 {fmtDate(l.meeting_date)}</span><span>{PRODUCTS.find(p=>p.key===l.product)?.label||'—'}</span>{!isCloser&&<span>🎯 {getName(l.closer_id)}</span>}<span>SDR: {getName(l.sdr_id)}</span>{l.est_value>0&&<span style={{color:'#3B82F6',fontWeight:600}}>{fmtR(l.est_value)}</span>}</div>
        </div>
        {isCloser&&<div style={{display:'flex',gap:6}}><button className="btn btn-success btn-sm" onClick={()=>markStatus(l,'realizada')}>✅ Realizada</button><button className="btn btn-danger btn-sm" onClick={()=>markStatus(l,'noshow')}>❌ No-show</button></div>}
      </div>
      {l.observations&&<div style={{fontSize:12.5,color:'#6B7280',marginTop:6,fontStyle:'italic',borderTop:'1px solid #F0F0F0',paddingTop:6}}>"{l.observations}"</div>}
    </div>
  );
  if(isGestor) return(<>
    <div className="sec-hdr"><h2>Reuniões da Semana — por Closer</h2><span className="tag tag-blue">{weekLeads.length} total</span></div>
    {closers.map(c=>{const cr=weekLeads.filter(l=>l.closer_id===c.id);return<div key={c.id} className="card mb"><div className="sec-hdr" style={{marginBottom:12}}><h2 style={{fontSize:14}}>🎯 {c.name}</h2><span className="tag tag-blue">{cr.length} reunião(ões)</span></div>{cr.length===0?<div style={{color:'#9CA3AF',fontSize:13}}>Nenhuma esta semana</div>:cr.map(l=><Card key={l.id} l={l}/>)}</div>;})}
    {closers.length===0&&<div className="card"><div className="empty"><div className="empty-icon">🎯</div>Nenhum Closer cadastrado</div></div>}
  </>);
  return(<><div className="sec-hdr"><h2>{isCloser?'Minhas Reuniões':'Reuniões da Semana'}</h2><span className="tag tag-blue">{myLeads.length}</span></div>{myLeads.length===0?<div className="card"><div className="empty"><div className="empty-icon">📅</div>Nenhuma reunião esta semana</div></div>:myLeads.map(l=><Card key={l.id} l={l}/>)}</>);
}

// SDR PANEL
function SDRPanel({user,profile,profiles,leads,settings,sdrEntries,onEntryChange,toast}){
  const[entry,setEntry]=useState({messages_sent:'',responses:'',meetings_booked:'',lead_channel:'',no_booking_reason:'',no_booking_obs:'',observations:''});
  const[saving,setSaving]=useState(false);
  const[ws,we]=getWeekRange();const[ms,me]=getMonthRange();
  const weekMtgs=sdrEntries.filter(e=>e.user_id===user.id&&e.date>=ws&&e.date<=we).reduce((a,e)=>a+(e.meetings_booked||0),0);
  const wg=settings.weekly_meeting_goal||8;
  const mE=sdrEntries.filter(e=>e.user_id===user.id&&e.date>=ms&&e.date<=me);
  const totalMsg=mE.reduce((a,e)=>a+(e.messages_sent||0),0),totalResp=mE.reduce((a,e)=>a+(e.responses||0),0),totalMtg=mE.reduce((a,e)=>a+(e.meetings_booked||0),0);
  const myLeads=leads.filter(l=>l.sdr_id===user.id);
  async function handleSave(e){e.preventDefault();setSaving(true);const{error}=await sb.from('sdr_entries').insert({user_id:user.id,date:today(),messages_sent:parseInt(entry.messages_sent)||0,responses:parseInt(entry.responses)||0,meetings_booked:parseInt(entry.meetings_booked)||0,lead_channel:entry.lead_channel,no_booking_reason:entry.no_booking_reason,no_booking_obs:entry.no_booking_obs,observations:entry.observations});if(error)toast('Erro: '+error.message);else{toast('✅ Salvo!');setEntry({messages_sent:'',responses:'',meetings_booked:'',lead_channel:'',no_booking_reason:'',no_booking_obs:'',observations:''});onEntryChange();}setSaving(false);}
  return(<>
    <div className="card mb"><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}><div className="card-title" style={{margin:0}}>Meta Semanal</div><span className="tag tag-blue">{weekMtgs} / {wg}</span></div><div className="prog-wrap"><div className="prog-fill" style={{width:pct(weekMtgs,wg)+'%',background:'#3B82F6'}}/></div><div className="prog-labels"><span style={{fontSize:11.5,color:'#9CA3AF'}}>Esta semana</span><span className="prog-pct">{pct(weekMtgs,wg)}%</span></div></div>
    <div className="sdr-stats mb"><div className="sdr-stat"><div className="sdr-stat-label">Mensagens</div><div className="sdr-stat-val">{fmt(totalMsg)}</div></div><div className="sdr-stat"><div className="sdr-stat-label">Respostas</div><div className="sdr-stat-val">{fmt(totalResp)}</div><div className="sdr-stat-sub">Taxa: {pct(totalResp,totalMsg)}%</div></div><div className="sdr-stat"><div className="sdr-stat-label">Reuniões</div><div className="sdr-stat-val">{fmt(totalMtg)}</div></div><div className="sdr-stat"><div className="sdr-stat-label">Taxa Agend.</div><div className="sdr-stat-val">{pct(totalMtg,totalMsg)}%</div></div></div>
    <div className="card mb"><div className="sec-hdr" style={{marginBottom:10}}><h2 style={{fontSize:13.5}}>Meus Leads no CRM</h2><span className="tag tag-blue">{myLeads.length}</span></div><div style={{display:'flex',gap:8,flexWrap:'wrap'}}>{KCOLS.map(col=>{const count=myLeads.filter(l=>l.stage===col.id).length;return<div key={col.id} style={{background:'#F8F9FB',border:'1px solid #F0F0F0',borderRadius:8,padding:'8px 14px',textAlign:'center',minWidth:88}}><div style={{fontSize:11,color:'#9CA3AF',marginBottom:2}}>{col.label}</div><div style={{fontSize:20,fontWeight:700}}>{count}</div></div>;})}</div></div>
    <div className="card"><div className="card-title">Lançamento — {new Date().toLocaleDateString('pt-BR')}</div><form onSubmit={handleSave}>
      <div className="frow"><div className="fg"><label className="flabel">Mensagens Enviadas</label><input className="finput" type="number" min={0} value={entry.messages_sent} onChange={e=>setEntry(v=>({...v,messages_sent:e.target.value}))} placeholder="0"/></div><div className="fg"><label className="flabel">Respostas</label><input className="finput" type="number" min={0} value={entry.responses} onChange={e=>setEntry(v=>({...v,responses:e.target.value}))} placeholder="0"/></div></div>
      <div className="frow"><div className="fg"><label className="flabel">Reuniões Agendadas</label><input className="finput" type="number" min={0} value={entry.meetings_booked} onChange={e=>setEntry(v=>({...v,meetings_booked:e.target.value}))} placeholder="0"/></div><div className="fg"><label className="flabel">Canal de Origem</label><select className="fselect" value={entry.lead_channel} onChange={e=>setEntry(v=>({...v,lead_channel:e.target.value}))}><option value="">Selecionar...</option>{CHANNELS.map(c=><option key={c}>{c}</option>)}</select></div></div>
      <div className="frow"><div className="fg"><label className="flabel">Motivo Não Agendamento</label><select className="fselect" value={entry.no_booking_reason} onChange={e=>setEntry(v=>({...v,no_booking_reason:e.target.value}))}><option value="">Selecionar...</option>{NO_BOOK.map(r=><option key={r}>{r}</option>)}</select></div><div className="fg"><label className="flabel">Observação</label><input className="finput" value={entry.no_booking_obs} onChange={e=>setEntry(v=>({...v,no_booking_obs:e.target.value}))} placeholder="Detalhes..."/></div></div>
      <div className="fg"><label className="flabel">Observações Gerais</label><textarea className="ftextarea" value={entry.observations} onChange={e=>setEntry(v=>({...v,observations:e.target.value}))} placeholder="Anotações do dia..."/></div>
      <button className="btn btn-primary" type="submit" disabled={saving}>{saving?'Salvando...':'✓ Salvar Lançamento'}</button>
    </form></div>
  </>);
}

// CLOSER PANEL
function CloserPanel({user,profile,leads,closerEntries,onEntryChange,toast}){
  const[entry,setEntry]=useState({meetings_done:'',meetings_noshow:'',noshow_reason:'',noshow_obs:'',proposals_sent:'',closings_contabilidade:'',ticket_contabilidade:'',closings_bpo:'',ticket_bpo:'',closings_marketing:'',ticket_marketing:'',closings_comercial:'',ticket_comercial:'',closing_days:'',observations:''});
  const[saving,setSaving]=useState(false);
  const[ms,me]=getMonthRange();
  const mE=closerEntries.filter(e=>e.user_id===user.id&&e.date>=ms&&e.date<=me);
  const totalDone=mE.reduce((a,e)=>a+(e.meetings_done||0),0),totalNS=mE.reduce((a,e)=>a+(e.meetings_noshow||0),0);
  let totalClos=0,totalRev=0;
  PRODUCTS.forEach(p=>{totalClos+=mE.reduce((a,e)=>a+(e[`closings_${p.key}`]||0),0);totalRev+=mE.reduce((a,e)=>a+((e[`closings_${p.key}`]||0)*(e[`ticket_${p.key}`]||0)),0);});
  const myPending=leads.filter(l=>l.closer_id===user.id&&l.stage==='reuniao_agendada');
  async function handleSave(e){e.preventDefault();setSaving(true);const payload={user_id:user.id,date:today()};Object.keys(entry).forEach(k=>{payload[k]=entry[k]===''?null:isNaN(entry[k])?entry[k]:parseFloat(entry[k]);});const{error}=await sb.from('closer_entries').insert(payload);if(error)toast('Erro: '+error.message);else{toast('✅ Salvo!');setEntry({meetings_done:'',meetings_noshow:'',noshow_reason:'',noshow_obs:'',proposals_sent:'',closings_contabilidade:'',ticket_contabilidade:'',closings_bpo:'',ticket_bpo:'',closings_marketing:'',ticket_marketing:'',closings_comercial:'',ticket_comercial:'',closing_days:'',observations:''});onEntryChange();}setSaving(false);}
  return(<>
    <div className="g4 mb"><div className="card"><div className="card-title">Reuniões Feitas</div><div className="metric-big">{totalDone}</div></div><div className="card"><div className="card-title">No-shows</div><div className="metric-big" style={{color:'#EF4444'}}>{totalNS}</div></div><div className="card"><div className="card-title">Fechamentos</div><div className="metric-big" style={{color:'#3B82F6'}}>{totalClos}</div></div><div className="card"><div className="card-title">MRR</div><div className="metric-big" style={{fontSize:20}}>{fmtR(totalRev)}</div></div></div>
    {myPending.length>0&&<div className="card mb"><div className="card-title">Reuniões Pendentes</div>{myPending.map(l=><div key={l.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px solid #FAFAFA'}}><div><div style={{fontWeight:600,fontSize:14}}>{l.name}{l.company&&<span style={{color:'#9CA3AF',fontWeight:400}}> — {l.company}</span>}</div><div style={{fontSize:12,color:'#9CA3AF',marginTop:2}}>{fmtDate(l.meeting_date)} · {PRODUCTS.find(p=>p.key===l.product)?.label||'—'}</div></div><span className="tag tag-blue">Agendada</span></div>)}</div>}
    <div className="card"><div className="card-title">Lançamento — {new Date().toLocaleDateString('pt-BR')}</div><form onSubmit={handleSave}>
      <div className="frow"><div className="fg"><label className="flabel">Reuniões Realizadas</label><input className="finput" type="number" min={0} value={entry.meetings_done} onChange={e=>setEntry(v=>({...v,meetings_done:e.target.value}))} placeholder="0"/></div><div className="fg"><label className="flabel">No-shows</label><input className="finput" type="number" min={0} value={entry.meetings_noshow} onChange={e=>setEntry(v=>({...v,meetings_noshow:e.target.value}))} placeholder="0"/></div></div>
      {parseInt(entry.meetings_noshow)>0&&<div className="frow"><div className="fg"><label className="flabel">Motivo No-show</label><select className="fselect" value={entry.noshow_reason} onChange={e=>setEntry(v=>({...v,noshow_reason:e.target.value}))}><option value="">Selecionar...</option>{NOSHOW_R.map(r=><option key={r}>{r}</option>)}</select></div><div className="fg"><label className="flabel">Observação</label><input className="finput" value={entry.noshow_obs} onChange={e=>setEntry(v=>({...v,noshow_obs:e.target.value}))} placeholder="Detalhes..."/></div></div>}
      <div className="frow"><div className="fg"><label className="flabel">Propostas Enviadas</label><input className="finput" type="number" min={0} value={entry.proposals_sent} onChange={e=>setEntry(v=>({...v,proposals_sent:e.target.value}))} placeholder="0"/></div><div className="fg"><label className="flabel">Tempo Fechamento (dias)</label><input className="finput" type="number" min={0} value={entry.closing_days} onChange={e=>setEntry(v=>({...v,closing_days:e.target.value}))} placeholder="0"/></div></div>
      <hr className="divider"/><div style={{fontWeight:600,fontSize:13.5,marginBottom:12}}>Fechamentos por Produto</div>
      {PRODUCTS.map(p=><div key={p.key} className="frow" style={{marginBottom:8}}><div className="fg" style={{margin:0}}><label className="flabel">{p.icon} {p.label} — Qtd</label><input className="finput" type="number" min={0} value={entry[`closings_${p.key}`]} onChange={e=>setEntry(v=>({...v,[`closings_${p.key}`]:e.target.value}))} placeholder="0"/></div><div className="fg" style={{margin:0}}><label className="flabel">Ticket Médio (R$)</label><input className="finput" type="number" min={0} step="0.01" value={entry[`ticket_${p.key}`]} onChange={e=>setEntry(v=>({...v,[`ticket_${p.key}`]:e.target.value}))} placeholder="0,00"/></div></div>)}
      <hr className="divider"/>
      <div className="fg"><label className="flabel">Observações Gerais</label><textarea className="ftextarea" value={entry.observations} onChange={e=>setEntry(v=>({...v,observations:e.target.value}))} placeholder="Anotações do dia..."/></div>
      <button className="btn btn-primary" type="submit" disabled={saving}>{saving?'Salvando...':'✓ Salvar'}</button>
    </form></div>
  </>);
}

// OPERACIONAL — SOCIAL MÍDIA
// ══════════════════════════════════════════════════
function SocialPanel({user,profile,opClients,opEntries,onRefresh,toast,isGestor}){
  const myRole='social';
  const clients=opClients.filter(c=>c.role_type===myRole||(isGestor));
  const[showAddClient,setShowAddClient]=useState(false);
  const[showTask,setShowTask]=useState(null); // {clientId, week}
  const[clientForm,setClientForm]=useState({name:'',contents_per_month:16,planned_days:false,month_closed:false,observations:''});
  const[saving,setSaving]=useState(false);

  // Calcula progresso de um cliente
  function clientProgress(clientId){
    const entries=opEntries.filter(e=>e.client_id===clientId&&e.role_type===myRole&&e.month===currentMonth());
    const meta=opClients.find(c=>c.id===clientId)?.contents_per_month||16;
    const done=entries.filter(e=>e.status==='done').length;
    return{done,meta,pct:pct(done,4)};
  }

  function currentMonth(){return new Date().toISOString().slice(0,7);}

  // Progresso total
  const totalMeta=clients.length*4;
  const totalDone=clients.reduce((a,c)=>a+clientProgress(c.id).done,0);
  const totalPct=pct(totalDone,totalMeta);

  async function saveClient(e){
    e.preventDefault();setSaving(true);
    const payload={...clientForm,role_type:myRole,owner_id:user.id,contents_per_month:parseInt(clientForm.contents_per_month)||16};
    const{error}=await sb.from('op_clients').insert(payload);
    if(error)toast('Erro: '+error.message);else{toast('✅ Cliente adicionado!');onRefresh();setShowAddClient(false);setClientForm({name:'',contents_per_month:16,planned_days:false,month_closed:false,observations:''});}
    setSaving(false);
  }

  async function toggleWeek(clientId,week){
    const month=currentMonth();
    const existing=opEntries.find(e=>e.client_id===clientId&&e.role_type===myRole&&e.week_number===week&&e.month===month);
    if(existing){
      await sb.from('op_entries').delete().eq('id',existing.id);
      toast('Semana desmarcada');
    } else {
      await sb.from('op_entries').insert({client_id:clientId,role_type:myRole,week_number:week,month,status:'done',user_id:user.id});
      toast('✅ Semana marcada!');
    }
    onRefresh();
  }

  async function deleteClient(id){if(!confirm('Remover cliente?'))return;await sb.from('op_clients').delete().eq('id',id);toast('Removido');onRefresh();}

  const[showSolicitar,setShowSolicitar]=useState(null);
  const[solicitForm,setSolicitForm]=useState({tipo:'design',descricao:''});
  async function saveSolicit(clientId){
    await sb.from('op_solicitacoes').insert({client_id:clientId,from_role:myRole,to_role:solicitForm.tipo,descricao:solicitForm.descricao,status:'pendente',month:currentMonth(),user_id:user.id});
    toast('📨 Solicitação enviada!');setShowSolicitar(null);setSolicitForm({tipo:'design',descricao:''});onRefresh();
  }

  return(<>
    {/* Barra Total */}
    <div className="op-total-bar mb">
      <div className="op-total-label">📱 Progresso Total — Social Mídia</div>
      <div style={{display:'flex',alignItems:'baseline',gap:8,marginBottom:8}}><div className="op-total-pct">{totalPct}%</div><div style={{fontSize:13,color:'#6B7280'}}>{totalDone} de {totalMeta} semanas</div></div>
      <div className="prog-wrap" style={{height:12}}><div className="prog-fill" style={{width:totalPct+'%',background:totalPct>=100?'#10B981':'#3B82F6'}}/></div>
    </div>

    <div className="sec-hdr"><h2>Clientes Ativos — Social Mídia</h2>{(isGestor||true)&&<button className="btn btn-primary btn-sm" onClick={()=>setShowAddClient(true)}>+ Cliente</button>}</div>

    {clients.length===0&&<div className="card"><div className="empty"><div className="empty-icon">📱</div>Nenhum cliente cadastrado</div></div>}

    {clients.map(c=>{
      const{done,meta,pct:p}=clientProgress(c.id);
      const weeks=[1,2,3,4];
      const month=currentMonth();
      return(<div key={c.id} className="op-client-card">
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:8}}>
          <div><div className="op-client-name">{c.name}</div><div style={{fontSize:12.5,color:'#6B7280'}}>Meta: {meta} conteúdos/mês</div></div>
          <div style={{display:'flex',gap:6,alignItems:'center'}}>
            {c.planned_days&&<span className="tag tag-green" style={{fontSize:11}}>Dias planejados</span>}
            {c.month_closed&&<span className="tag tag-blue" style={{fontSize:11}}>Mês fechado</span>}
            <button className="btn btn-ghost btn-xs" onClick={()=>setShowSolicitar(c.id)}>📨 Solicitar</button>
            {isGestor&&<button className="btn btn-danger btn-xs" onClick={()=>deleteClient(c.id)}>✕</button>}
          </div>
        </div>
        {/* Barra progresso */}
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
          <div style={{flex:1}}><div className="prog-wrap"><div className="prog-fill" style={{width:p+'%',background:p>=100?'#10B981':'#3B82F6'}}/></div></div>
          <span style={{fontSize:13,fontWeight:600,color:p>=100?'#10B981':'#3B82F6',minWidth:40}}>{done}/{meta}</span>
          <span className="tag" style={{background:p>=100?'#ECFDF5':'var(--blue-pale)',color:p>=100?'#059669':'var(--blue)'}}>{p}%</span>
        </div>
        {/* Semanas */}
        <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
          <span style={{fontSize:12,color:'#9CA3AF',fontWeight:500}}>Semanas:</span>
          {weeks.map(w=>{
            const marked=opEntries.some(e=>e.client_id===c.id&&e.role_type===myRole&&e.week_number===w&&e.month===month&&e.status==='done');
            return<button key={w} className={`op-week-btn ${marked?'done':''}`} onClick={()=>toggleWeek(c.id,w)} title={`Semana ${w}`}><span style={{fontSize:10}}>S{w}</span><span style={{fontSize:14}}>{marked?'✓':'○'}</span></button>;
          })}
        </div>
        {c.observations&&<div style={{fontSize:12.5,color:'#6B7280',marginTop:8,fontStyle:'italic'}}>{c.observations}</div>}
      </div>);
    })}

    {/* Modal Add Cliente */}
    {showAddClient&&<div className="overlay" onClick={()=>setShowAddClient(false)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="modal-title">Novo Cliente — Social Mídia</div>
      <form onSubmit={saveClient}>
        <div className="fg"><label className="flabel">Nome do Cliente *</label><input className="finput" required value={clientForm.name} onChange={e=>setClientForm(v=>({...v,name:e.target.value}))} placeholder="Ex: GG Balloon"/></div>
        <div className="fg"><label className="flabel">Conteúdos por Mês</label><input className="finput" type="number" min={1} value={clientForm.contents_per_month} onChange={e=>setClientForm(v=>({...v,contents_per_month:e.target.value}))}/></div>
        <div style={{display:'flex',gap:16,marginBottom:14}}>
          <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13.5,cursor:'pointer'}}><input type="checkbox" checked={clientForm.planned_days} onChange={e=>setClientForm(v=>({...v,planned_days:e.target.checked}))}/>Dias planejados</label>
          <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13.5,cursor:'pointer'}}><input type="checkbox" checked={clientForm.month_closed} onChange={e=>setClientForm(v=>({...v,month_closed:e.target.checked}))}/>Mês fechado</label>
        </div>
        <div className="fg"><label className="flabel">Observações</label><textarea className="ftextarea" value={clientForm.observations} onChange={e=>setClientForm(v=>({...v,observations:e.target.value}))} placeholder="Notas sobre o cliente..."/></div>
        <div className="modal-footer"><button type="button" className="btn btn-ghost" onClick={()=>setShowAddClient(false)}>Cancelar</button><button type="submit" className="btn btn-primary" disabled={saving}>{saving?'Salvando...':'Salvar'}</button></div>
      </form>
    </div></div>}

    {/* Modal Solicitar */}
    {showSolicitar&&<div className="overlay" onClick={()=>setShowSolicitar(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="modal-title">📨 Solicitar para a equipe</div>
      <div className="fg"><label className="flabel">Enviar para</label><select className="fselect" value={solicitForm.tipo} onChange={e=>setSolicitForm(v=>({...v,tipo:e.target.value}))}><option value="design">Design</option><option value="video">Editor de Vídeo</option></select></div>
      <div className="fg"><label className="flabel">Descrição da solicitação</label><textarea className="ftextarea" value={solicitForm.descricao} onChange={e=>setSolicitForm(v=>({...v,descricao:e.target.value}))} placeholder="Descreva o que precisa ser feito..."/></div>
      <div className="modal-footer"><button className="btn btn-ghost" onClick={()=>setShowSolicitar(null)}>Cancelar</button><button className="btn btn-primary" onClick={()=>saveSolicit(showSolicitar)} disabled={!solicitForm.descricao}>Enviar</button></div>
    </div></div>}
  </>);
}

// OPERACIONAL — DESIGN / VÍDEO (lógica igual, rótulo diferente)
// ══════════════════════════════════════════════════
function DesignVideoPanel({user,profile,opClients,opEntries,opSolicitacoes,onRefresh,toast,isGestor,roleType,label,icon,itemLabel}){
  const clients=opClients.filter(c=>c.role_type===roleType||(isGestor&&opClients.filter(c2=>c2.role_type===roleType).length>0));
  const myClients=isGestor?opClients.filter(c=>c.role_type===roleType):opClients.filter(c=>c.role_type===roleType);
  const[showAddClient,setShowAddClient]=useState(false);
  const[clientForm,setClientForm]=useState({name:'',items_per_month:4,observations:''});
  const[saving,setSaving]=useState(false);

  function currentMonth(){return new Date().toISOString().slice(0,7);}

  function clientProgress(clientId){
    const entries=opEntries.filter(e=>e.client_id===clientId&&e.role_type===roleType&&e.month===currentMonth()&&e.status==='done');
    const meta=myClients.find(c=>c.id===clientId)?.items_per_month||4;
    return{done:entries.length,meta,pct:pct(entries.length,meta)};
  }

  const totalMeta=myClients.reduce((a,c)=>a+(c.items_per_month||4),0);
  const totalDone=myClients.reduce((a,c)=>a+clientProgress(c.id).done,0);
  const totalPct=pct(totalDone,totalMeta);

  // Solicitações pendentes para este role
  const minhasSolicitacoes=opSolicitacoes.filter(s=>s.to_role===roleType&&s.status==='pendente');

  async function saveClient(e){
    e.preventDefault();setSaving(true);
    const{error}=await sb.from('op_clients').insert({...clientForm,role_type:roleType,owner_id:user.id,items_per_month:parseInt(clientForm.items_per_month)||4});
    if(error)toast('Erro: '+error.message);else{toast('✅ Cliente adicionado!');onRefresh();setShowAddClient(false);setClientForm({name:'',items_per_month:4,observations:''});}
    setSaving(false);
  }

  async function markEntry(clientId,n){
    const month=currentMonth();
    const existing=opEntries.filter(e=>e.client_id===clientId&&e.role_type===roleType&&e.month===month&&e.status==='done');
    if(existing.length>=n){
      // desmarcar o mais recente
      const last=existing[existing.length-1];
      await sb.from('op_entries').delete().eq('id',last.id);
      toast('Entrega desmarcada');
    } else {
      await sb.from('op_entries').insert({client_id:clientId,role_type:roleType,month,status:'done',user_id:user.id,week_number:existing.length+1});
      toast('✅ Entrega marcada!');
    }
    onRefresh();
  }

  async function markSolicitDone(id){await sb.from('op_solicitacoes').update({status:'concluida'}).eq('id',id);toast('Solicitação concluída!');onRefresh();}
  async function deleteClient(id){if(!confirm('Remover?'))return;await sb.from('op_clients').delete().eq('id',id);toast('Removido');onRefresh();}

  return(<>
    {/* Barra Total */}
    <div className="op-total-bar mb">
      <div className="op-total-label">{icon} Progresso Total — {label}</div>
      <div style={{display:'flex',alignItems:'baseline',gap:8,marginBottom:8}}><div className="op-total-pct">{totalPct}%</div><div style={{fontSize:13,color:'#6B7280'}}>{totalDone} de {totalMeta} {itemLabel}</div></div>
      <div className="prog-wrap" style={{height:12}}><div className="prog-fill" style={{width:totalPct+'%',background:totalPct>=100?'#10B981':'#3B82F6'}}/></div>
    </div>

    {/* Solicitações do Social */}
    {minhasSolicitacoes.length>0&&<div className="card mb">
      <div className="card-title">📨 Solicitações do Social Mídia ({minhasSolicitacoes.length})</div>
      {minhasSolicitacoes.map(s=><div key={s.id} className="op-solicitacao">
        <div><div style={{fontWeight:600,fontSize:13.5}}>{s.descricao}</div><div style={{fontSize:12,color:'#9CA3AF',marginTop:2}}>Cliente ID: {s.client_id?.slice(0,8)}...</div></div>
        <button className="btn btn-success btn-sm" onClick={()=>markSolicitDone(s.id)}>✅ Concluir</button>
      </div>)}
    </div>}

    <div className="sec-hdr"><h2>Clientes — {label}</h2><button className="btn btn-primary btn-sm" onClick={()=>setShowAddClient(true)}>+ Cliente</button></div>

    {myClients.length===0&&<div className="card"><div className="empty"><div className="empty-icon">{icon}</div>Nenhum cliente cadastrado</div></div>}

    {myClients.map(c=>{
      const{done,meta,pct:p}=clientProgress(c.id);
      const boxes=Array.from({length:meta},(_,i)=>i<done);
      return(<div key={c.id} className="op-client-card">
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:8}}>
          <div><div className="op-client-name">{c.name}</div><div style={{fontSize:12.5,color:'#6B7280'}}>{meta} {itemLabel}/mês</div></div>
          {isGestor&&<button className="btn btn-danger btn-xs" onClick={()=>deleteClient(c.id)}>✕</button>}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
          <div style={{flex:1}}><div className="prog-wrap"><div className="prog-fill" style={{width:p+'%',background:p>=100?'#10B981':'#3B82F6'}}/></div></div>
          <span style={{fontSize:13,fontWeight:600,color:p>=100?'#10B981':'#3B82F6'}}>{done}/{meta}</span>
          <span className="tag" style={{background:p>=100?'#ECFDF5':'var(--blue-pale)',color:p>=100?'#059669':'var(--blue)'}}>{p}%</span>
        </div>
        {/* Caixinhas de entrega */}
        <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
          <span style={{fontSize:12,color:'#9CA3AF',fontWeight:500,marginRight:4}}>{itemLabel}:</span>
          {boxes.map((isDone,i)=><div key={i} onClick={()=>markEntry(c.id,isDone?done-1:done+1)} style={{width:36,height:36,borderRadius:8,border:`2px solid ${isDone?'#3B82F6':'#E5E7EB'}`,background:isDone?'#3B82F6':'#fff',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:16,color:isDone?'#fff':'#E5E7EB',transition:'all .2s'}}>{isDone?'✓':'○'}</div>)}
        </div>
        {c.observations&&<div style={{fontSize:12.5,color:'#6B7280',marginTop:8,fontStyle:'italic'}}>{c.observations}</div>}
      </div>);
    })}

    {showAddClient&&<div className="overlay" onClick={()=>setShowAddClient(false)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="modal-title">Novo Cliente — {label}</div>
      <form onSubmit={saveClient}>
        <div className="fg"><label className="flabel">Nome do Cliente *</label><input className="finput" required value={clientForm.name} onChange={e=>setClientForm(v=>({...v,name:e.target.value}))} placeholder="Ex: GG Balloon"/></div>
        <div className="fg"><label className="flabel">{itemLabel} por Mês</label><input className="finput" type="number" min={1} value={clientForm.items_per_month} onChange={e=>setClientForm(v=>({...v,items_per_month:e.target.value}))}/></div>
        <div className="fg"><label className="flabel">Observações</label><textarea className="ftextarea" value={clientForm.observations} onChange={e=>setClientForm(v=>({...v,observations:e.target.value}))} placeholder="Notas..."/></div>
        <div className="modal-footer"><button type="button" className="btn btn-ghost" onClick={()=>setShowAddClient(false)}>Cancelar</button><button type="submit" className="btn btn-primary" disabled={saving}>{saving?'Salvando...':'Salvar'}</button></div>
      </form>
    </div></div>}
  </>);
}
