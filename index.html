// ── Tab Roteiros ──────────────────────────────────────────────────────────────
function TabRoteiros({clientId, gcRoteiros, onRefresh, toast}){
  const my = gcRoteiros.filter(r=>r.client_id===clientId).sort((a,b)=>b.created_at?.localeCompare(a.created_at));
  const [open, setOpen] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({titulo:'',tipo:'Reels Orgânico',pauta:'',roteiro:'',gravado:false});
  const [filterGravado, setFilterGravado] = useState('todos');
  const [selectedIds, setSelectedIds] = useState([]);
  const [saving, setSaving] = useState(false);

  async function save(e){
    e.preventDefault(); setSaving(true);
    await sb.from('gc_roteiros').insert({...form,client_id:clientId});
    toast('✅ Roteiro salvo!'); onRefresh(); setShowAdd(false); setForm({titulo:'',tipo:'Reels Orgânico',pauta:'',roteiro:'',gravado:false}); setSaving(false);
  }
  async function del(id){if(!confirm('Remover roteiro?'))return;await sb.from('gc_roteiros').delete().eq('id',id);onRefresh();}

  const filtered = my.filter(r => filterGravado==='todos' ? true : filterGravado==='gravado' ? r.gravado : !r.gravado);

  async function toggleGravado(r){
    await sb.from('gc_roteiros').update({gravado:!r.gravado}).eq('id',r.id);
    onRefresh();
  }

  function exportPDF(){
    const selected = selectedIds.length>0 ? my.filter(r=>selectedIds.includes(r.id)) : my;
    if(selected.length===0){toast('Nenhum roteiro para exportar');return;}
    const win=window.open('','_blank');
    const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Roteiros</title><style>body{font-family:Arial,sans-serif;padding:40px;max-width:800px;margin:0 auto}h1{color:#3B82F6;border-bottom:2px solid #3B82F6;padding-bottom:10px}h2{color:#111;margin-top:40px}h3{color:#6B7280;font-size:13px;text-transform:uppercase;letter-spacing:1px}p{line-height:1.7;color:#374151;white-space:pre-wrap}.roteiro-box{background:#F8F9FB;border-left:4px solid #3B82F6;padding:16px;margin:12px 0;border-radius:4px}.divider{border:none;border-top:2px dashed #E5E7EB;margin:40px 0}@media print{body{padding:20px}}</style></head><body>
    <h1>📋 Roteiros — Attos Marketing Digital</h1>
    ${selected.map(r=>`<div><h2>${r.titulo}</h2><p style="color:#7C3AED;font-weight:600">${r.tipo}</p>${r.pauta?`<h3>PAUTA</h3><p>${r.pauta}</p>`:''}${r.roteiro?`<h3>ROTEIRO</h3><div class="roteiro-box"><p>${r.roteiro}</p></div>`:''}<div class="divider"></div></div>`).join('')}
    </body></html>`;
    win.document.write(html);
    win.document.close();
    setTimeout(()=>win.print(),500);
  }

  return(<>
    <div className="sec-hdr">
      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
        <h2>Roteiros ({filtered.length})</h2>
        <div style={{display:'flex',background:'#F0F0F0',borderRadius:8,padding:3,gap:2}}>
          {[['todos','Todos'],['nao_gravado','Não gravados'],['gravado','Gravados']].map(([v,l])=><button key={v} onClick={()=>setFilterGravado(v)} style={{padding:'5px 12px',borderRadius:6,border:'none',background:filterGravado===v?'#fff':'transparent',fontWeight:filterGravado===v?600:400,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:filterGravado===v?'#111':'#6B7280'}}>{l}</button>)}
        </div>
      </div>
      <div style={{display:'flex',gap:8}}>
        {selectedIds.length>0&&<button className="btn btn-ghost btn-sm" onClick={()=>setSelectedIds([])}>Limpar seleção ({selectedIds.length})</button>}
        <button className="btn btn-ghost btn-sm" onClick={exportPDF}>📄 Exportar PDF</button>
        <button className="btn btn-primary btn-sm" onClick={()=>setShowAdd(true)}>+ Novo Roteiro</button>
      </div>
    </div>

    {filtered.length===0&&<div className="card"><div className="empty"><div className="empty-icon">📝</div>Nenhum roteiro</div></div>}
    {filtered.map(r=><div key={r.id} className="card mb" style={{borderLeft:selectedIds.includes(r.id)?'3px solid #3B82F6':'3px solid transparent',transition:'border .15s'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer'}} onClick={()=>setOpen(open===r.id?null:r.id)}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <input type="checkbox" checked={selectedIds.includes(r.id)} onChange={e=>{e.stopPropagation();setSelectedIds(s=>e.target.checked?[...s,r.id]:s.filter(i=>i!==r.id));}} onClick={e=>e.stopPropagation()} style={{width:15,height:15}}/>
          <div>
            <div style={{fontWeight:600,fontSize:14}}>{r.titulo}</div>
            <div style={{fontSize:12,color:'#9CA3AF',marginTop:2,display:'flex',gap:8,alignItems:'center'}}>
              <span>{r.tipo}</span>
              <span style={{color:r.gravado?'#10B981':'#F59E0B',fontWeight:600}}>● {r.gravado?'Gravado':'Não gravado'}</span>
            </div>
          </div>
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <button className={`btn btn-xs ${r.gravado?'btn-success':'btn-ghost'}`} onClick={e=>{e.stopPropagation();toggleGravado(r);}}>{r.gravado?'✅ Gravado':'○ Marcar gravado'}</button>
          <button className="btn btn-danger btn-xs" onClick={e=>{e.stopPropagation();del(r.id);}}>✕</button>
          <span style={{color:'#9CA3AF'}}>{open===r.id?'▲':'▼'}</span>
        </div>
      </div>
      {open===r.id&&<div style={{marginTop:12,paddingTop:12,borderTop:'1px solid #F0F0F0'}}>
        {r.pauta&&<div style={{marginBottom:12}}><div style={{fontSize:11,fontWeight:700,color:'#9CA3AF',textTransform:'uppercase',marginBottom:6}}>PAUTA</div><div style={{fontSize:13.5,whiteSpace:'pre-wrap',lineHeight:1.6}}>{r.pauta}</div></div>}
        {r.roteiro&&<div><div style={{fontSize:11,fontWeight:700,color:'#9CA3AF',textTransform:'uppercase',marginBottom:6}}>ROTEIRO</div><div style={{fontSize:13.5,whiteSpace:'pre-wrap',lineHeight:1.6,background:'#F8F9FB',padding:12,borderRadius:8}}>{r.roteiro}</div></div>}
      </div>}
    </div>)}

    {showAdd&&<div className="overlay" onClick={()=>setShowAdd(false)}><div className="modal modal-lg" onClick={e=>e.stopPropagation()}>
      <div className="modal-title">Novo Roteiro</div>
      <form onSubmit={save}>
        <div className="frow"><div className="fg"><label className="flabel">Título *</label><input className="finput" required value={form.titulo} onChange={e=>setForm(v=>({...v,titulo:e.target.value}))}/></div><div className="fg"><label className="flabel">Tipo</label><select className="fselect" value={form.tipo} onChange={e=>setForm(v=>({...v,tipo:e.target.value}))}>{['Reels Orgânico','Reels AD','Carrossel','Story','Lives'].map(t=><option key={t}>{t}</option>)}</select></div></div>
        <div className="fg"><label className="flabel">Pauta</label><textarea className="ftextarea" value={form.pauta} onChange={e=>setForm(v=>({...v,pauta:e.target.value}))} style={{minHeight:80}}/></div>
        <div className="fg"><label className="flabel">Roteiro</label><textarea className="ftextarea" value={form.roteiro} onChange={e=>setForm(v=>({...v,roteiro:e.target.value}))} style={{minHeight:120}}/></div>
        <div className="modal-footer"><button type="button" className="btn btn-ghost" onClick={()=>setShowAdd(false)}>Cancelar</button><button type="submit" className="btn btn-primary" disabled={saving}>{saving?'Salvando...':'Salvar'}</button></div>
      </form>
    </div></div>}
  </>);
}

}

// ── Tab Churn & NPS ───────────────────────────────────────────────────────────
function TabChurnNps({clientId, gcChurns, gcNps, onRefresh, toast, user}){
  const myChurns = gcChurns.filter(c=>c.client_id===clientId).sort((a,b)=>b.created_at?.localeCompare(a.created_at));
  const myNps = gcNps.filter(n=>n.client_id===clientId).sort((a,b)=>b.mes.localeCompare(a.mes));
  const [showChurn, setShowChurn] = useState(false);
  const [showNps, setShowNps] = useState(false);
  const [churnForm, setChurnForm] = useState({motivo:'Financeiro',fase:'Aviso Recebido',data_aviso:'',observacoes:''});
  const [npsForm, setNpsForm] = useState({mes:'',nota:'',pergunta_melhora:'',pergunta_agradou:'',indicaria:''});
  const [saving, setSaving] = useState(false);

  const lastNps = myNps[0];
  function npsColor(n){if(n>=9)return'#10B981';if(n>=7)return'#F59E0B';return'#EF4444';}
  function npsLabel(n){if(n>=9)return'Promotor';if(n>=7)return'Neutro';return'Detrator';}

  async function saveChurn(e){
    e.preventDefault(); setSaving(true);
    await sb.from('gc_churns').insert({...churnForm,client_id:clientId,user_id:user.id,data_aviso:churnForm.data_aviso||null});
    toast('Churn registrado!'); onRefresh(); setShowChurn(false); setSaving(false);
  }
  async function saveNps(e){
    e.preventDefault(); setSaving(true);
    await sb.from('gc_nps').insert({...npsForm,client_id:clientId,nota:parseInt(npsForm.nota)});
    toast('NPS lançado!'); onRefresh(); setShowNps(false); setSaving(false);
  }

  return(<div className="g2">
    <div>
      <div className="sec-hdr"><h2>Histórico de Churn</h2><button className="btn btn-primary btn-sm" onClick={()=>setShowChurn(true)}>+ Registrar</button></div>
      {myChurns.length===0?<div className="card"><div className="empty"><div className="empty-icon">✅</div>Sem histórico de churn</div></div>:
        myChurns.map(c=><div key={c.id} className="card mb">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
            <div><div style={{fontWeight:600}}>{c.motivo}</div><div style={{fontSize:12,color:'#9CA3AF',marginTop:2}}>{fmtDate(c.data_aviso)}</div></div>
            <span className="tag tag-red">{c.fase}</span>
          </div>
          {c.observacoes&&<div style={{fontSize:13,color:'#6B7280',marginTop:8}}>{c.observacoes}</div>}
        </div>)
      }
    </div>
    <div>
      <div className="sec-hdr"><h2>NPS</h2><button className="btn btn-primary btn-sm" onClick={()=>setShowNps(true)}>+ Lançar</button></div>
      {lastNps&&<div className="card mb" style={{textAlign:'center',padding:24}}>
        <div style={{fontSize:11,color:'#9CA3AF',marginBottom:8,fontWeight:700,textTransform:'uppercase'}}>Último NPS — {lastNps.mes}</div>
        <div style={{fontSize:56,fontWeight:700,color:npsColor(lastNps.nota),letterSpacing:-2}}>{lastNps.nota}</div>
        <div style={{fontSize:14,fontWeight:600,color:npsColor(lastNps.nota)}}>{npsLabel(lastNps.nota)}</div>
      </div>}
      {myNps.length===0?<div className="card"><div className="empty"><div className="empty-icon">⭐</div>Sem NPS lançado</div></div>:
        <div className="card"><div className="tbl-wrap"><table><thead><tr><th>Mês</th><th>Nota</th><th>Categoria</th></tr></thead>
        <tbody>{myNps.map(n=><tr key={n.id}><td>{n.mes}</td><td style={{fontWeight:700,color:npsColor(n.nota)}}>{n.nota}</td><td>{npsLabel(n.nota)}</td></tr>)}</tbody>
        </table></div></div>
      }
    </div>

    {showChurn&&<div className="overlay" onClick={()=>setShowChurn(false)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="modal-title">Registrar Churn</div>
      <form onSubmit={saveChurn}>
        <div className="fg"><label className="flabel">Motivo</label><select className="fselect" value={churnForm.motivo} onChange={e=>setChurnForm(v=>({...v,motivo:e.target.value}))}>{GC_CHURN_MOTIVOS.map(m=><option key={m}>{m}</option>)}</select></div>
        <div className="fg"><label className="flabel">Fase</label><select className="fselect" value={churnForm.fase} onChange={e=>setChurnForm(v=>({...v,fase:e.target.value}))}>{GC_CHURN_FASES.map(f=><option key={f}>{f}</option>)}</select></div>
        <div className="fg"><label className="flabel">Data do Aviso</label><input className="finput" type="date" value={churnForm.data_aviso} onChange={e=>setChurnForm(v=>({...v,data_aviso:e.target.value}))}/></div>
        <div className="fg"><label className="flabel">Observações</label><textarea className="ftextarea" value={churnForm.observacoes} onChange={e=>setChurnForm(v=>({...v,observacoes:e.target.value}))}/></div>
        <div className="modal-footer"><button type="button" className="btn btn-ghost" onClick={()=>setShowChurn(false)}>Cancelar</button><button type="submit" className="btn btn-primary" disabled={saving}>{saving?'Salvando...':'Registrar'}</button></div>
      </form>
    </div></div>}

    {showNps&&<div className="overlay" onClick={()=>setShowNps(false)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="modal-title">Lançar NPS</div>
      <form onSubmit={saveNps}>
        <div className="frow"><div className="fg"><label className="flabel">Mês (ex: 2026-05)</label><input className="finput" required value={npsForm.mes} onChange={e=>setNpsForm(v=>({...v,mes:e.target.value}))} placeholder="AAAA-MM"/></div><div className="fg"><label className="flabel">Nota (0-10)</label><input className="finput" type="number" min={0} max={10} required value={npsForm.nota} onChange={e=>setNpsForm(v=>({...v,nota:e.target.value}))}/></div></div>
        <div className="fg"><label className="flabel">O que poderia melhorar?</label><textarea className="ftextarea" value={npsForm.pergunta_melhora} onChange={e=>setNpsForm(v=>({...v,pergunta_melhora:e.target.value}))}/></div>
        <div className="fg"><label className="flabel">O que mais agradou?</label><textarea className="ftextarea" value={npsForm.pergunta_agradou} onChange={e=>setNpsForm(v=>({...v,pergunta_agradou:e.target.value}))}/></div>
        <div className="fg"><label className="flabel">Indicaria?</label><input className="finput" value={npsForm.indicaria} onChange={e=>setNpsForm(v=>({...v,indicaria:e.target.value}))} placeholder="Sim / Não / Talvez"/></div>
        <div className="modal-footer"><button type="button" className="btn btn-ghost" onClick={()=>setShowNps(false)}>Cancelar</button><button type="submit" className="btn btn-primary" disabled={saving}>{saving?'Salvando...':'Salvar'}</button></div>
      </form>
    </div></div>}
  </div>);
}

// ── Painel Churn & NPS Geral ──────────────────────────────────────────────────
function ChurnNpsPanel({gcClients, gcChurns, gcNps}){
  const mes = new Date().toISOString().slice(0,7);
  const churnsHoje = gcChurns.filter(c=>c.created_at?.startsWith(mes.slice(0,7)));
  const npsHoje = gcNps.filter(n=>n.mes===mes);
  const avgNps = npsHoje.length ? Math.round(npsHoje.reduce((a,n)=>a+n.nota,0)/npsHoje.length) : null;
  const mrrPerdido = churnsHoje.reduce((a,c)=>{const cl=gcClients.find(cl=>cl.id===c.client_id);return a+(cl?.orcamento||0);},0);
  const turnRate = gcClients.length ? Math.round((churnsHoje.length/gcClients.length)*100) : 0;
  function getNpsColor(n){if(n>=9)return'#10B981';if(n>=7)return'#F59E0B';return'#EF4444';}
  function getClientName(id){return gcClients.find(c=>c.id===id)?.name||'—';}

  return(<>
    <div className="g4 mb">
      <div className="card"><div className="card-title">Churn no Mês</div><div className="metric-big" style={{color:'#EF4444'}}>{churnsHoje.length}</div></div>
      <div className="card"><div className="card-title">Turn Rate</div><div className="metric-big">{turnRate}%</div><div className="metric-sub">meta: abaixo de 10%</div></div>
      <div className="card"><div className="card-title">MRR Perdido</div><div className="metric-big" style={{fontSize:22,color:'#EF4444'}}>{fmtR(mrrPerdido)}</div></div>
      <div className="card"><div className="card-title">NPS Médio</div><div className="metric-big" style={{color:avgNps?getNpsColor(avgNps):'#9CA3AF'}}>{avgNps??'—'}</div></div>
    </div>
    <div className="g2">
      <div className="card">
        <div className="card-title">Churns do Mês</div>
        {churnsHoje.length===0?<div className="empty">Nenhum churn este mês 🎉</div>:
          <div className="tbl-wrap"><table><thead><tr><th>Cliente</th><th>Motivo</th><th>Fase</th><th>MRR</th></tr></thead>
          <tbody>{churnsHoje.map(c=><tr key={c.id}><td>{getClientName(c.client_id)}</td><td>{c.motivo}</td><td><span className="tag tag-red">{c.fase}</span></td><td style={{color:'#EF4444'}}>{fmtR(gcClients.find(cl=>cl.id===c.client_id)?.orcamento||0)}</td></tr>)}</tbody>
          </table></div>}
      </div>
      <div className="card">
        <div className="card-title">NPS do Mês</div>
        {npsHoje.length===0?<div className="empty">Nenhum NPS este mês</div>:
          <div className="tbl-wrap"><table><thead><tr><th>Cliente</th><th>Nota</th><th>Categoria</th></tr></thead>
          <tbody>{npsHoje.map(n=><tr key={n.id}><td>{getClientName(n.client_id)}</td><td style={{fontWeight:700,color:getNpsColor(n.nota)}}>{n.nota}</td><td>{n.nota>=9?'Promotor':n.nota>=7?'Neutro':'Detrator'}</td></tr>)}</tbody>
          </table></div>}
      </div>
    </div>
  </>);
}

// CHAT INTERNO
// ══════════════════════════════════════════════════════════════════════════════
const CHAT_CHANNELS = {
  comercial: {
    id: 'comercial',
    label: 'Chat Comercial',
    icon: '💼',
    color: '#3B82F6',
    roles: ['gestor','sdr','closer'],
  },
  operacional: {
    id: 'operacional',
    label: 'Chat Operacional',
    icon: '🎨',
    color: '#7C3AED',
    roles: ['gestor','social','design','video','trafego'],
  },
};

function ChatInterno({user, profile, chatMessages, profiles, onRefresh}){
  const role = profile?.role||'gestor';
  // Which channels can this user see?
  const myChannels = Object.values(CHAT_CHANNELS).filter(ch=>ch.roles.includes(role));
  const[activeChannel, setActiveChannel] = useState(myChannels[0]?.id||'comercial');
  const[message, setMessage] = useState('');
  const[sending, setSending] = useState(false);
  const bottomRef = useRef(null);

  const channelMessages = chatMessages
    .filter(m=>m.channel===activeChannel)
    .sort((a,b)=>a.created_at?.localeCompare(b.created_at));

  useEffect(()=>{
    bottomRef.current?.scrollIntoView({behavior:'smooth'});
  },[channelMessages.length, activeChannel]);

  function getName(id){ return profiles.find(p=>p.id===id)?.name||'Usuário'; }
  function getRole(id){ return profiles.find(p=>p.id===id)?.role||''; }
  function getInitial(id){ return (getName(id)||'U')[0].toUpperCase(); }
  function getAvatarColor(id){
    const colors=['#3B82F6','#7C3AED','#10B981','#F59E0B','#EF4444','#EC4899'];
    const idx = id ? id.charCodeAt(0)%colors.length : 0;
    return colors[idx];
  }
  function formatTime(ts){
    if(!ts) return '';
    const d=new Date(ts);
    const now=new Date();
    const isToday=d.toDateString()===now.toDateString();
    if(isToday) return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }

  async function sendMessage(e){
    e.preventDefault();
    if(!message.trim()) return;
    setSending(true);
    await sb.from('chat_messages').insert({
      user_id: user.id,
      channel: activeChannel,
      message: message.trim(),
    });
    setMessage('');
    setSending(false);
    onRefresh();
  }

  const ch = CHAT_CHANNELS[activeChannel];

  return(
    <div style={{display:'flex',height:'75vh',minHeight:500,gap:0,background:'#fff',borderRadius:12,border:'1px solid #F0F0F0',overflow:'hidden',boxShadow:'0 1px 4px rgba(0,0,0,.04)'}}>

      {/* Sidebar dos canais */}
      <div style={{width:220,flexShrink:0,background:'#F8F9FB',borderRight:'1px solid #F0F0F0',display:'flex',flexDirection:'column'}}>
        <div style={{padding:'16px 16px 12px',borderBottom:'1px solid #F0F0F0'}}>
          <div style={{fontSize:13,fontWeight:700,color:'#111',marginBottom:2}}>Mensagens</div>
          <div style={{fontSize:11.5,color:'#9CA3AF'}}>Comunicação interna</div>
        </div>
        <div style={{padding:'8px 8px',flex:1}}>
          {myChannels.map(ch=>{
            const unread=chatMessages.filter(m=>m.channel===ch.id).length;
            const isActive=activeChannel===ch.id;
            return(
              <div key={ch.id} onClick={()=>setActiveChannel(ch.id)} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:8,cursor:'pointer',background:isActive?ch.color+'15':'transparent',border:isActive?`1px solid ${ch.color}30`:'1px solid transparent',marginBottom:4,transition:'all .15s'}}>
                <div style={{width:36,height:36,borderRadius:10,background:isActive?ch.color:'#E5E7EB',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0}}>{ch.icon}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:isActive?700:500,color:isActive?ch.color:'#374151',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{ch.label}</div>
                  <div style={{fontSize:11,color:'#9CA3AF'}}>{ch.roles.length} membros</div>
                </div>
              </div>
            );
          })}
        </div>

        {/* Membros do canal */}
        <div style={{padding:'12px 16px',borderTop:'1px solid #F0F0F0'}}>
          <div style={{fontSize:11,fontWeight:700,color:'#9CA3AF',textTransform:'uppercase',letterSpacing:.6,marginBottom:8}}>Membros</div>
          {profiles.filter(p=>CHAT_CHANNELS[activeChannel]?.roles.includes(p.role)).map(p=>(
            <div key={p.id} style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
              <div style={{width:24,height:24,borderRadius:'50%',background:getAvatarColor(p.id),display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:'#fff',flexShrink:0}}>{p.name[0].toUpperCase()}</div>
              <div style={{fontSize:12,color:'#374151',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{p.name}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Área do chat */}
      <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0}}>
        {/* Header */}
        <div style={{padding:'14px 20px',borderBottom:'1px solid #F0F0F0',display:'flex',alignItems:'center',gap:12,background:'#fff'}}>
          <div style={{width:38,height:38,borderRadius:10,background:ch?.color+'15',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>{ch?.icon}</div>
          <div>
            <div style={{fontSize:15,fontWeight:700,color:'#111'}}>{ch?.label}</div>
            <div style={{fontSize:12,color:'#9CA3AF'}}>{profiles.filter(p=>ch?.roles.includes(p.role)).length} membros · {channelMessages.length} mensagens</div>
          </div>
        </div>

        {/* Mensagens */}
        <div style={{flex:1,overflowY:'auto',padding:'16px 20px',display:'flex',flexDirection:'column',gap:12}}>
          {channelMessages.length===0&&(
            <div style={{textAlign:'center',padding:'60px 20px',color:'#9CA3AF'}}>
              <div style={{fontSize:32,marginBottom:12}}>{ch?.icon}</div>
              <div style={{fontSize:15,fontWeight:600,marginBottom:4}}>Início do {ch?.label}</div>
              <div style={{fontSize:13}}>Seja o primeiro a enviar uma mensagem!</div>
            </div>
          )}
          {channelMessages.map((msg,i)=>{
            const isMe = msg.user_id===user.id;
            const prevMsg = channelMessages[i-1];
            const showHeader = !prevMsg || prevMsg.user_id!==msg.user_id;
            return(
              <div key={msg.id} style={{display:'flex',flexDirection:isMe?'row-reverse':'row',gap:8,alignItems:'flex-end'}}>
                {!isMe&&showHeader&&(
                  <div style={{width:32,height:32,borderRadius:'50%',background:getAvatarColor(msg.user_id),display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:'#fff',flexShrink:0,marginBottom:2}}>{getInitial(msg.user_id)}</div>
                )}
                {!isMe&&!showHeader&&<div style={{width:32,flexShrink:0}}/>}
                <div style={{maxWidth:'70%',display:'flex',flexDirection:'column',alignItems:isMe?'flex-end':'flex-start',gap:2}}>
                  {showHeader&&!isMe&&<div style={{fontSize:11.5,fontWeight:600,color:getAvatarColor(msg.user_id),paddingLeft:4}}>{getName(msg.user_id)}</div>}
                  <div style={{background:isMe?ch?.color:'#F3F4F6',color:isMe?'#fff':'#111',padding:'9px 14px',borderRadius:isMe?'16px 16px 4px 16px':'16px 16px 16px 4px',fontSize:13.5,lineHeight:1.5,wordBreak:'break-word'}}>
                    {msg.message}
                  </div>
                  <div style={{fontSize:10.5,color:'#9CA3AF',paddingLeft:isMe?0:4,paddingRight:isMe?4:0}}>{formatTime(msg.created_at)}</div>
                </div>
              </div>
            );
          })}
          <div ref={bottomRef}/>
        </div>

        {/* Input */}
        <div style={{padding:'12px 20px',borderTop:'1px solid #F0F0F0',background:'#fff'}}>
          <form onSubmit={sendMessage} style={{display:'flex',gap:10,alignItems:'flex-end'}}>
            <div style={{flex:1,background:'#F8F9FB',borderRadius:12,border:'1.5px solid #E5E7EB',padding:'8px 14px',display:'flex',alignItems:'center'}}>
              <textarea
                value={message}
                onChange={e=>setMessage(e.target.value)}
                onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage(e);}}}
                placeholder={`Mensagem para ${ch?.label}...`}
                style={{flex:1,border:'none',background:'transparent',resize:'none',fontFamily:'inherit',fontSize:14,outline:'none',color:'#111',maxHeight:100,lineHeight:1.5}}
                rows={1}
              />
            </div>
            <button type="submit" disabled={!message.trim()||sending} style={{width:42,height:42,borderRadius:10,background:message.trim()?ch?.color:'#E5E7EB',border:'none',cursor:message.trim()?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,transition:'all .15s',flexShrink:0}}>
              {sending?'⏳':'➤'}
            </button>
          </form>
        </div>
      </div>
    </div>
  );
}

);

CREATE TABLE IF NOT EXISTS public.gc_metricas (id UUID DEFAULT gen_random_uuid() PRIMARY KEY,client_id UUID REFERENCES public.gc_clients(id) ON DELETE CASCADE,mes TEXT NOT NULL,seguidores INT,alcance INT,impressoes INT,curtidas INT,comentarios INT,salvamentos INT,compartilhamentos INT,visitas_perfil INT,cliques_bio INT,plays_reels INT,created_at TIMESTAMPTZ DEFAULT NOW());

CREATE TABLE IF NOT EXISTS public.gc_roteiros (id UUID DEFAULT gen_random_uuid() PRIMARY KEY,client_id UUID REFERENCES public.gc_clients(id) ON DELETE CASCADE,titulo TEXT NOT NULL,tipo TEXT,pauta TEXT,roteiro TEXT,gravado BOOLEAN DEFAULT FALSE,created_at TIMESTAMPTZ DEFAULT NOW());
ALTER TABLE public.gc_roteiros DISABLE ROW LEVEL SECURITY;
CREATE TABLE IF NOT EXISTS public.gc_atas (id UUID DEFAULT gen_random_uuid() PRIMARY KEY,client_id UUID REFERENCES public.gc_clients(id) ON DELETE CASCADE,titulo TEXT NOT NULL,data_reuniao DATE,participantes TEXT,pauta TEXT,decisoes TEXT,proximos_passos TEXT,created_at TIMESTAMPTZ DEFAULT NOW());
ALTER TABLE public.gc_atas DISABLE ROW LEVEL SECURITY;
CREATE TABLE IF NOT EXISTS public.gc_logins (id UUID DEFAULT gen_random_uuid() PRIMARY KEY,client_id UUID REFERENCES public.gc_clients(id) ON DELETE CASCADE,plataforma TEXT NOT NULL,usuario TEXT,senha TEXT,url TEXT,observacoes TEXT,created_at TIMESTAMPTZ DEFAULT NOW());
ALTER TABLE public.gc_logins DISABLE ROW LEVEL SECURITY;
CREATE TABLE IF NOT EXISTS public.gc_churns (id UUID DEFAULT gen_random_uuid() PRIMARY KEY,client_id UUID REFERENCES public.gc_clients(id) ON DELETE CASCADE,user_id UUID REFERENCES public.profiles(id),motivo TEXT,fase TEXT DEFAULT 'Aviso Recebido',data_aviso DATE,observacoes TEXT,created_at TIMESTAMPTZ DEFAULT NOW());
ALTER TABLE public.gc_churns DISABLE ROW LEVEL SECURITY;
CREATE TABLE IF NOT EXISTS public.gc_nps (id UUID DEFAULT gen_random_uuid() PRIMARY KEY,client_id UUID REFERENCES public.gc_clients(id) ON DELETE CASCADE,mes TEXT NOT NULL,nota INT CHECK(nota>=0 AND nota<=10),pergunta_melhora TEXT,pergunta_agradou TEXT,indicaria TEXT,created_at TIMESTAMPTZ DEFAULT NOW());
ALTER TABLE public.gc_nps DISABLE ROW LEVEL SECURITY;`;


// ── PÁGINA DE APROVAÇÃO DO CLIENTE ───────────────────────────────────────────
function ApprovalPage({postId}){
  const[post,setPost]=useState(null);
  const[loading,setLoading]=useState(true);
  const[approved,setApproved]=useState(false);
  const[saving,setSaving]=useState(false);

  useEffect(()=>{
    sb.from('gc_calendario').select('*').eq('id',postId).single().then(({data})=>{
      setPost(data);
      setApproved(data?.aprovado_cliente||false);
      setLoading(false);
    });
  },[postId]);

  async function aprovar(){
    setSaving(true);
    await sb.from('gc_calendario').update({aprovado_cliente:true,status_post:'Aprovado'}).eq('id',postId);
    setApproved(true);
    setSaving(false);
  }

  if(loading) return <div className="loading"><div className="spinner"/><span>Carregando...</span></div>;
  if(!post) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#F8F9FB'}}><div style={{textAlign:'center',color:'#6B7280'}}>Post não encontrado</div></div>;

  return(
    <div style={{minHeight:'100vh',background:'#F8F9FB',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div style={{background:'#fff',borderRadius:16,padding:32,width:'100%',maxWidth:540,boxShadow:'0 4px 24px rgba(0,0,0,.08)'}}>
        {/* Logo */}
        <div style={{textAlign:'center',marginBottom:24}}>
          <div style={{fontSize:20,fontWeight:700,letterSpacing:-.5}}>Attos <span style={{color:'#3B82F6'}}>Dashboard</span></div>
          <div style={{fontSize:13,color:'#9CA3AF',marginTop:4}}>Aprovação de conteúdo</div>
        </div>

        <div style={{fontWeight:700,fontSize:18,marginBottom:4}}>{post.titulo||'Post sem título'}</div>
        <div style={{fontSize:13,color:'#9CA3AF',marginBottom:16}}>{fmtDate(post.data_post)} · {post.tipo}</div>

        {/* Arte */}
        {post.arte_url&&(
          <div style={{marginBottom:16}}>
            <div style={{fontSize:11,fontWeight:700,color:'#9CA3AF',textTransform:'uppercase',marginBottom:8}}>Arte</div>
            <img src={post.arte_url} alt="arte" style={{width:'100%',borderRadius:10,maxHeight:500,objectFit:'contain',background:'#F8F9FB',cursor:'zoom-in'}} onClick={()=>window.open(post.arte_url,'_blank')}/>
          </div>
        )}

        {/* Legenda */}
        {post.legenda&&(
          <div style={{marginBottom:20}}>
            <div style={{fontSize:11,fontWeight:700,color:'#9CA3AF',textTransform:'uppercase',marginBottom:8}}>Legenda</div>
            <div style={{background:'#F8F9FB',borderRadius:8,padding:'12px 14px',fontSize:14,lineHeight:1.7,whiteSpace:'pre-wrap',color:'#374151'}}>{post.legenda}</div>
          </div>
        )}

        {/* Botão aprovação */}
        {approved?(
          <div style={{background:'#ECFDF5',border:'2px solid #10B981',borderRadius:12,padding:'16px',textAlign:'center'}}>
            <div style={{fontSize:28,marginBottom:6}}>✅</div>
            <div style={{fontWeight:700,fontSize:16,color:'#059669'}}>Conteúdo Aprovado!</div>
            <div style={{fontSize:13,color:'#6B7280',marginTop:4}}>Obrigado pela confirmação.</div>
          </div>
        ):(
          <button onClick={aprovar} disabled={saving} style={{width:'100%',background:'#3B82F6',color:'#fff',border:'none',borderRadius:10,padding:'14px',fontSize:15,fontWeight:700,cursor:'pointer',fontFamily:'inherit',transition:'background .2s'}}>
            {saving?'Aprovando...':'✅ Aprovar este conteúdo'}
          </button>
        )}

        <div style={{textAlign:'center',marginTop:16,fontSize:11,color:'#D1D5DB'}}>Powered by Attos Dashboard</div>
      </div>
    </div>
  );
}

// APP ROOT
function App(){
  const[user,setUser]=useState(null);const[profile,setProfile]=useState(null);const[loading,setLoading]=useState(true);const[toastMsg,setToastMsg]=useState('');const[activeTab,setActiveTab]=useState('dashboard');const[period,setPeriod]=useState('month');
  const[sdrEntries,setSdrEntries]=useState([]);const[closerEntries,setCloserEntries]=useState([]);const[leads,setLeads]=useState([]);const[profiles,setProfiles]=useState([]);const[settings,setSettings]=useState({goals:{},weekly_meeting_goal:8});
  const[opClients,setOpClients]=useState([]);const[opEntries,setOpEntries]=useState([]);const[opSolicitacoes,setOpSolicitacoes]=useState([]);const[opTasks,setOpTasks]=useState([]);
  const[needsMig,setNeedsMig]=useState(false);const[migCopied,setMigCopied]=useState(false);
  const[gcClients,setGcClients]=useState([]);
  const[gcOnboarding,setGcOnboarding]=useState([]);
  const[gcEstrategia,setGcEstrategia]=useState([]);
  const[gcCalendario,setGcCalendario]=useState([]);
  const[gcMetricas,setGcMetricas]=useState([]);
  const[gcRoteiros,setGcRoteiros]=useState([]);
  const[gcAtas,setGcAtas]=useState([]);
  const[gcLogins,setGcLogins]=useState([]);
  const[gcChurns,setGcChurns]=useState([]);
  const[gcNps,setGcNps]=useState([]);
  const[openClient,setOpenClient]=useState(null);
  const[chatMessages,setChatMessages]=useState([]);
  function toast(msg){setToastMsg(msg);setTimeout(()=>setToastMsg(''),3000);}
  const dateRange=useMemo(()=>getPeriodRange(period),[period]);
  useEffect(()=>{sb.auth.getSession().then(async({data:{session}})=>{if(session){const{data:prof}=await sb.from('profiles').select('*').eq('id',session.user.id).single();setUser(session.user);setProfile(prof);}setLoading(false);});},[]);
  useEffect(()=>{if(!user)return;loadAll();
    const channels=[
      sb.channel('rt1').on('postgres_changes',{event:'*',schema:'public',table:'sdr_entries'},()=>loadSdr()).subscribe(),
      sb.channel('rt2').on('postgres_changes',{event:'*',schema:'public',table:'closer_entries'},()=>loadCloser()).subscribe(),
      sb.channel('rt3').on('postgres_changes',{event:'*',schema:'public',table:'leads'},()=>loadLeads()).subscribe(),
      sb.channel('rt4').on('postgres_changes',{event:'*',schema:'public',table:'settings'},()=>loadSettings()).subscribe(),
      sb.channel('rt5').on('postgres_changes',{event:'*',schema:'public',table:'profiles'},()=>loadProfiles()).subscribe(),
      sb.channel('rt6').on('postgres_changes',{event:'*',schema:'public',table:'op_clients'},()=>loadOp()).subscribe(),
      sb.channel('rt7').on('postgres_changes',{event:'*',schema:'public',table:'op_entries'},()=>loadOp()).subscribe(),
      sb.channel('rt8').on('postgres_changes',{event:'*',schema:'public',table:'op_solicitacoes'},()=>loadOp()).subscribe(),
      sb.channel('rt9').on('postgres_changes',{event:'*',schema:'public',table:'op_tasks'},()=>loadOpTasks()).subscribe(),
      sb.channel('rt10').on('postgres_changes',{event:'*',schema:'public',table:'gc_clients'},()=>loadGC()).subscribe(),
      sb.channel('rt11').on('postgres_changes',{event:'*',schema:'public',table:'gc_onboarding'},()=>loadGC()).subscribe(),
      sb.channel('rt12').on('postgres_changes',{event:'*',schema:'public',table:'chat_messages'},()=>loadChat()).subscribe(),
    ];
    return()=>channels.forEach(c=>sb.removeChannel(c));
  },[user]);
  async function loadAll(){await Promise.all([loadSdr(),loadCloser(),loadLeads(),loadProfiles(),loadSettings(),loadOp(),loadOpTasks(),loadGC(),loadChat()]);}
  async function loadSdr(){const{data}=await sb.from('sdr_entries').select('*');setSdrEntries(data||[]);}
  async function loadCloser(){const{data}=await sb.from('closer_entries').select('*');setCloserEntries(data||[]);}
  async function loadLeads(){const{data,error}=await sb.from('leads').select('*').order('created_at',{ascending:false});if(error?.message?.includes('does not exist')){setNeedsMig(true);}else setLeads(data||[]);}
  async function loadProfiles(){const{data}=await sb.from('profiles').select('*');setProfiles(data||[]);}
  async function loadSettings(){const{data}=await sb.from('settings').select('*');if(!data)return;const s={};data.forEach(r=>{s[r.key]=r.value;});setSettings({goals:s.goals||{},weekly_meeting_goal:s.weekly_meeting_goal||8});}
  async function loadOp(){
    const[{data:c},{data:e},{data:s}]=await Promise.all([sb.from('op_clients').select('*'),sb.from('op_entries').select('*').order('created_at',{ascending:true}),sb.from('op_solicitacoes').select('*').order('created_at',{ascending:false})]);
    setOpClients(c||[]);setOpEntries(e||[]);setOpSolicitacoes(s||[]);
  }
  async function loadOpTasks(){const{data,error}=await sb.from('op_tasks').select('*').order('created_at',{ascending:true});if(!error)setOpTasks(data||[]);}
  async function loadChat(){const{data}=await sb.from('chat_messages').select('*').order('created_at',{ascending:true}).limit(200);if(data)setChatMessages(data);}
  async function loadGC(){
    const tables=['gc_clients','gc_onboarding','gc_estrategia','gc_calendario','gc_metricas','gc_roteiros','gc_atas','gc_logins','gc_churns','gc_nps'];
    const setters=[setGcClients,setGcOnboarding,setGcEstrategia,setGcCalendario,setGcMetricas,setGcRoteiros,setGcAtas,setGcLogins,setGcChurns,setGcNps];
    const results=await Promise.all(tables.map(t=>sb.from(t).select('*').order('created_at',{ascending:true})));
    results.forEach(({data},i)=>{if(data)setters[i](data);});
  }

  if(loading)return<div className="loading"><div className="spinner"/><span>Carregando...</span></div>;
  // Check for approval link - after hooks
  const urlParams = new URLSearchParams(window.location.search);
  const approvalPostId = urlParams.get('post');
  if(approvalPostId) return <ApprovalPage postId={approvalPostId}/>;
  if(!user)return<AuthScreen onLogin={(u,p)=>{setUser(u);setProfile(p);}}/>;
  const role=profile?.role;
  const isGestor=role==='gestor';

  // NAV por role
  const navByRole={
    gestor:[
      {section:'Comercial'},{id:'dashboard',icon:'📊',label:'Dashboard'},{id:'metas',icon:'🎯',label:'Metas'},{id:'reunioes',icon:'📅',label:'Reuniões'},{id:'crm',icon:'🔥',label:'CRM'},{id:'sdr-panel',icon:'📞',label:'Painel SDR'},{id:'closer-panel',icon:'🤝',label:'Painel Closer'},
      {section:'Operacional'},{id:'op-overview',icon:'📋',label:'Visão Geral Op.'},{id:'op-social',icon:'📱',label:'Social Mídia'},{id:'op-design',icon:'🎨',label:'Design'},{id:'op-video',icon:'🎬',label:'Editor de Vídeo'},{id:'op-trafego',icon:'📈',label:'Tráfego'},
      {section:'Clientes'},{id:'clientes',icon:'👥',label:'Clientes'},{id:'churn-nps',icon:'📉',label:'Churn & NPS'},{section:'Comunicação'},{id:'chat',icon:'💬',label:'Chat Interno'},{section:'Gestão'},{id:'config',icon:'⚙️',label:'Configurações'},
    ],
    sdr:[{section:'Meu Painel'},{id:'dashboard',icon:'📊',label:'Dashboard'},{id:'sdr-panel',icon:'✏️',label:'Lançamento'},{id:'crm',icon:'🔥',label:'Meus Leads'},{id:'reunioes',icon:'📅',label:'Reuniões'}],
    closer:[{section:'Meu Painel'},{id:'dashboard',icon:'📊',label:'Dashboard'},{id:'closer-panel',icon:'✏️',label:'Lançamento'},{id:'reunioes',icon:'📅',label:'Minhas Reuniões'},{id:'crm',icon:'🔥',label:'Pipeline'}],
    social:[{section:'Meu Painel'},{id:'op-social-dash',icon:'📊',label:'Dashboard'},{id:'op-social',icon:'📱',label:'Clientes Social'},{id:'op-tasks-social',icon:'📋',label:'Minhas Tarefas'},{section:'Clientes'},{id:'clientes',icon:'👥',label:'Clientes'},{section:'Comunicação'},{id:'chat',icon:'💬',label:'Chat Operacional'}],
    design:[{section:'Meu Painel'},{id:'op-design-dash',icon:'📊',label:'Dashboard'},{id:'op-tasks-design',icon:'📋',label:'Tarefas do Dia'},{section:'Clientes'},{id:'clientes',icon:'👥',label:'Clientes'},{section:'Comunicação'},{id:'chat',icon:'💬',label:'Chat Operacional'}],
    video:[{section:'Meu Painel'},{id:'op-video-dash',icon:'📊',label:'Dashboard'},{id:'op-tasks-video',icon:'📋',label:'Tarefas do Dia'},{section:'Clientes'},{id:'clientes',icon:'👥',label:'Clientes'},{section:'Comunicação'},{id:'chat',icon:'💬',label:'Chat Operacional'}],
    trafego:[{section:'Meu Painel'},{id:'op-trafego-dash',icon:'📊',label:'Dashboard'},{id:'op-tasks-trafego',icon:'📋',label:'Tarefas do Dia'},{section:'Clientes'},{id:'clientes',icon:'👥',label:'Clientes'}],
  };

  const pageLabels={dashboard:'Dashboard',metas:'Metas',reunioes:'Reuniões da Semana',crm:'CRM — Pipeline','sdr-panel':isGestor?'Painel SDR':'Lançamento','closer-panel':isGestor?'Painel Closer':'Lançamento',config:'Configurações','op-overview':'Operacional — Visão Geral','op-social':'Social Mídia','op-design':'Design','op-video':'Editor de Vídeo','op-trafego':'Gestor de Tráfego','op-social-dash':'Dashboard — Social Mídia','op-design-dash':'Dashboard — Design','op-video-dash':'Dashboard — Editor de Vídeo','op-trafego-dash':'Dashboard — Tráfego','op-tasks-social':'Tarefas do Dia — Social','op-tasks-design':'Tarefas do Dia — Design','op-tasks-video':'Tarefas do Dia — Vídeo','op-tasks-trafego':'Tarefas do Dia — Tráfego','clientes':'Gestão de Clientes','churn-nps':'Churn & NPS','chat':'Chat Interno'};

  const navItems=navByRole[role]||navByRole.sdr;
  const migBanner=needsMig&&['crm','op-social','op-design','op-video','op-trafego','op-overview'].includes(activeTab);

  return(<div className="app">
    <Sidebar profile={profile} navItems={navItems} activeTab={activeTab} onTab={setActiveTab}/>
    <div className="main">

        {activeTab==='op-tasks-design'&&<OpTaskKanban user={user} opTasks={opTasks} onRefresh={loadOpTasks} toast={toast} roleType="design" readOnly={false}/>}
        {activeTab==='op-tasks-video'&&<OpTaskKanban user={user} opTasks={opTasks} onRefresh={loadOpTasks} toast={toast} roleType="video" readOnly={false}/>}
        {activeTab==='op-tasks-trafego'&&<OpTaskKanban user={user} opTasks={opTasks} onRefresh={loadOpTasks} toast={toast} roleType="trafego" readOnly={false}/>}
        {/* Add frase for commercial roles too */}
        {activeTab==='sdr-panel'&&role!=='gestor'&&false}
      </div>
    </div>
    <Toast msg={toastMsg}/>
  </div>);
}

function AuthScreen({onLogin}){
  const[email,setEmail]=useState('');const[password,setPassword]=useState('');const[loading,setLoading]=useState(false);const[error,setError]=useState('');
  async function handleLogin(e){e.preventDefault();setLoading(true);setError('');const{data,error:err}=await sb.auth.signInWithPassword({email,password});if(err){setError(err.message);setLoading(false);return;}const{data:prof}=await sb.from('profiles').select('*').eq('id',data.user.id).single();onLogin(data.user,prof);setLoading(false);}
  return(<div className="auth-wrap"><div className="auth-card"><div className="auth-logo">Attos <span>Dashboard</span></div><p className="auth-sub">Painel de prospecção ativa</p><form onSubmit={handleLogin}><label className="auth-label">E-mail</label><input className="auth-input" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="seu@email.com" required/><label className="auth-label">Senha</label><input className="auth-input" type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" required/>{error&&<p className="err">{error}</p>}<button className="auth-btn" type="submit" disabled={loading}>{loading?'Entrando...':'Entrar'}</button></form></div></div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
