function ApprovalPage({postId}){
  const[post,setPost]=useState(null);const[loading,setLoading]=useState(true);const[approved,setApproved]=useState(false);const[saving,setSaving]=useState(false);
  useEffect(()=>{sb.from('gc_calendario').select('*').eq('id',postId).single().then(({data})=>{setPost(data);setApproved(data?.aprovado_cliente||false);setLoading(false);});},[postId]);
  async function aprovar(){setSaving(true);await sb.from('gc_calendario').update({aprovado_cliente:true,status_post:'Aprovado'}).eq('id',postId);setApproved(true);setSaving(false);}
  async function fecharLead(lead, dados){
    const mes_atual = currentMes();
    // 1. Atualiza lead para fechado
    await sb.from('leads').update({stage:'fechado',mes_fechamento:mes_atual,updated_at:new Date().toISOString()}).eq('id',lead.id);
    // 2. Cria no financeiro
    await sb.from('financeiro_clientes').insert({nome:dados.nome,produto:dados.produto,valor_mensal:parseFloat(dados.valor)||0,data_inicio:dados.data_inicio||null,status:'ativo'});
    // 3. Cria na gestão de clientes
    await sb.from('gc_clients').insert({name:dados.nome,produto:dados.produto,orcamento:parseFloat(dados.valor)||0,status:'Onboarding',situacao:'Estável',created_by:user.id});
    // 4. Cria no social como cliente
    await sb.from('op_clients').insert({name:dados.nome,role_type:'social',owner_id:user.id,contents_per_month:16,observations:'Cliente via CRM'});
    await Promise.all([loadLeads(),loadFin(),loadGC(),loadOp()]);
    toast('🎉 Cliente fechado! Adicionado no Financeiro, Gestão de Clientes e Social Mídia.');
    setShowFechModal(null);
  }

  if(loading)return<div className="loading"><div className="spinner"/></div>;
  if(!post)return<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}><div style={{color:'#6B7280'}}>Post não encontrado</div></div>;
  return(<div style={{minHeight:'100vh',background:'#F8F9FB',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}><div style={{background:'#fff',borderRadius:16,padding:32,width:'100%',maxWidth:540,boxShadow:'0 4px 24px rgba(0,0,0,.08)'}}><div style={{textAlign:'center',marginBottom:24}}><div style={{fontSize:20,fontWeight:700}}>Attos <span style={{color:'#3B82F6'}}>Dashboard</span></div></div><div style={{fontWeight:700,fontSize:18,marginBottom:16}}>{post.titulo||'Post'}</div>{post.legenda&&<div style={{marginBottom:20}}><div style={{background:'#F8F9FB',borderRadius:8,padding:'12px 14px',fontSize:14,lineHeight:1.7,whiteSpace:'pre-wrap'}}>{post.legenda}</div></div>}{approved?<div style={{background:'#ECFDF5',border:'2px solid #10B981',borderRadius:12,padding:16,textAlign:'center'}}><div style={{fontSize:28,marginBottom:6}}>✅</div><div style={{fontWeight:700,fontSize:16,color:'#059669'}}>Conteúdo Aprovado!</div></div>:<button onClick={aprovar} disabled={saving} style={{width:'100%',background:'#3B82F6',color:'#fff',border:'none',borderRadius:10,padding:14,fontSize:15,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>{saving?'Aprovando...':'✅ Aprovar este conteúdo'}</button>}</div></div>);
}

function AuthScreen({onLogin}){
  const[email,setEmail]=useState('');const[password,setPassword]=useState('');const[loading,setLoading]=useState(false);const[error,setError]=useState('');
  async function handleLogin(e){e.preventDefault();setLoading(true);setError('');const{data,error:err}=await sb.auth.signInWithPassword({email,password});if(err){setError(err.message);setLoading(false);return;}const{data:prof}=await sb.from('profiles').select('*').eq('id',data.user.id).single();onLogin(data.user,prof);setLoading(false);}
  return(<div className="auth-wrap"><div className="auth-card"><div className="auth-logo">Attos <span>Dashboard</span></div><p className="auth-sub">Painel de prospecção ativa</p><form onSubmit={handleLogin}><label className="auth-label">E-mail</label><input className="auth-input" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="seu@email.com" required/><label className="auth-label">Senha</label><input className="auth-input" type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" required/>{error&&<p className="err">{error}</p>}<button className="auth-btn" type="submit" disabled={loading}>{loading?'Entrando...':'Entrar'}</button></form></div></div>);
}

function TopBar({profile,activeTab,pageLabels,mes,onMesChange}){
  const[time,setTime]=useState(new Date());
  useEffect(()=>{const t=setInterval(()=>setTime(new Date()),1000);return()=>clearInterval(t);},[]);
  const dias=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const now=time;
  const dateStr=`${dias[now.getDay()]}, ${now.getDate()} de ${meses[now.getMonth()]}`;
  const timeStr=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const showMonthNav=['dashboard','metas','crm','sdr-panel','closer-panel'].includes(activeTab);
  return(<div style={{background:'#fff',borderBottom:'1px solid #F0F0F0',padding:'0 28px',minHeight:60,display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,zIndex:50}}>
    <div className="page-title">{pageLabels[activeTab]||activeTab}</div>
    <div style={{display:'flex',alignItems:'center',gap:16}}>
      {showMonthNav&&<MonthNav mes={mes} onChange={onMesChange} showCurrent={true}/>}
      <div style={{textAlign:'right'}}><div style={{fontSize:15,fontWeight:700,color:'#111',letterSpacing:-.3}}>{timeStr}</div><div style={{fontSize:11,color:'#9CA3AF'}}>{dateStr}</div></div>
    </div>
  </div>);
}


const CHURN_MOTIVOS=['Financeiro','Não viu resultado','Mudou de agência','Inadimplência','Encerrou o negócio','Problema de relacionamento','Outro'];
const FIN_PRODUTOS=['Contabilidade','BPO Financeiro','Marketing','Comercial','Pacote Completo','Outro'];

function Financeiro({finClientes,leads,onRefresh,toast,mes,onMesChange}){
  const[viewMes,setViewMes]=useState(mes||currentMes());
  const[showAdd,setShowAdd]=useState(false);const[showChurn,setShowChurn]=useState(null);const[showEdit,setShowEdit]=useState(null);
  const[saving,setSaving]=useState(false);
  const[form,setForm]=useState({nome:'',produto:'',valor_mensal:'',data_inicio:'',observacoes:''});
  const[churnForm,setChurnForm]=useState({motivo_saida:'Financeiro',data_saida:'',observacoes:''});
  // Clientes que estavam ativos no mês selecionado:
  // entrada (data_inicio) <= fim do mês E (sem saída OU saída >= início do mês)
  function ativoNoMes(c, m){
    const di=c.data_inicio?.slice(0,7);
    const ds=c.data_saida?.slice(0,7);
    if(!di) return false;
    if(di>m) return false; // ainda não havia entrado
    if(ds && ds<m) return false; // já havia saído antes
    return true;
  }
  const ativos=finClientes.filter(c=>c.status==='ativo');
  const churned=finClientes.filter(c=>c.status==='churned');
  // Para o mês selecionado: ativos + churned que ainda estavam no mês
  const ativosNoMes=finClientes.filter(c=>ativoNoMes(c,viewMes));
  const mrrTotal=ativos.reduce((a,c)=>a+(c.valor_mensal||0),0); // MRR atual real
  const mrrMes=ativosNoMes.reduce((a,c)=>a+(c.valor_mensal||0),0);
  const churnMes=churned.filter(c=>c.data_saida?.slice(0,7)===viewMes);
  const novosMes=finClientes.filter(c=>c.data_inicio?.slice(0,7)===viewMes);
  const mrrProjecao=mrrMes-churnMes.reduce((a,c)=>a+(c.valor_mensal||0),0);
  const proximoMesLabel=mesLabel(nextMes(viewMes));
  async function saveCliente(e){e.preventDefault();setSaving(true);
    const payload={nome:form.nome,produto:form.produto,valor_mensal:parseFloat(form.valor_mensal)||0,data_inicio:form.data_inicio||null,observacoes:form.observacoes,status:'ativo'};
    const{error}=await sb.from('financeiro_clientes').insert(payload);
    if(error)toast('Erro: '+error.message);else{toast('✅ Cliente adicionado!');onRefresh();setShowAdd(false);setForm({nome:'',produto:'',valor_mensal:'',data_inicio:'',observacoes:''});}
    setSaving(false);}
  async function saveEdit(e){e.preventDefault();setSaving(true);
    const payload={nome:showEdit.nome,produto:showEdit.produto,valor_mensal:parseFloat(showEdit.valor_mensal)||0,data_inicio:showEdit.data_inicio||null,observacoes:showEdit.observacoes,updated_at:new Date().toISOString()};
    const{error}=await sb.from('financeiro_clientes').update(payload).eq('id',showEdit.id);
    if(error)toast('Erro: '+error.message);else{toast('✅ Atualizado!');onRefresh();setShowEdit(null);}
    setSaving(false);}
  async function saveChurn(e){e.preventDefault();setSaving(true);
    const{error}=await sb.from('financeiro_clientes').update({status:'churned',motivo_saida:churnForm.motivo_saida,data_saida:churnForm.data_saida||null,observacoes:churnForm.observacoes||showChurn.observacoes,updated_at:new Date().toISOString()}).eq('id',showChurn.id);
    if(error)toast('Erro: '+error.message);else{toast('Cliente marcado como churn');onRefresh();setShowChurn(null);}
    setSaving(false);}
  async function reativar(c){await sb.from('financeiro_clientes').update({status:'ativo',motivo_saida:null,data_saida:null,updated_at:new Date().toISOString()}).eq('id',c.id);toast('Reativado!');onRefresh();}
  async function deletar(id){if(!confirm('Remover permanentemente?'))return;await sb.from('financeiro_clientes').delete().eq('id',id);toast('Removido');onRefresh();}
  const prodColor={Contabilidade:'#3B82F6','BPO Financeiro':'#7C3AED',Marketing:'#10B981',Comercial:'#F59E0B','Pacote Completo':'#EF4444',Outro:'#6B7280'};
  return(<>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
      <div style={{fontSize:13,color:'var(--muted)',fontWeight:500}}>Painel financeiro da agência</div>
      <MonthNav mes={viewMes} onChange={setViewMes} showCurrent={true}/>
    </div>
    <div className="g4">
      <div style={{background:'linear-gradient(135deg,#065F46,#10B981)',borderRadius:12,padding:'20px 22px',boxShadow:'0 4px 14px #10B98140'}}>
        <div style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,.7)',textTransform:'uppercase',letterSpacing:.8,marginBottom:8}}>MRR Total</div>
        <div style={{fontSize:28,fontWeight:700,color:'#fff',letterSpacing:-1}}>{fmtR(mrrTotal)}</div>
        <div style={{fontSize:12,color:'rgba(255,255,255,.6)',marginTop:4}}>{ativos.length} clientes ativos</div>
      </div>
      <div style={{background:'linear-gradient(135deg,#1E3A5F,#3B82F6)',borderRadius:12,padding:'20px 22px',boxShadow:'0 4px 14px #3B82F640'}}>
        <div style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,.7)',textTransform:'uppercase',letterSpacing:.8,marginBottom:8}}>MRR em {mesLabel(viewMes)}</div>
        <div style={{fontSize:28,fontWeight:700,color:'#fff',letterSpacing:-1}}>{fmtR(mrrMes)}</div>
        <div style={{fontSize:12,color:'rgba(255,255,255,.6)',marginTop:4}}>clientes ativos no mês</div>
      </div>
      <div style={{background:'linear-gradient(135deg,#92400E,#F59E0B)',borderRadius:12,padding:'20px 22px',boxShadow:'0 4px 14px #F59E0B40'}}>
        <div style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,.7)',textTransform:'uppercase',letterSpacing:.8,marginBottom:8}}>Novos em {mesLabel(viewMes)}</div>
        <div style={{fontSize:28,fontWeight:700,color:'#fff',letterSpacing:-1}}>{novosMes.length}</div>
        <div style={{fontSize:12,color:'rgba(255,255,255,.6)',marginTop:4}}>{fmtR(novosMes.reduce((a,c)=>a+(c.valor_mensal||0),0))} em novos contratos</div>
      </div>
      <div style={{background:'linear-gradient(135deg,#7F1D1D,#EF4444)',borderRadius:12,padding:'20px 22px',boxShadow:'0 4px 14px #EF444440'}}>
        <div style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,.7)',textTransform:'uppercase',letterSpacing:.8,marginBottom:8}}>Churn em {mesLabel(viewMes)}</div>
        <div style={{fontSize:28,fontWeight:700,color:'#fff',letterSpacing:-1}}>{churnMes.length}</div>
        <div style={{fontSize:12,color:'rgba(255,255,255,.6)',marginTop:4}}>{fmtR(churnMes.reduce((a,c)=>a+(c.valor_mensal||0),0))} perdidos</div>
      </div>
    </div>
    <div className="mb" style={{background:'#F5F3FF',border:'2px dashed #7C3AED',borderRadius:12,padding:'18px 22px',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12,marginTop:14}}>
      <div>
        <div style={{fontSize:11,fontWeight:700,color:'#7C3AED',textTransform:'uppercase',letterSpacing:.8,marginBottom:6}}>🔮 Previsão — {proximoMesLabel}</div>
        <div style={{fontSize:11,color:'#8B5CF6'}}>MRR de {mesLabel(viewMes)} descontando os {churnMes.length} churn{churnMes.length===1?'':'s'} deste mês</div>
      </div>
      <div style={{fontSize:30,fontWeight:700,color:'#5B21B6',letterSpacing:-1}}>{fmtR(mrrProjecao)}</div>
    </div>
    <div className="sec-hdr">
      <h2>Clientes Ativos ({ativos.length})</h2>
      <button className="btn btn-primary btn-sm" onClick={()=>setShowAdd(true)}>+ Adicionar Cliente</button>
    </div>
    {ativosNoMes.length===0&&<div className="card mb"><div className="empty"><div className="empty-icon">💰</div>Nenhum cliente ativo em {mesLabel(viewMes)}</div></div>}
    {ativosNoMes.length>0&&<div className="card mb"><div className="tbl-wrap"><table>
      <thead><tr><th>Cliente</th><th>Produto</th><th>Início</th><th>Status</th><th>Valor/Mês</th><th></th></tr></thead>
      <tbody>{ativosNoMes.sort((a,b)=>(a.data_inicio||'').localeCompare(b.data_inicio||'')).map(c=><tr key={c.id}>
        <td><strong>{c.nome}</strong>{c.observacoes&&<div style={{fontSize:11.5,color:'#9CA3AF',marginTop:2}}>{c.observacoes}</div>}</td>
        <td><span style={{background:(prodColor[c.produto]||'#6B7280')+'20',color:prodColor[c.produto]||'#6B7280',borderRadius:99,padding:'2px 9px',fontSize:12,fontWeight:600}}>{c.produto||'—'}</span></td>
        <td style={{color:'#6B7280',fontSize:13}}>{fmtDate(c.data_inicio)}</td>
        <td>{c.status==='ativo'?<span className="tag tag-green">Ativo</span>:<span className="tag tag-red">Churn</span>}</td>
        <td style={{fontWeight:700,color:c.status==='ativo'?'#10B981':'#EF4444',fontSize:15}}>{fmtR(c.valor_mensal)}</td>
        <td><div style={{display:'flex',gap:4}}>
          <button className="btn btn-ghost btn-xs" onClick={()=>setShowEdit({...c})}>Editar</button>
          <button className="btn btn-danger btn-xs" onClick={()=>{setShowChurn(c);setChurnForm({motivo_saida:'Financeiro',data_saida:'',observacoes:''});}}>Churn</button>
        </div></td>
      </tr>)}</tbody>
    </table></div>
    <div style={{padding:'14px 0 0',borderTop:'1px solid #F0F0F0',display:'flex',justifyContent:'space-between',alignItems:'center'}}><div style={{fontSize:13,color:'#6B7280'}}>{mesLabel(viewMes)}: {ativosNoMes.length} clientes</div><div style={{fontSize:15,fontWeight:700}}>MRR {mesLabel(viewMes)}: <span style={{color:'#10B981'}}>{fmtR(mrrMes)}</span></div></div>
    </div>}
    <div className="sec-hdr" style={{marginTop:8}}><h2>Churn — Histórico ({churned.length})</h2></div>
    {churned.length===0&&<div className="card"><div className="empty"><div className="empty-icon">✅</div>Nenhum churn registrado</div></div>}
    {churned.length>0&&<div className="card"><div className="tbl-wrap"><table>
      <thead><tr><th>Cliente</th><th>Produto</th><th>Saída</th><th>Motivo</th><th>Valor Perdido</th><th></th></tr></thead>
      <tbody>{churned.sort((a,b)=>(b.data_saida||'').localeCompare(a.data_saida||'')).map(c=><tr key={c.id}>
        <td><strong>{c.nome}</strong></td>
        <td style={{fontSize:13,color:'#6B7280'}}>{c.produto||'—'}</td>
        <td style={{fontSize:13,color:'#6B7280'}}>{fmtDate(c.data_saida)}</td>
        <td><span className="tag tag-red">{c.motivo_saida||'—'}</span></td>
        <td style={{color:'#EF4444',fontWeight:600}}>{fmtR(c.valor_mensal)}</td>
        <td><div style={{display:'flex',gap:4}}>
          <button className="btn btn-success btn-xs" onClick={()=>reativar(c)}>Reativar</button>
          <button className="btn btn-danger btn-xs" onClick={()=>deletar(c.id)}>✕</button>
        </div></td>
      </tr>)}</tbody>
    </table></div></div>}
    {showAdd&&<div className="overlay" onClick={()=>setShowAdd(false)}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-title">Adicionar Cliente</div><form onSubmit={saveCliente}>
      <div className="fg"><label className="flabel">Nome *</label><input className="finput" required value={form.nome} onChange={e=>setForm(v=>({...v,nome:e.target.value}))}/></div>
      <div className="frow"><div className="fg"><label className="flabel">Produto</label><select className="fselect" value={form.produto} onChange={e=>setForm(v=>({...v,produto:e.target.value}))}><option value="">Selecionar...</option>{FIN_PRODUTOS.map(p=><option key={p}>{p}</option>)}</select></div><div className="fg"><label className="flabel">Valor Mensal (R$)</label><input className="finput" type="number" step="0.01" required value={form.valor_mensal} onChange={e=>setForm(v=>({...v,valor_mensal:e.target.value}))}/></div></div>
      <div className="fg"><label className="flabel">Data de Início</label><input className="finput" type="date" value={form.data_inicio} onChange={e=>setForm(v=>({...v,data_inicio:e.target.value}))}/></div>
      <div className="fg"><label className="flabel">Observações</label><textarea className="ftextarea" value={form.observacoes} onChange={e=>setForm(v=>({...v,observacoes:e.target.value}))}/></div>
      <div className="modal-footer"><button type="button" className="btn btn-ghost" onClick={()=>setShowAdd(false)}>Cancelar</button><button type="submit" className="btn btn-primary" disabled={saving}>{saving?'Salvando...':'Salvar'}</button></div>
    </form></div></div>}
    {showEdit&&<div className="overlay" onClick={()=>setShowEdit(null)}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-title">Editar Cliente</div><form onSubmit={saveEdit}>
      <div className="fg"><label className="flabel">Nome *</label><input className="finput" required value={showEdit.nome} onChange={e=>setShowEdit(v=>({...v,nome:e.target.value}))}/></div>
      <div className="frow"><div className="fg"><label className="flabel">Produto</label><select className="fselect" value={showEdit.produto||''} onChange={e=>setShowEdit(v=>({...v,produto:e.target.value}))}><option value="">Selecionar...</option>{FIN_PRODUTOS.map(p=><option key={p}>{p}</option>)}</select></div><div className="fg"><label className="flabel">Valor Mensal (R$)</label><input className="finput" type="number" step="0.01" value={showEdit.valor_mensal||''} onChange={e=>setShowEdit(v=>({...v,valor_mensal:e.target.value}))}/></div></div>
      <div className="fg"><label className="flabel">Data de Início</label><input className="finput" type="date" value={showEdit.data_inicio||''} onChange={e=>setShowEdit(v=>({...v,data_inicio:e.target.value}))}/></div>
      <div className="fg"><label className="flabel">Observações</label><textarea className="ftextarea" value={showEdit.observacoes||''} onChange={e=>setShowEdit(v=>({...v,observacoes:e.target.value}))}/></div>
      <div className="modal-footer"><button type="button" className="btn btn-ghost" onClick={()=>setShowEdit(null)}>Cancelar</button><button type="submit" className="btn btn-primary" disabled={saving}>{saving?'Salvando...':'Salvar'}</button></div>
    </form></div></div>}
    {showChurn&&<div className="overlay" onClick={()=>setShowChurn(null)}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-title">Registrar Churn — {showChurn.nome}</div><form onSubmit={saveChurn}>
      <div className="fg"><label className="flabel">Motivo</label><select className="fselect" value={churnForm.motivo_saida} onChange={e=>setChurnForm(v=>({...v,motivo_saida:e.target.value}))}>{CHURN_MOTIVOS.map(m=><option key={m}>{m}</option>)}</select></div>
      <div className="fg"><label className="flabel">Data de Saída</label><input className="finput" type="date" value={churnForm.data_saida} onChange={e=>setChurnForm(v=>({...v,data_saida:e.target.value}))}/></div>
      <div className="fg"><label className="flabel">Observações (confidencial)</label><textarea className="ftextarea" value={churnForm.observacoes} onChange={e=>setChurnForm(v=>({...v,observacoes:e.target.value}))} placeholder="Detalhes internos sobre a saída..."/></div>
      <div className="modal-footer"><button type="button" className="btn btn-ghost" onClick={()=>setShowChurn(null)}>Cancelar</button><button type="submit" className="btn btn-danger" disabled={saving}>{saving?'Salvando...':'Confirmar Churn'}</button></div>
    </form></div></div>}
  </>);
}


function ModalFechamento({lead,onConfirm,onClose}){
  const[form,setForm]=useState({nome:lead.name||'',produto:lead.product||'',valor:lead.est_value||'',data_inicio:today()});
  const[saving,setSaving]=useState(false);
  async function handleConfirm(e){e.preventDefault();setSaving(true);await onConfirm(lead,form);setSaving(false);}
  return(<div className="overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
    <div style={{textAlign:'center',marginBottom:20}}><div style={{fontSize:36,marginBottom:8}}>🎉</div><div className="modal-title" style={{marginBottom:4}}>Confirmar Fechamento</div><div style={{fontSize:13,color:'#6B7280'}}>Este cliente será adicionado ao Financeiro e à Gestão de Clientes automaticamente.</div></div>
    <form onSubmit={handleConfirm}>
      <div className="fg"><label className="flabel">Nome do Cliente *</label><input className="finput" required value={form.nome} onChange={e=>setForm(v=>({...v,nome:e.target.value}))}/></div>
      <div className="frow">
        <div className="fg"><label className="flabel">Produto *</label><select className="fselect" required value={form.produto} onChange={e=>setForm(v=>({...v,produto:e.target.value}))}><option value="">Selecionar...</option>{['Contabilidade','BPO Financeiro','Marketing','Comercial','Pacote Completo','Outro'].map(p=><option key={p}>{p}</option>)}</select></div>
        <div className="fg"><label className="flabel">Valor Mensal (R$) *</label><input className="finput" type="number" step="0.01" required value={form.valor} onChange={e=>setForm(v=>({...v,valor:e.target.value}))}/></div>
      </div>
      <div className="fg"><label className="flabel">Data de Início do Contrato</label><input className="finput" type="date" value={form.data_inicio} onChange={e=>setForm(v=>({...v,data_inicio:e.target.value}))}/></div>
      <div style={{background:'#ECFDF5',border:'1px solid #A7F3D0',borderRadius:10,padding:'12px 16px',marginBottom:16,fontSize:13,color:'#065F46'}}>
        ✅ Será criado automaticamente em:<br/>
        <strong>• Financeiro</strong> como cliente ativo<br/>
        <strong>• Gestão de Clientes</strong> em Onboarding<br/>
        <strong>• Social Mídia</strong> como novo cliente
      </div>
      <div className="modal-footer"><button type="button" className="btn btn-ghost" onClick={onClose}>Cancelar</button><button type="submit" className="btn btn-primary" disabled={saving||!form.produto||!form.valor}>{saving?'Salvando...':'🎉 Confirmar Fechamento'}</button></div>
    </form>
  </div></div>);
}

function App(){
  const[user,setUser]=useState(null);const[profile,setProfile]=useState(null);const[loading,setLoading]=useState(true);const[toastMsg,setToastMsg]=useState('');const[activeTab,setActiveTab]=useState('dashboard');
  const[mes,setMes]=useState(currentMes());
  const[sdrEntries,setSdrEntries]=useState([]);const[closerEntries,setCloserEntries]=useState([]);const[leads,setLeads]=useState([]);const[profiles,setProfiles]=useState([]);const[settings,setSettings]=useState({goals:{},weekly_meeting_goal:8});
  const[opClients,setOpClients]=useState([]);const[opEntries,setOpEntries]=useState([]);const[opTasks,setOpTasks]=useState([]);
  const[chatMessages,setChatMessages]=useState([]);
  const[gcClients,setGcClients]=useState([]);const[gcNps,setGcNps]=useState([]);
  const[openClient,setOpenClient]=useState(null);
  const[finClientes,setFinClientes]=useState([]);
  const[gcOnboarding,setGcOnboarding]=useState([]);const[gcEstrategia,setGcEstrategia]=useState([]);const[gcCalendario,setGcCalendario]=useState([]);const[gcMetricas,setGcMetricas]=useState([]);const[gcLogins,setGcLogins]=useState([]);
  const[gcConcorrentes,setGcConcorrentes]=useState([]);const[gcTrafego,setGcTrafego]=useState([]);const[gcTarefas,setGcTarefas]=useState([]);const[gcMetricasSemanal,setGcMetricasSemanal]=useState([]);
  const[showFechModal,setShowFechModal]=useState(null);
  function toast(msg){setToastMsg(msg);setTimeout(()=>setToastMsg(''),3000);}
  useEffect(()=>{sb.auth.getSession().then(async({data:{session}})=>{if(session){const{data:prof}=await sb.from('profiles').select('*').eq('id',session.user.id).single();setUser(session.user);setProfile(prof);}setLoading(false);});},[]);
  useEffect(()=>{if(!user)return;loadAll();
    const channels=[
      sb.channel('rt1').on('postgres_changes',{event:'*',schema:'public',table:'sdr_entries'},()=>loadSdr()).subscribe(),
      sb.channel('rt2').on('postgres_changes',{event:'*',schema:'public',table:'closer_entries'},()=>loadCloser()).subscribe(),
      sb.channel('rt3').on('postgres_changes',{event:'*',schema:'public',table:'leads'},()=>loadLeads()).subscribe(),
      sb.channel('rt4').on('postgres_changes',{event:'*',schema:'public',table:'settings'},()=>loadSettings()).subscribe(),
      sb.channel('rt5').on('postgres_changes',{event:'*',schema:'public',table:'profiles'},()=>loadProfiles()).subscribe(),
      sb.channel('rt6').on('postgres_changes',{event:'*',schema:'public',table:'op_clients'},()=>loadOp()).subscribe(),
      sb.channel('rt7').on('postgres_changes',{event:'*',schema:'public',table:'op_entries'},()=>loadOp()).subscribe(),
      sb.channel('rt8').on('postgres_changes',{event:'*',schema:'public',table:'chat_messages'},()=>loadChat()).subscribe(),
      sb.channel('rt9').on('postgres_changes',{event:'*',schema:'public',table:'gc_clients'},()=>loadGC()).subscribe(),
      sb.channel('rt10').on('postgres_changes',{event:'*',schema:'public',table:'financeiro_clientes'},()=>loadFin()).subscribe(),
      sb.channel('rt11').on('postgres_changes',{event:'*',schema:'public',table:'gc_concorrentes'},()=>loadGC()).subscribe(),
      sb.channel('rt12').on('postgres_changes',{event:'*',schema:'public',table:'gc_trafego'},()=>loadGC()).subscribe(),
      sb.channel('rt13').on('postgres_changes',{event:'*',schema:'public',table:'gc_tarefas'},()=>loadGC()).subscribe(),
      sb.channel('rt14').on('postgres_changes',{event:'*',schema:'public',table:'gc_metricas_semanal'},()=>loadGC()).subscribe(),
    ];
    return()=>channels.forEach(c=>sb.removeChannel(c));
  },[user]);
  async function loadChat(){const{data}=await sb.from('chat_messages').select('*').order('created_at',{ascending:true}).limit(300);if(data)setChatMessages(data);}
  async function loadGC(){const[c1,c2,c3,c4,c5,c6,c7,c8,c9,c10,c11]=await Promise.all([sb.from('gc_clients').select('*').order('created_at',{ascending:true}),sb.from('gc_nps').select('*').order('created_at',{ascending:true}),sb.from('gc_onboarding').select('*'),sb.from('gc_estrategia').select('*'),sb.from('gc_calendario').select('*').order('created_at',{ascending:true}),sb.from('gc_metricas').select('*').order('created_at',{ascending:true}),sb.from('gc_logins').select('*').order('created_at',{ascending:true}),sb.from('gc_concorrentes').select('*').order('data_analise',{ascending:false}),sb.from('gc_trafego').select('*').order('semana',{ascending:false}),sb.from('gc_tarefas').select('*').order('prazo',{ascending:true}),sb.from('gc_metricas_semanal').select('*').order('semana',{ascending:false})]);if(c1.data)setGcClients(c1.data);if(c2.data)setGcNps(c2.data);if(c3.data)setGcOnboarding(c3.data);if(c4.data)setGcEstrategia(c4.data);if(c5.data)setGcCalendario(c5.data);if(c6.data)setGcMetricas(c6.data);if(c7.data)setGcLogins(c7.data);if(c8.data)setGcConcorrentes(c8.data);if(c9.data)setGcTrafego(c9.data);if(c10.data)setGcTarefas(c10.data);if(c11.data)setGcMetricasSemanal(c11.data);}
  async function loadFin(){const{data}=await sb.from('financeiro_clientes').select('*').order('created_at',{ascending:false});if(data)setFinClientes(data);}
  async function loadAll(){await Promise.all([loadSdr(),loadCloser(),loadLeads(),loadProfiles(),loadSettings(),loadOp(),loadChat(),loadGC(),loadFin()])}
  async function loadSdr(){const{data}=await sb.from('sdr_entries').select('*');setSdrEntries(data||[]);}
  async function loadCloser(){const{data}=await sb.from('closer_entries').select('*');setCloserEntries(data||[]);}
  async function loadLeads(){const{data}=await sb.from('leads').select('*').order('created_at',{ascending:false});setLeads(data||[]);}
  async function loadProfiles(){const{data}=await sb.from('profiles').select('*');setProfiles(data||[]);}
  async function loadSettings(){const{data}=await sb.from('settings').select('*');if(!data)return;const s={};data.forEach(r=>{s[r.key]=r.value;});setSettings({goals:s.goals||{},weekly_meeting_goal:s.weekly_meeting_goal||8});}
  async function loadOp(){const[{data:c},{data:e}]=await Promise.all([sb.from('op_clients').select('*'),sb.from('op_entries').select('*').order('created_at',{ascending:true})]);setOpClients(c||[]);setOpEntries(e||[]);}

  async function fecharLead(lead, dados){
    const mes_atual = currentMes();
    // 1. Atualiza lead para fechado
    await sb.from('leads').update({stage:'fechado',mes_fechamento:mes_atual,updated_at:new Date().toISOString()}).eq('id',lead.id);
    // 2. Cria no financeiro
    await sb.from('financeiro_clientes').insert({nome:dados.nome,produto:dados.produto,valor_mensal:parseFloat(dados.valor)||0,data_inicio:dados.data_inicio||null,status:'ativo'});
    // 3. Cria na gestão de clientes
    await sb.from('gc_clients').insert({name:dados.nome,produto:dados.produto,orcamento:parseFloat(dados.valor)||0,status:'Onboarding',situacao:'Estável',created_by:user.id});
    // 4. Cria no social como cliente
    await sb.from('op_clients').insert({name:dados.nome,role_type:'social',owner_id:user.id,contents_per_month:16,observations:'Cliente via CRM'});
    await Promise.all([loadLeads(),loadFin(),loadGC(),loadOp()]);
    toast('🎉 Cliente fechado! Adicionado no Financeiro, Gestão de Clientes e Social Mídia.');
    setShowFechModal(null);
  }

  if(loading)return<div className="loading"><div className="spinner"/></div>;
  const _urlParams=new URLSearchParams(window.location.search);
  const _postId=_urlParams.get('post');
  if(_postId)return<ApprovalPage postId={_postId}/>;
  if(!user)return<AuthScreen onLogin={(u,p)=>{setUser(u);setProfile(p);}}/>;
  const role=profile?.role;
  const isGestor=role==='gestor';

  const navByRole={
    gestor:[{section:'Comercial'},{id:'dashboard',icon:'📊',label:'Dashboard'},{id:'metas',icon:'🎯',label:'Metas'},{id:'reunioes',icon:'📅',label:'Reuniões'},{id:'crm',icon:'🔥',label:'CRM'},{id:'sdr-panel',icon:'📞',label:'Painel SDR'},{id:'closer-panel',icon:'🤝',label:'Painel Closer'},{section:'Operacional'},{id:'op-overview',icon:'📋',label:'Visão Geral'},{id:'op-social',icon:'📱',label:'Social Mídia'},{id:'op-design',icon:'🎨',label:'Design'},{id:'op-video',icon:'🎬',label:'Editor de Vídeo'},{id:'op-trafego',icon:'📈',label:'Tráfego'},{section:'Clientes'},{id:'clientes',icon:'👥',label:'Gestão de Clientes'},{section:'Comunicação'},{id:'chat',icon:'💬',label:'Chat Interno'},{section:'Financeiro'},{id:'financeiro',icon:'💵',label:'Financeiro'},{section:'Gestão'},{id:'config',icon:'⚙️',label:'Configurações'}],
    sdr:[{section:'Meu Painel'},{id:'dashboard',icon:'📊',label:'Dashboard'},{id:'sdr-panel',icon:'✏️',label:'Lançamento'},{id:'crm',icon:'🔥',label:'Meus Leads'},{id:'reunioes',icon:'📅',label:'Reuniões'},{section:'Comunicação'},{id:'chat',icon:'💬',label:'Chat'}],
    closer:[{section:'Meu Painel'},{id:'dashboard',icon:'📊',label:'Dashboard'},{id:'closer-panel',icon:'✏️',label:'Lançamento'},{id:'reunioes',icon:'📅',label:'Reuniões'},{id:'crm',icon:'🔥',label:'Pipeline'},{section:'Comunicação'},{id:'chat',icon:'💬',label:'Chat'}],
    social:[{section:'Meu Painel'},{id:'op-social',icon:'📱',label:'Clientes'},{section:'Comunicação'},{id:'chat',icon:'💬',label:'Chat'}],
    design:[{section:'Meu Painel'},{id:'op-design',icon:'🎨',label:'Clientes'},{section:'Comunicação'},{id:'chat',icon:'💬',label:'Chat'}],
    video:[{section:'Meu Painel'},{id:'op-video',icon:'🎬',label:'Clientes'},{section:'Comunicação'},{id:'chat',icon:'💬',label:'Chat'}],
    trafego:[{section:'Meu Painel'},{id:'op-trafego',icon:'📈',label:'Clientes'},{section:'Comunicação'},{id:'chat',icon:'💬',label:'Chat'}],
  };
  const pageLabels={dashboard:'Dashboard',financeiro:'Financeiro',metas:'Metas',reunioes:'Reuniões da Semana',crm:'CRM','sdr-panel':'Painel SDR','closer-panel':'Painel Closer',config:'Configurações','op-overview':'Visão Geral Operacional','op-social':'Social Mídia','op-design':'Design','op-video':'Editor de Vídeo','op-trafego':'Tráfego',clientes:'Gestão de Clientes',chat:'Chat Interno'};
  const navItems=navByRole[role]||navByRole.sdr;
  const churnedNames=gcClients.filter(c=>c.status==='Churn').map(c=>c.name?.trim().toLowerCase());
  const activeOpClients=opClients.filter(c=>!churnedNames.includes(c.name?.trim().toLowerCase()));

  return(<div className="app">
    <Sidebar profile={profile} navItems={navItems} activeTab={activeTab} onTab={t=>{setActiveTab(t);if(t!=='clientes')setOpenClient(null);}}/>
    <div className="main">
      <TopBar profile={profile} activeTab={activeTab} pageLabels={pageLabels} mes={mes} onMesChange={setMes}/>
      <div className="content">
        {activeTab==='dashboard'&&<SharedDashboard sdrEntries={sdrEntries} closerEntries={closerEntries} leads={leads} profiles={profiles} settings={settings} mes={mes} onMesChange={setMes}/>}
        {activeTab==='metas'&&isGestor&&<GestorMetas closerEntries={closerEntries} settings={settings} mes={mes}/>}
        {activeTab==='reunioes'&&<ReunioesSemana leads={leads} profiles={profiles} currentUser={user} currentProfile={profile} toast={toast} onCloserEntryChange={loadCloser}/>}
        {activeTab==='crm'&&<CRMKanban leads={leads} profiles={profiles} currentUser={user} currentProfile={profile} onLeadsChange={loadLeads} toast={toast} mes={mes} onMesChange={setMes} onFechar={lead=>setShowFechModal(lead)}/>}
        {activeTab==='sdr-panel'&&<SDRPanel user={user} profile={profile} profiles={profiles} leads={leads} settings={settings} sdrEntries={sdrEntries} onEntryChange={loadSdr} toast={toast} mes={mes}/>}
        {activeTab==='closer-panel'&&<CloserPanel user={user} profile={profile} leads={leads} closerEntries={closerEntries} onEntryChange={loadCloser} toast={toast} mes={mes}/>}
        {activeTab==='config'&&isGestor&&<GestorConfig profiles={profiles} settings={settings} toast={toast} reload={loadProfiles}/>}
        {activeTab==='clientes'&&!openClient&&<GestaoClientes user={user} profile={profile} gcClients={gcClients} gcNps={gcNps} onRefresh={loadGC} toast={toast} onOpenClient={c=>setOpenClient(c)}/>}
        {activeTab==='clientes'&&openClient&&<ClienteFicha user={user} profile={profile} client={openClient} gcOnboarding={gcOnboarding} gcEstrategia={gcEstrategia} gcCalendario={gcCalendario} gcMetricas={gcMetricas} gcLogins={gcLogins} gcNps={gcNps} gcConcorrentes={gcConcorrentes} gcTrafego={gcTrafego} gcTarefas={gcTarefas} gcMetricasSemanal={gcMetricasSemanal} onRefresh={loadGC} toast={toast} onBack={()=>setOpenClient(null)}/>}
        {activeTab==='op-overview'&&<GestorOpOverview opClients={activeOpClients} opEntries={opEntries}/>}
        {activeTab==='op-social'&&<SocialPanel user={user} opClients={activeOpClients} opEntries={opEntries} onRefresh={loadOp} toast={toast} isGestor={isGestor}/>}
        {activeTab==='op-design'&&<DesignVideoPanel user={user} opClients={activeOpClients} opEntries={opEntries} onRefresh={loadOp} toast={toast} isGestor={isGestor} roleType="design" label="Design" icon="🎨" itemLabel="peças"/>}
        {activeTab==='op-video'&&<DesignVideoPanel user={user} opClients={activeOpClients} opEntries={opEntries} onRefresh={loadOp} toast={toast} isGestor={isGestor} roleType="video" label="Editor de Vídeo" icon="🎬" itemLabel="vídeos"/>}
        {activeTab==='op-trafego'&&<TrafegoPanel user={user} opClients={activeOpClients} opEntries={opEntries} onRefresh={loadOp} toast={toast} isGestor={isGestor}/>}
        {activeTab==='chat'&&<ChatInterno user={user} profile={profile} chatMessages={chatMessages} profiles={profiles} onRefresh={loadChat}/>}
        {activeTab==='financeiro'&&isGestor&&<Financeiro finClientes={finClientes} leads={leads} onRefresh={loadFin} toast={toast} mes={mes} onMesChange={setMes}/>}
      </div>
    </div>
    <Toast msg={toastMsg}/>
    {showFechModal&&<ModalFechamento lead={showFechModal} onConfirm={fecharLead} onClose={()=>setShowFechModal(null)}/>}
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
