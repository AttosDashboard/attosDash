// OPERACIONAL — GESTOR DE TRÁFEGO
// ══════════════════════════════════════════════════
function TrafegoPanel({user,profile,opClients,opEntries,onRefresh,toast,isGestor}){
  const myRole='trafego';
  const clients=opClients.filter(c=>c.role_type===myRole);
  const[showAddClient,setShowAddClient]=useState(false);
  const[openClient,setOpenClient]=useState(null);
  const[clientForm,setClientForm]=useState({name:'',meta_faturamento:0,observations:''});
  const[weekForm,setWeekForm]=useState({investimento:'',retorno:'',conversas:'',fechamentos:'',cpc:'',cpl:'',observations:''});
  const[saving,setSaving]=useState(false);

  function currentMonth(){return new Date().toISOString().slice(0,7);}

  function clientRevenue(clientId){
    return opEntries.filter(e=>e.client_id===clientId&&e.role_type===myRole&&e.month===currentMonth()).reduce((a,e)=>a+(e.retorno||0),0);
  }

  async function saveClient(e){
    e.preventDefault();setSaving(true);
    const{error}=await sb.from('op_clients').insert({...clientForm,role_type:myRole,owner_id:user.id,meta_faturamento:parseFloat(clientForm.meta_faturamento)||0});
    if(error)toast('Erro: '+error.message);else{toast('✅ Cliente adicionado!');onRefresh();setShowAddClient(false);setClientForm({name:'',meta_faturamento:0,observations:''});}
    setSaving(false);
  }

  async function saveWeekEntry(clientId){
    setSaving(true);
    const month=currentMonth();
    const weekNum=opEntries.filter(e=>e.client_id===clientId&&e.role_type===myRole&&e.month===month).length+1;
    const payload={client_id:clientId,role_type:myRole,month,week_number:weekNum,status:'done',user_id:user.id,investimento:parseFloat(weekForm.investimento)||0,retorno:parseFloat(weekForm.retorno)||0,conversas:parseInt(weekForm.conversas)||0,fechamentos:parseInt(weekForm.fechamentos)||0,cpc:parseFloat(weekForm.cpc)||0,cpl:parseFloat(weekForm.cpl)||0,observations:weekForm.observations};
    const{error}=await sb.from('op_entries').insert(payload);
    if(error)toast('Erro: '+error.message);else{toast('✅ Semana registrada!');onRefresh();setWeekForm({investimento:'',retorno:'',conversas:'',fechamentos:'',cpc:'',cpl:'',observations:''});}
    setSaving(false);
  }

  async function deleteClient(id){if(!confirm('Remover?'))return;await sb.from('op_clients').delete().eq('id',id);toast('Removido');onRefresh();}

  return(<>
    <div className="sec-hdr"><h2>Clientes — Gestor de Tráfego</h2><button className="btn btn-primary btn-sm" onClick={()=>setShowAddClient(true)}>+ Cliente</button></div>

    {clients.length===0&&<div className="card"><div className="empty"><div className="empty-icon">📈</div>Nenhum cliente cadastrado</div></div>}

    {clients.map(c=>{
      const month=currentMonth();
      const entries=opEntries.filter(e=>e.client_id===c.id&&e.role_type===myRole&&e.month===month);
      const totalRev=entries.reduce((a,e)=>a+(e.retorno||0),0);
      const totalInv=entries.reduce((a,e)=>a+(e.investimento||0),0);
      const totalConv=entries.reduce((a,e)=>a+(e.conversas||0),0);
      const totalFech=entries.reduce((a,e)=>a+(e.fechamentos||0),0);
      const meta=c.meta_faturamento||0;
      const metaPct=pct(totalRev,meta);
      const roas=totalInv>0?(totalRev/totalInv).toFixed(2):0;
      const isOpen=openClient===c.id;
      return(<div key={c.id} className="trafego-client-card">
        <div className="trafego-client-header" onClick={()=>setOpenClient(isOpen?null:c.id)}>
          <div>
            <div style={{fontWeight:700,fontSize:15}}>{c.name}</div>
            <div style={{fontSize:12.5,color:'#6B7280',marginTop:2}}>Meta: {fmtR(meta)} · ROAS atual: {roas}x</div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span className="tag" style={{background:metaPct>=100?'#ECFDF5':'var(--blue-pale)',color:metaPct>=100?'#059669':'var(--blue)'}}>{metaPct}%</span>
            {isGestor&&<button className="btn btn-danger btn-xs" onClick={e=>{e.stopPropagation();deleteClient(c.id);}}>✕</button>}
            <span style={{color:'#9CA3AF',fontSize:18}}>{isOpen?'▲':'▼'}</span>
          </div>
        </div>

        {isOpen&&<div style={{padding:'0 20px 20px'}}>
          {/* Meta bar */}
          {meta>0&&<div style={{marginBottom:16}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:5}}><span style={{fontWeight:600}}>Meta de faturamento</span><span style={{color:'#3B82F6',fontWeight:600}}>{fmtR(totalRev)} / {fmtR(meta)}</span></div>
            <div className="prog-wrap"><div className="prog-fill" style={{width:metaPct+'%',background:metaPct>=100?'#10B981':'#3B82F6'}}/></div>
          </div>}

          {/* KPIs do mês */}
          <div className="g4" style={{marginBottom:16}}>
            <div style={{background:'#F8F9FB',borderRadius:8,padding:'12px 14px'}}><div style={{fontSize:11,color:'#9CA3AF',marginBottom:4,fontWeight:600}}>INVESTIMENTO</div><div style={{fontSize:18,fontWeight:700}}>{fmtR(totalInv)}</div></div>
            <div style={{background:'#F8F9FB',borderRadius:8,padding:'12px 14px'}}><div style={{fontSize:11,color:'#9CA3AF',marginBottom:4,fontWeight:600}}>RETORNO</div><div style={{fontSize:18,fontWeight:700,color:'#10B981'}}>{fmtR(totalRev)}</div></div>
            <div style={{background:'#F8F9FB',borderRadius:8,padding:'12px 14px'}}><div style={{fontSize:11,color:'#9CA3AF',marginBottom:4,fontWeight:600}}>CONVERSAS</div><div style={{fontSize:18,fontWeight:700}}>{totalConv}</div></div>
            <div style={{background:'#F8F9FB',borderRadius:8,padding:'12px 14px'}}><div style={{fontSize:11,color:'#9CA3AF',marginBottom:4,fontWeight:600}}>FECHAMENTOS</div><div style={{fontSize:18,fontWeight:700,color:'#3B82F6'}}>{totalFech}</div></div>
          </div>

          {/* Histórico semanal */}
          {entries.length>0&&<div style={{marginBottom:16}}>
            <div style={{fontWeight:600,fontSize:13.5,marginBottom:8}}>Histórico Semanal</div>
            <div className="tbl-wrap"><table><thead><tr><th>Semana</th><th>Invest.</th><th>Retorno</th><th>Conversas</th><th>Fechamentos</th><th>CPC</th><th>CPL</th></tr></thead>
            <tbody>{entries.map(e=><tr key={e.id}><td>S{e.week_number}</td><td>{fmtR(e.investimento)}</td><td style={{color:'#10B981',fontWeight:600}}>{fmtR(e.retorno)}</td><td>{e.conversas}</td><td>{e.fechamentos}</td><td>{e.cpc?fmtR(e.cpc):'—'}</td><td>{e.cpl?fmtR(e.cpl):'—'}</td></tr>)}</tbody>
            </table></div>
          </div>}

          {/* Novo lançamento semanal */}
          <div style={{background:'#F0F9FF',border:'1px solid #BAE6FD',borderRadius:10,padding:16}}>
            <div style={{fontWeight:600,fontSize:13.5,marginBottom:12,color:'#0369A1'}}>+ Lançamento da Semana {entries.length+1}</div>
            <div className="frow"><div className="fg"><label className="flabel">Investimento (R$)</label><input className="finput" type="number" step="0.01" value={weekForm.investimento} onChange={e=>setWeekForm(v=>({...v,investimento:e.target.value}))} placeholder="0,00"/></div><div className="fg"><label className="flabel">Retorno / Faturamento (R$)</label><input className="finput" type="number" step="0.01" value={weekForm.retorno} onChange={e=>setWeekForm(v=>({...v,retorno:e.target.value}))} placeholder="0,00"/></div></div>
            <div className="frow"><div className="fg"><label className="flabel">Conversas geradas</label><input className="finput" type="number" min={0} value={weekForm.conversas} onChange={e=>setWeekForm(v=>({...v,conversas:e.target.value}))} placeholder="0"/></div><div className="fg"><label className="flabel">Fechamentos</label><input className="finput" type="number" min={0} value={weekForm.fechamentos} onChange={e=>setWeekForm(v=>({...v,fechamentos:e.target.value}))} placeholder="0"/></div></div>
            <div className="frow"><div className="fg"><label className="flabel">CPC (R$)</label><input className="finput" type="number" step="0.01" value={weekForm.cpc} onChange={e=>setWeekForm(v=>({...v,cpc:e.target.value}))} placeholder="0,00"/></div><div className="fg"><label className="flabel">CPL (R$)</label><input className="finput" type="number" step="0.01" value={weekForm.cpl} onChange={e=>setWeekForm(v=>({...v,cpl:e.target.value}))} placeholder="0,00"/></div></div>
            <div className="fg"><label className="flabel">Observações</label><textarea className="ftextarea" style={{minHeight:56}} value={weekForm.observations} onChange={e=>setWeekForm(v=>({...v,observations:e.target.value}))} placeholder="Detalhes da semana..."/></div>
            <button className="btn btn-primary btn-sm" onClick={()=>saveWeekEntry(c.id)} disabled={saving}>{saving?'Salvando...':'✓ Salvar Semana'}</button>
          </div>
        </div>}
      </div>);
    })}

    {showAddClient&&<div className="overlay" onClick={()=>setShowAddClient(false)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="modal-title">Novo Cliente — Tráfego</div>
      <form onSubmit={saveClient}>
        <div className="fg"><label className="flabel">Nome do Cliente *</label><input className="finput" required value={clientForm.name} onChange={e=>setClientForm(v=>({...v,name:e.target.value}))} placeholder="Ex: GG Balloon"/></div>
        <div className="fg"><label className="flabel">Meta de Faturamento Mensal (R$)</label><input className="finput" type="number" step="0.01" value={clientForm.meta_faturamento} onChange={e=>setClientForm(v=>({...v,meta_faturamento:e.target.value}))} placeholder="Ex: 20000"/></div>
        <div className="fg"><label className="flabel">Observações</label><textarea className="ftextarea" value={clientForm.observations} onChange={e=>setClientForm(v=>({...v,observations:e.target.value}))} placeholder="Notas..."/></div>
        <div className="modal-footer"><button type="button" className="btn btn-ghost" onClick={()=>setShowAddClient(false)}>Cancelar</button><button type="submit" className="btn btn-primary" disabled={saving}>{saving?'Salvando...':'Salvar'}</button></div>
      </form>
    </div></div>}
  </>);
}

// GESTOR CONFIG
function GestorConfig({profiles,settings,toast,reload}){
  const[goals,setGoals]=useState({});const[wg,setWg]=useState('8');const[showAdd,setShowAdd]=useState(false);const[newUser,setNewUser]=useState({name:'',email:'',password:'',role:'sdr'});const[saving,setSaving]=useState(false);
  useEffect(()=>{const g={};PRODUCTS.forEach(p=>{g[p.key]=settings.goals[p.key]||{type:'value',target:''};});setGoals(g);setWg(String(settings.weekly_meeting_goal||8));},[settings]);
  async function saveGoal(k){const ng={...settings.goals,[k]:{type:goals[k]?.type,target:parseFloat(goals[k]?.target)||0}};await sb.from('settings').upsert({key:'goals',value:ng,updated_at:new Date().toISOString()});toast('Meta salva!');}
  async function saveWeekly(){await sb.from('settings').upsert({key:'weekly_meeting_goal',value:parseInt(wg)||8,updated_at:new Date().toISOString()});toast('Meta semanal salva!');}
  async function handleAdd(e){e.preventDefault();setSaving(true);const{data,error}=await sb.auth.signUp({email:newUser.email,password:newUser.password,options:{data:{name:newUser.name,role:newUser.role}}});if(error){toast('Erro: '+error.message);setSaving(false);return;}if(data.user)await sb.from('profiles').upsert({id:data.user.id,name:newUser.name,email:newUser.email,role:newUser.role});toast('Usuário criado!');setShowAdd(false);setNewUser({name:'',email:'',password:'',role:'sdr'});setSaving(false);reload();}
  async function handleDel(id){if(!confirm('Remover?'))return;await sb.from('profiles').delete().eq('id',id);toast('Removido');reload();}
  return(<>
    <div className="card mb"><div className="sec-hdr"><h2>🎯 Metas Mensais</h2></div>
      {PRODUCTS.map(p=><div key={p.key} style={{display:'grid',gridTemplateColumns:'1fr 160px 150px auto',gap:10,alignItems:'center',marginBottom:12,paddingBottom:12,borderBottom:'1px solid #F0F0F0'}}><div style={{fontWeight:600}}>{p.icon} {p.label}</div><select className="fselect" value={goals[p.key]?.type||'value'} onChange={e=>setGoals(g=>({...g,[p.key]:{...g[p.key],type:e.target.value}}))}><option value="value">Por valor (R$)</option><option value="count">Por fechamentos</option></select><input className="finput" type="number" placeholder="Meta" value={goals[p.key]?.target||''} onChange={e=>setGoals(g=>({...g,[p.key]:{...g[p.key],target:e.target.value}}))}/><button className="btn btn-primary btn-sm" onClick={()=>saveGoal(p.key)}>Salvar</button></div>)}
    </div>
    <div className="card mb"><div className="sec-hdr"><h2>📅 Meta Semanal de Reuniões</h2></div><div style={{display:'flex',gap:10,alignItems:'center'}}><input className="finput" type="number" value={wg} onChange={e=>setWg(e.target.value)} style={{maxWidth:120}}/><button className="btn btn-primary" onClick={saveWeekly}>Salvar</button></div></div>
    <div className="card"><div className="sec-hdr"><h2>👥 Usuários</h2><button className="btn btn-primary btn-sm" onClick={()=>setShowAdd(true)}>+ Adicionar</button></div>
      <div className="tbl-wrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th></th></tr></thead><tbody>{profiles.map(p=><tr key={p.id}><td><strong>{p.name}</strong></td><td style={{color:'#6B7280'}}>{p.email}</td><td><span className={`tag ${p.role==='gestor'?'tag-yellow':p.role==='sdr'?'tag-blue':p.role==='closer'?'tag-green':p.role==='social'?'tag-purple':'tag-gray'}`}>{ROLE_LABELS[p.role]||p.role}</span></td><td><button className="btn btn-danger btn-xs" onClick={()=>handleDel(p.id)}>Remover</button></td></tr>)}</tbody></table></div>
    </div>
    {showAdd&&<div className="overlay" onClick={()=>setShowAdd(false)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="modal-title">Novo Usuário</div>
      <form onSubmit={handleAdd}>
        <div className="fg"><label className="flabel">Nome</label><input className="finput" required value={newUser.name} onChange={e=>setNewUser(u=>({...u,name:e.target.value}))}/></div>
        <div className="fg"><label className="flabel">E-mail</label><input className="finput" type="email" required value={newUser.email} onChange={e=>setNewUser(u=>({...u,email:e.target.value}))}/></div>
        <div className="fg"><label className="flabel">Senha</label><input className="finput" type="password" required minLength={6} value={newUser.password} onChange={e=>setNewUser(u=>({...u,password:e.target.value}))}/></div>
        <div className="fg"><label className="flabel">Perfil</label><select className="fselect" value={newUser.role} onChange={e=>setNewUser(u=>({...u,role:e.target.value}))}>{ALL_ROLES.map(r=><option key={r} value={r}>{ROLE_LABELS[r]}</option>)}</select></div>
        <div className="modal-footer"><button type="button" className="btn btn-ghost" onClick={()=>setShowAdd(false)}>Cancelar</button><button type="submit" className="btn btn-primary" disabled={saving}>{saving?'Criando...':'Criar'}</button></div>
      </form>
    </div></div>}
  </>);
}

// GESTOR METAS
function GestorMetas({closerEntries,settings,dateRange}){
  const ce=closerEntries.filter(e=>e.date>=dateRange[0]&&e.date<=dateRange[1]);
  const pp=PRODUCTS.map(p=>{const goal=settings.goals[p.key]||{type:'value',target:0};const achieved=goal.type==='value'?ce.reduce((a,e)=>a+((e[`closings_${p.key}`]||0)*(e[`ticket_${p.key}`]||0)),0):ce.reduce((a,e)=>a+(e[`closings_${p.key}`]||0),0);return{...p,goal,achieved,pct:pct(achieved,goal.target)};});
  return(<div className="card mb"><div className="card-title">Metas por Produto</div>{pp.map(p=><div key={p.key} style={{marginBottom:16}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}><div style={{fontWeight:600}}>{p.icon} {p.label}</div><div style={{fontSize:12.5,color:'#6B7280'}}><span style={{fontWeight:600}}>{p.goal.type==='value'?fmtR(p.achieved):p.achieved}</span><span> / {p.goal.type==='value'?fmtR(p.goal.target):p.goal.target+' fechamentos'}</span><span className="tag tag-blue" style={{marginLeft:8}}>{p.pct}%</span></div></div><div className="prog-wrap"><div className="prog-fill" style={{width:p.pct+'%',background:p.pct>=100?'#10B981':'#3B82F6'}}/></div></div>)}</div>);

// GESTOR OPERACIONAL OVERVIEW
function GestorOpOverview({opClients,opEntries}){
  function currentMonth(){return new Date().toISOString().slice(0,7);}
  const roles=[{key:'social',label:'Social Mídia',icon:'📱',metaKey:'contents_per_month'},{key:'design',label:'Design',icon:'🎨',metaKey:'items_per_month'},{key:'video',label:'Editor de Vídeo',icon:'🎬',metaKey:'items_per_month'},{key:'trafego',label:'Tráfego',icon:'📈',metaKey:null}];
  return(<>
    <div style={{marginBottom:20}}><h2 style={{fontSize:16,fontWeight:700,marginBottom:4}}>Visão Geral Operacional</h2><p style={{fontSize:13,color:'#9CA3AF'}}>Progresso do time este mês</p></div>
    {roles.map(r=>{
      const clients=opClients.filter(c=>c.role_type===r.key);
      if(r.key==='trafego'){
        const totalInv=opEntries.filter(e=>e.role_type==='trafego'&&e.month===currentMonth()).reduce((a,e)=>a+(e.investimento||0),0);
        const totalRet=opEntries.filter(e=>e.role_type==='trafego'&&e.month===currentMonth()).reduce((a,e)=>a+(e.retorno||0),0);
        return(<div key={r.key} className="card mb"><div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}><span style={{fontSize:20}}>{r.icon}</span><h2 style={{fontSize:14,fontWeight:700}}>{r.label}</h2><span className="tag tag-blue">{clients.length} clientes</span></div><div className="g3"><div style={{background:'#F8F9FB',borderRadius:8,padding:'12px 14px',textAlign:'center'}}><div style={{fontSize:11,color:'#9CA3AF',marginBottom:4}}>INVESTIMENTO</div><div style={{fontSize:20,fontWeight:700}}>{fmtR(totalInv)}</div></div><div style={{background:'#F8F9FB',borderRadius:8,padding:'12px 14px',textAlign:'center'}}><div style={{fontSize:11,color:'#9CA3AF',marginBottom:4}}>RETORNO</div><div style={{fontSize:20,fontWeight:700,color:'#10B981'}}>{fmtR(totalRet)}</div></div><div style={{background:'#F8F9FB',borderRadius:8,padding:'12px 14px',textAlign:'center'}}><div style={{fontSize:11,color:'#9CA3AF',marginBottom:4}}>ROAS</div><div style={{fontSize:20,fontWeight:700,color:'#3B82F6'}}>{totalInv>0?(totalRet/totalInv).toFixed(2)+'x':'—'}</div></div></div></div>);
      }
      const totalMeta=clients.reduce((a,c)=>a+(c[r.metaKey]||4),0);
      const totalDone=clients.reduce((a,c)=>{const entries=opEntries.filter(e=>e.client_id===c.id&&e.role_type===r.key&&e.month===currentMonth()&&e.status==='done');return a+entries.length;},0);
      const p=pct(totalDone,totalMeta);
      return(<div key={r.key} className="card mb"><div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}><div style={{display:'flex',alignItems:'center',gap:10}}><span style={{fontSize:20}}>{r.icon}</span><h2 style={{fontSize:14,fontWeight:700}}>{r.label}</h2><span className="tag tag-blue">{clients.length} clientes</span></div><span className="tag" style={{background:p>=100?'#ECFDF5':'var(--blue-pale)',color:p>=100?'#059669':'var(--blue)',fontSize:13}}>{p}%</span></div><div className="prog-wrap" style={{height:10}}><div className="prog-fill" style={{width:p+'%',background:p>=100?'#10B981':'#3B82F6'}}/></div><div className="prog-labels"><span style={{fontSize:12,color:'#9CA3AF'}}>{totalDone} de {totalMeta} entregas</span></div></div>);
    })}
  </>);
}

function TopBar({profile, activeTab, pageLabels, period, setPeriod}){
  const[time,setTime]=useState(new Date());
  const[frase,setFrase]=useState('');
  useEffect(()=>{
    const role=profile?.role||'gestor';
    const arr=FRASES[role]||FRASES.gestor;
    const dayIdx=new Date().getDate()%arr.length;
    setFrase(arr[dayIdx]);
    const t=setInterval(()=>setTime(new Date()),1000);
    return()=>clearInterval(t);
  },[profile]);
  const dias=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const now=time;
  const dateStr=`${dias[now.getDay()]}, ${now.getDate()} de ${meses[now.getMonth()]}`;
  const timeStr=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  return(
    <div style={{background:'#fff',borderBottom:'1px solid #F0F0F0',padding:'0 28px',minHeight:60,display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,zIndex:50}}>

      </div>
      <div style={{display:'flex',alignItems:'center',gap:14}}>

// ── OP KANBAN (tarefas diárias) ───────────────────────────────────────────────
const OP_TASK_COLS=[{id:'todo',label:'A Fazer',icon:'📋',color:'#F59E0B'},{id:'doing',label:'Fazendo',icon:'⚡',color:'#3B82F6'},{id:'done',label:'Concluído',icon:'✅',color:'#10B981'}];

function OpTaskKanban({user,opTasks,onRefresh,toast,roleType,readOnly}){
  const[showAdd,setShowAdd]=useState(false);
  const[taskForm,setTaskForm]=useState({title:'',description:'',priority:'normal'});
  const[saving,setSaving]=useState(false);
  const[dragId,setDragId]=useState(null);
  const[dragOver,setDragOver]=useState(null);

  const today_=today();
  const myTasks=opTasks.filter(t=>t.user_id===user.id&&t.task_date===today_);
  const allTasks=readOnly?opTasks.filter(t=>t.task_date===today_):myTasks;

  function onDragStart(e,id){setDragId(id);e.dataTransfer.effectAllowed='move';}
  function onDragOver(e,col){e.preventDefault();setDragOver(col);}
  function onDragLeave(){setDragOver(null);}
  async function onDrop(e,col){e.preventDefault();setDragOver(null);if(!dragId)return;await sb.from('op_tasks').update({status:col,updated_at:new Date().toISOString()}).eq('id',dragId);setDragId(null);onRefresh();}

  async function saveTask(e){
    e.preventDefault();setSaving(true);
    const{error}=await sb.from('op_tasks').insert({user_id:user.id,role_type:roleType,title:taskForm.title,description:taskForm.description,priority:taskForm.priority,status:'todo',task_date:today_});
    if(error)toast('Erro: '+error.message);else{toast('✅ Tarefa adicionada!');setTaskForm({title:'',description:'',priority:'normal'});setShowAdd(false);onRefresh();}
    setSaving(false);
  }
  async function deleteTask(id){await sb.from('op_tasks').delete().eq('id',id);onRefresh();}

  const priorityColor={urgent:'#EF4444',high:'#F59E0B',normal:'#3B82F6',low:'#9CA3AF'};
  const priorityLabel={urgent:'🔴 Urgente',high:'🟡 Alta',normal:'🔵 Normal',low:'⚪ Baixa'};

  return(<>
    <div className="sec-hdr">
      <h2>Tarefas do Dia — {new Date().toLocaleDateString('pt-BR')}</h2>
      {!readOnly&&<button className="btn btn-primary btn-sm" onClick={()=>setShowAdd(true)}>+ Tarefa</button>}
    </div>
    <div className="kanban-board" style={{minHeight:320}}>
      {OP_TASK_COLS.map(col=>{
        const colTasks=allTasks.filter(t=>t.status===col.id);
        const isOver=dragOver===col.id;
        return(
          <div key={col.id} style={{background:isOver?`${col.color}10`:'#F8F9FB',border:`1px solid ${isOver?col.color:'#F0F0F0'}`,borderTop:`3px solid ${col.color}`,borderRadius:12,minWidth:210,width:210,flexShrink:0,display:'flex',flexDirection:'column',transition:'all .2s'}}
            onDragOver={e=>onDragOver(e,col.id)} onDragLeave={onDragLeave} onDrop={e=>onDrop(e,col.id)}>
            <div style={{padding:'12px 14px 10px',borderBottom:'1px solid #F0F0F0',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div style={{fontSize:12.5,fontWeight:700,display:'flex',alignItems:'center',gap:7}}><span>{col.icon}</span><span>{col.label}</span></div>
              <span style={{background:'#F0F0F0',color:'#6B7280',borderRadius:99,fontSize:11,fontWeight:700,padding:'1px 7px'}}>{colTasks.length}</span>
            </div>
            <div style={{flex:1,padding:10,display:'flex',flexDirection:'column',gap:8,overflowY:'auto'}}>
              {colTasks.length===0&&<div style={{fontSize:12,color:isOver?col.color:'#9CA3AF',textAlign:'center',padding:'20px 0',transition:'color .2s'}}>{isOver?'Soltar aqui':'Vazio'}</div>}
              {colTasks.map(task=>(
                <div key={task.id} draggable={!readOnly} onDragStart={e=>onDragStart(e,task.id)} style={{background:'#fff',border:'1px solid #F0F0F0',borderLeft:`3px solid ${priorityColor[task.priority]||'#3B82F6'}`,borderRadius:9,padding:12,cursor:readOnly?'default':'grab',opacity:dragId===task.id?.5:1,boxShadow:'0 1px 3px rgba(0,0,0,.04)'}}>
                  {!readOnly&&<div style={{fontSize:10,color:'#CBD5E1',marginBottom:3}}>⠿ ARRASTAR</div>}
                  {readOnly&&<div style={{fontSize:11,color:'#9CA3AF',marginBottom:3}}>{task.role_type?.toUpperCase()}</div>}
                  <div style={{fontSize:13.5,fontWeight:600,marginBottom:3}}>{task.title}</div>
                  {task.description&&<div style={{fontSize:12,color:'#6B7280',marginBottom:5}}>{task.description}</div>}
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                    <span style={{fontSize:11,fontWeight:600,color:priorityColor[task.priority]||'#3B82F6'}}>{priorityLabel[task.priority]||'Normal'}</span>
                    {!readOnly&&<button onClick={()=>deleteTask(task.id)} style={{background:'none',border:'none',cursor:'pointer',fontSize:14,color:'#9CA3AF',padding:0}}>✕</button>}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      })}
    </div>

    {showAdd&&<div className="overlay" onClick={()=>setShowAdd(false)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="modal-title">Nova Tarefa</div>
      <form onSubmit={saveTask}>
        <div className="fg"><label className="flabel">Título *</label><input className="finput" required value={taskForm.title} onChange={e=>setTaskForm(v=>({...v,title:e.target.value}))} placeholder="Ex: Criar post para GG Balloon"/></div>
        <div className="fg"><label className="flabel">Descrição</label><textarea className="ftextarea" value={taskForm.description} onChange={e=>setTaskForm(v=>({...v,description:e.target.value}))} placeholder="Detalhes da tarefa..." style={{minHeight:60}}/></div>
        <div className="fg"><label className="flabel">Prioridade</label>
          <select className="fselect" value={taskForm.priority} onChange={e=>setTaskForm(v=>({...v,priority:e.target.value}))}>
            <option value="urgent">🔴 Urgente</option><option value="high">🟡 Alta</option><option value="normal">🔵 Normal</option><option value="low">⚪ Baixa</option>
          </select>
        </div>
        <div className="modal-footer"><button type="button" className="btn btn-ghost" onClick={()=>setShowAdd(false)}>Cancelar</button><button type="submit" className="btn btn-primary" disabled={saving}>{saving?'Salvando...':'Adicionar'}</button></div>
      </form>
    </div></div>}
  </>);
}

// ── SOCIAL DASHBOARD (sem dados comerciais) ───────────────────────────────────
function SocialDashboard({user,profile,opClients,opEntries,opTasks,onRefresh,toast}){
  function currentMonth(){return new Date().toISOString().slice(0,7);}
  const roles=[
    {key:'social',label:'Social Mídia',icon:'📱',metaKey:'contents_per_month',unit:'conteúdos',weekBased:true},
    {key:'design',label:'Design',icon:'🎨',metaKey:'items_per_month',unit:'peças',weekBased:false},
    {key:'video',label:'Editor de Vídeo',icon:'🎬',metaKey:'items_per_month',unit:'vídeos',weekBased:false},
    {key:'trafego',label:'Tráfego',icon:'📈',metaKey:null,unit:'',weekBased:false},
  ];

  // Progresso por role
  function roleProgress(roleKey,metaKey,weekBased){
    const clients=opClients.filter(c=>c.role_type===roleKey);
    if(!metaKey) return null;
    const totalMeta=weekBased?clients.length*4:clients.reduce((a,c)=>a+(c[metaKey]||4),0);
    const totalDone=clients.reduce((a,c)=>{
      const entries=opEntries.filter(e=>e.client_id===c.id&&e.role_type===roleKey&&e.month===currentMonth()&&e.status==='done');
      return a+entries.length;
    },0);
    return{totalDone,totalMeta,pct:pct(totalDone,totalMeta),clients:clients.length};
  }

  // Tarefas de hoje de cada role
  const today_=today();
  const tasksByRole=(roleKey)=>opTasks.filter(t=>t.role_type===roleKey&&t.task_date===today_);

  const roleColors={social:'#7C3AED',design:'#3B82F6',video:'#EF4444',trafego:'#10B981'};

  return(<>
    <FraseDia profile={profile}/>

    {/* Progresso geral de todos os times */}
    <div style={{marginBottom:8}}><h2 style={{fontSize:15,fontWeight:700}}>Visão Geral dos Times</h2></div>
    <div className="g4 mb">
      {roles.map(r=>{
        const prog=r.metaKey?roleProgress(r.key,r.metaKey,r.weekBased):null;
        const tasks=tasksByRole(r.key);
        const doneTasks=tasks.filter(t=>t.status==='done').length;
        if(!prog) return(
          <div key={r.key} className="card">
            <div className="card-title">{r.icon} {r.label}</div>
            <div style={{fontSize:13,color:'#6B7280'}}>Tarefas hoje: <strong>{doneTasks}/{tasks.length}</strong></div>
            <div style={{marginTop:8}}><div className="prog-wrap"><div className="prog-fill" style={{width:pct(doneTasks,tasks.length)+'%',background:roleColors[r.key]}}/></div></div>
          </div>
        );
        return(
          <div key={r.key} className="card">
            <div className="card-title">{r.icon} {r.label}</div>
            <div className="metric-big" style={{fontSize:26,color:roleColors[r.key]}}>{prog.pct}%</div>
            <div style={{fontSize:12,color:'#9CA3AF',marginTop:2}}>{prog.totalDone}/{prog.totalMeta} {r.unit}</div>
            <div className="prog-wrap"><div className="prog-fill" style={{width:prog.pct+'%',background:roleColors[r.key]}}/></div>
          </div>
        );
      })}
    </div>

    {/* Tarefas dos outros times hoje */}
    {['design','video','trafego'].map(roleKey=>{
      const rInfo=roles.find(r=>r.key===roleKey);
      const tasks=tasksByRole(roleKey);
      if(tasks.length===0) return null;
      return(
        <div key={roleKey} className="card mb">
          <div className="card-title">{rInfo.icon} Demandas de hoje — {rInfo.label}</div>
          {['todo','doing','done'].map(status=>{
            const t=tasks.filter(t=>t.status===status);
            if(t.length===0) return null;
            const labels={todo:'A Fazer',doing:'Fazendo',done:'Concluído'};
            const colors={todo:'#F59E0B',doing:'#3B82F6',done:'#10B981'};
            return(
              <div key={status} style={{marginBottom:10}}>
                <div style={{fontSize:11,fontWeight:700,color:colors[status],textTransform:'uppercase',letterSpacing:.6,marginBottom:6}}>{labels[status]} ({t.length})</div>
                {t.map(task=><div key={task.id} style={{background:'#F8F9FB',borderRadius:8,padding:'8px 12px',marginBottom:4,fontSize:13.5,borderLeft:`3px solid ${colors[status]}`}}>{task.title}{task.description&&<span style={{color:'#9CA3AF',fontSize:12}}> — {task.description}</span>}</div>)}
              </div>
            );
          })}
        </div>
      );
    })}

    {/* Kanban próprio do Social */}
    <OpTaskKanban user={user} opTasks={opTasks} onRefresh={onRefresh} toast={toast} roleType="social" readOnly={false}/>
  </>);
}

// ── DESIGN/VIDEO DASHBOARD ────────────────────────────────────────────────────
function DesignVideoDash({user,profile,opClients,opEntries,opSolicitacoes,opTasks,onRefresh,toast,roleType,label,icon,itemLabel}){
  const myClients=opClients.filter(c=>c.role_type===roleType);
  function currentMonth(){return new Date().toISOString().slice(0,7);}
  function clientProgress(clientId){
    const entries=opEntries.filter(e=>e.client_id===clientId&&e.role_type===roleType&&e.month===currentMonth()&&e.status==='done');
    const meta=myClients.find(c=>c.id===clientId)?.items_per_month||4;
    return{done:entries.length,meta,pct:pct(entries.length,meta)};
  }
  const totalMeta=myClients.reduce((a,c)=>a+(c.items_per_month||4),0);
  const totalDone=myClients.reduce((a,c)=>a+clientProgress(c.id).done,0);
  const totalPct=pct(totalDone,totalMeta);
  const minhasSolicitacoes=opSolicitacoes.filter(s=>s.to_role===roleType&&s.status==='pendente');
  async function markSolicitDone(id){await sb.from('op_solicitacoes').update({status:'concluida'}).eq('id',id);toast('Concluída!');onRefresh();}
  async function markEntry(clientId,done,meta){
    const month=currentMonth();
    const existing=opEntries.filter(e=>e.client_id===clientId&&e.role_type===roleType&&e.month===month&&e.status==='done');
    if(existing.length>done){const last=existing[existing.length-1];await sb.from('op_entries').delete().eq('id',last.id);}
    else{await sb.from('op_entries').insert({client_id:clientId,role_type:roleType,month,status:'done',user_id:user.id,week_number:existing.length+1});}
    onRefresh();
  }

  return(<>
    <FraseDia profile={profile}/>

    {/* Barra total */}
    <div className="op-total-bar mb">
      <div className="op-total-label">{icon} Progresso Total — {label}</div>
      <div style={{display:'flex',alignItems:'baseline',gap:8,marginBottom:8}}><div className="op-total-pct">{totalPct}%</div><div style={{fontSize:13,color:'#6B7280'}}>{totalDone} de {totalMeta} {itemLabel}</div></div>
      <div className="prog-wrap" style={{height:12}}><div className="prog-fill" style={{width:totalPct+'%',background:totalPct>=100?'#10B981':'#3B82F6'}}/></div>
    </div>

    {/* Solicitações */}
    {minhasSolicitacoes.length>0&&<div className="card mb">
      <div className="card-title">📨 Solicitações pendentes ({minhasSolicitacoes.length})</div>
      {minhasSolicitacoes.map(s=><div key={s.id} className="op-solicitacao"><div><div style={{fontWeight:600,fontSize:13.5}}>{s.descricao}</div></div><button className="btn btn-success btn-sm" onClick={()=>markSolicitDone(s.id)}>✅ Concluir</button></div>)}
    </div>}

    {/* Clientes */}
    {myClients.length>0&&<div className="card mb">
      <div className="card-title">Entregas por Cliente</div>
      {myClients.map(c=>{
        const{done,meta,pct:p}=clientProgress(c.id);
        const boxes=Array.from({length:meta},(_,i)=>i<done);
        return(<div key={c.id} style={{marginBottom:16,paddingBottom:16,borderBottom:'1px solid #FAFAFA'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}><div style={{fontWeight:600}}>{c.name}</div><span className="tag" style={{background:p>=100?'#ECFDF5':'var(--blue-pale)',color:p>=100?'#059669':'var(--blue)'}}>{done}/{meta}</span></div>
          <div className="prog-wrap" style={{marginBottom:8}}><div className="prog-fill" style={{width:p+'%',background:p>=100?'#10B981':'#3B82F6'}}/></div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {boxes.map((isDone,i)=><div key={i} onClick={()=>markEntry(c.id,isDone?done-1:done+1,meta)} style={{width:34,height:34,borderRadius:7,border:`2px solid ${isDone?'#3B82F6':'#E5E7EB'}`,background:isDone?'#3B82F6':'#fff',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:14,color:isDone?'#fff':'#E5E7EB',transition:'all .2s'}}>{isDone?'✓':'○'}</div>)}
          </div>
        </div>);
      })}
    </div>}

    {/* Kanban de tarefas */}
    <OpTaskKanban user={user} opTasks={opTasks} onRefresh={onRefresh} toast={toast} roleType={roleType} readOnly={false}/>
  </>);
}

// ── TRÁFEGO DASHBOARD ─────────────────────────────────────────────────────────
function TrafegoDash({user,profile,opClients,opEntries,opTasks,onRefresh,toast}){
  const myClients=opClients.filter(c=>c.role_type==='trafego');
  const[openClient,setOpenClient]=useState(null);
  const[weekForm,setWeekForm]=useState({investimento:'',retorno:'',conversas:'',fechamentos:'',cpc:'',cpl:'',observations:''});
  const[saving,setSaving]=useState(false);
  const[showAddClient,setShowAddClient]=useState(false);
  const[clientForm,setClientForm]=useState({name:'',meta_faturamento:0});

  function currentMonth(){return new Date().toISOString().slice(0,7);}

  async function saveClient(e){e.preventDefault();const{error}=await sb.from('op_clients').insert({...clientForm,role_type:'trafego',owner_id:user.id,meta_faturamento:parseFloat(clientForm.meta_faturamento)||0});if(error)toast('Erro: '+error.message);else{toast('✅ Cliente adicionado!');onRefresh();setShowAddClient(false);setClientForm({name:'',meta_faturamento:0});};}

  async function saveWeekEntry(clientId){
    setSaving(true);
    const month=currentMonth();
    const weekNum=opEntries.filter(e=>e.client_id===clientId&&e.role_type==='trafego'&&e.month===month).length+1;
    const{error}=await sb.from('op_entries').insert({client_id:clientId,role_type:'trafego',month,week_number:weekNum,status:'done',user_id:user.id,investimento:parseFloat(weekForm.investimento)||0,retorno:parseFloat(weekForm.retorno)||0,conversas:parseInt(weekForm.conversas)||0,fechamentos:parseInt(weekForm.fechamentos)||0,cpc:parseFloat(weekForm.cpc)||0,cpl:parseFloat(weekForm.cpl)||0,observations:weekForm.observations});
    if(error)toast('Erro: '+error.message);else{toast('✅ Semana registrada!');onRefresh();setWeekForm({investimento:'',retorno:'',conversas:'',fechamentos:'',cpc:'',cpl:'',observations:''});}
    setSaving(false);
  }

  return(<>
    <FraseDia profile={profile}/>
    <div className="sec-hdr"><h2>Clientes — Tráfego</h2><button className="btn btn-primary btn-sm" onClick={()=>setShowAddClient(true)}>+ Cliente</button></div>
    {myClients.map(c=>{
      const month=currentMonth();
      const entries=opEntries.filter(e=>e.client_id===c.id&&e.role_type==='trafego'&&e.month===month);
      const totalRev=entries.reduce((a,e)=>a+(e.retorno||0),0);
      const totalInv=entries.reduce((a,e)=>a+(e.investimento||0),0);
      const meta=c.meta_faturamento||0;
      const metaPct=pct(totalRev,meta);
      const roas=totalInv>0?(totalRev/totalInv).toFixed(2):0;
      const isOpen=openClient===c.id;
      return(<div key={c.id} className="trafego-client-card">
        <div className="trafego-client-header" onClick={()=>setOpenClient(isOpen?null:c.id)}>
          <div><div style={{fontWeight:700,fontSize:15}}>{c.name}</div><div style={{fontSize:12.5,color:'#6B7280',marginTop:2}}>Meta: {fmtR(meta)} · ROAS: {roas}x</div></div>
          <div style={{display:'flex',alignItems:'center',gap:10}}><span className="tag" style={{background:metaPct>=100?'#ECFDF5':'var(--blue-pale)',color:metaPct>=100?'#059669':'var(--blue)'}}>{metaPct}%</span><span style={{color:'#9CA3AF',fontSize:18}}>{isOpen?'▲':'▼'}</span></div>
        </div>
        {isOpen&&<div style={{padding:'0 20px 20px'}}>
          {meta>0&&<div style={{marginBottom:16}}><div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:5}}><span style={{fontWeight:600}}>Meta de faturamento</span><span style={{color:'#3B82F6',fontWeight:600}}>{fmtR(totalRev)} / {fmtR(meta)}</span></div><div className="prog-wrap"><div className="prog-fill" style={{width:metaPct+'%',background:metaPct>=100?'#10B981':'#3B82F6'}}/></div></div>}
          <div className="g4" style={{marginBottom:16}}>
            <div style={{background:'#F8F9FB',borderRadius:8,padding:'12px 14px'}}><div style={{fontSize:11,color:'#9CA3AF',marginBottom:4,fontWeight:600}}>INVESTIMENTO</div><div style={{fontSize:18,fontWeight:700}}>{fmtR(entries.reduce((a,e)=>a+(e.investimento||0),0))}</div></div>
            <div style={{background:'#F8F9FB',borderRadius:8,padding:'12px 14px'}}><div style={{fontSize:11,color:'#9CA3AF',marginBottom:4,fontWeight:600}}>RETORNO</div><div style={{fontSize:18,fontWeight:700,color:'#10B981'}}>{fmtR(totalRev)}</div></div>
            <div style={{background:'#F8F9FB',borderRadius:8,padding:'12px 14px'}}><div style={{fontSize:11,color:'#9CA3AF',marginBottom:4,fontWeight:600}}>CONVERSAS</div><div style={{fontSize:18,fontWeight:700}}>{entries.reduce((a,e)=>a+(e.conversas||0),0)}</div></div>
            <div style={{background:'#F8F9FB',borderRadius:8,padding:'12px 14px'}}><div style={{fontSize:11,color:'#9CA3AF',marginBottom:4,fontWeight:600}}>FECHAMENTOS</div><div style={{fontSize:18,fontWeight:700,color:'#3B82F6'}}>{entries.reduce((a,e)=>a+(e.fechamentos||0),0)}</div></div>
          </div>
          {entries.length>0&&<div style={{marginBottom:16}}><div style={{fontWeight:600,fontSize:13.5,marginBottom:8}}>Histórico Semanal</div><div className="tbl-wrap"><table><thead><tr><th>Semana</th><th>Invest.</th><th>Retorno</th><th>Conversas</th><th>Fechamentos</th><th>CPC</th><th>CPL</th></tr></thead><tbody>{entries.map(e=><tr key={e.id}><td>S{e.week_number}</td><td>{fmtR(e.investimento)}</td><td style={{color:'#10B981',fontWeight:600}}>{fmtR(e.retorno)}</td><td>{e.conversas}</td><td>{e.fechamentos}</td><td>{e.cpc?fmtR(e.cpc):'—'}</td><td>{e.cpl?fmtR(e.cpl):'—'}</td></tr>)}</tbody></table></div></div>}
          <div style={{background:'#F0F9FF',border:'1px solid #BAE6FD',borderRadius:10,padding:16}}>
            <div style={{fontWeight:600,fontSize:13.5,marginBottom:12,color:'#0369A1'}}>+ Lançamento Semana {entries.length+1}</div>
            <div className="frow"><div className="fg"><label className="flabel">Investimento (R$)</label><input className="finput" type="number" step="0.01" value={weekForm.investimento} onChange={e=>setWeekForm(v=>({...v,investimento:e.target.value}))} placeholder="0,00"/></div><div className="fg"><label className="flabel">Retorno (R$)</label><input className="finput" type="number" step="0.01" value={weekForm.retorno} onChange={e=>setWeekForm(v=>({...v,retorno:e.target.value}))} placeholder="0,00"/></div></div>
            <div className="frow"><div className="fg"><label className="flabel">Conversas</label><input className="finput" type="number" min={0} value={weekForm.conversas} onChange={e=>setWeekForm(v=>({...v,conversas:e.target.value}))} placeholder="0"/></div><div className="fg"><label className="flabel">Fechamentos</label><input className="finput" type="number" min={0} value={weekForm.fechamentos} onChange={e=>setWeekForm(v=>({...v,fechamentos:e.target.value}))} placeholder="0"/></div></div>
            <div className="frow"><div className="fg"><label className="flabel">CPC (R$)</label><input className="finput" type="number" step="0.01" value={weekForm.cpc} onChange={e=>setWeekForm(v=>({...v,cpc:e.target.value}))} placeholder="0,00"/></div><div className="fg"><label className="flabel">CPL (R$)</label><input className="finput" type="number" step="0.01" value={weekForm.cpl} onChange={e=>setWeekForm(v=>({...v,cpl:e.target.value}))} placeholder="0,00"/></div></div>
            <button className="btn btn-primary btn-sm" onClick={()=>saveWeekEntry(c.id)} disabled={saving}>{saving?'Salvando...':'✓ Salvar Semana'}</button>
          </div>
        </div>}
      </div>);
    })}
    {myClients.length===0&&<div className="card mb"><div className="empty"><div className="empty-icon">📈</div>Nenhum cliente cadastrado</div></div>}
    <OpTaskKanban user={user} opTasks={opTasks} onRefresh={onRefresh} toast={toast} roleType="trafego" readOnly={false}/>
    {showAddClient&&<div className="overlay" onClick={()=>setShowAddClient(false)}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-title">Novo Cliente</div><form onSubmit={saveClient}><div className="fg"><label className="flabel">Nome *</label><input className="finput" required value={clientForm.name} onChange={e=>setClientForm(v=>({...v,name:e.target.value}))}/></div><div className="fg"><label className="flabel">Meta de Faturamento (R$)</label><input className="finput" type="number" step="0.01" value={clientForm.meta_faturamento} onChange={e=>setClientForm(v=>({...v,meta_faturamento:e.target.value}))}/></div><div className="modal-footer"><button type="button" className="btn btn-ghost" onClick={()=>setShowAddClient(false)}>Cancelar</button><button type="submit" className="btn btn-primary">Salvar</button></div></form></div></div>}
  </>);
}

// MÓDULO GESTÃO DE CLIENTES
// ══════════════════════════════════════════════════════════════════════════════

const GC_STATUS = ['Onboarding','Ativo','Aviso 30 dias','Churn','Pausado'];
const GC_STATUS_COLORS = {'Onboarding':'tag-yellow','Ativo':'tag-green','Aviso 30 dias':'tag-red','Churn':'tag-red','Pausado':'tag-gray'};
const GC_SITUACAO = ['Estável','Atenção','Crítico'];
const GC_PRODUTOS = ['Contabilidade','BPO Financeiro','Marketing','Comercial','Pacote Completo','Outro'];
const GC_PLATAFORMAS = ['Instagram','Facebook','Meta Business','Google','WhatsApp Business','YouTube','TikTok','Site/WP','Email','Outro'];
const GC_TIPOS_POST = ['Reels','Carrossel','Story','Feed','Lives'];
const GC_STATUS_POST = ['Planejado','Produzindo','Aprovado','Publicado'];
const GC_CHURN_MOTIVOS = ['Financeiro','Problema de relacionamento','Mudou de agência','Não viu resultado','Inadimplência','Outro'];
const GC_CHURN_FASES = ['Aviso Recebido','No Prazo 30 dias','Jurídico','Encerrado'];

const ONBOARDING_FASES = [
  {key:'bastao', label:'Passagem de Bastão', items:['Apresentação da equipe ao cliente','Envio de briefing inicial','Acesso às plataformas','Alinhamento de expectativas']},
  {key:'entrada', label:'Entrada', items:['Pesquisa de referências','Definição de identidade visual','Criação de perfis','Levantamento de concorrentes']},
  {key:'kickoff', label:'Reunião de Kickoff', items:['Apresentação da estratégia','Definição de metas','Aprovação do calendário inicial','Assinatura de contrato']},
  {key:'especialista', label:'Reunião com Especialista', items:['Análise do mercado','Definição de público-alvo','Estratégia de conteúdo','Plano de tráfego']},
  {key:'planejamento', label:'Reunião de Planejamento', items:['Calendário do mês','Aprovação de pautas','Definição de roteiros']},
  {key:'finais', label:'Ações Finais', items:['Primeiro post publicado','Primeira campanha ativa','Relatório de entrada','Check-in de satisfação']},
];

// ── Gestão de Clientes — Lista ────────────────────────────────────────────────
function GestaoClientes({user, profile, gcClients, gcNps, gcChurns, onRefresh, toast, onOpenClient}){
  const isGestor = profile?.role === 'gestor';
  const [search, setSearch] = useState('');
  const [filterStatus, setFilterStatus] = useState('');
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({name:'',status:'Onboarding',produto:'',orcamento:'',situacao:'Estável',responsavel:'',telefone:'',instagram:'',observacoes:''});
  const [saving, setSaving] = useState(false);

  const filtered = gcClients.filter(c => {
    const matchSearch = c.name.toLowerCase().includes(search.toLowerCase());
    const matchStatus = !filterStatus || c.status === filterStatus;
    return matchSearch && matchStatus;
  });

  const kpis = {
    ativos: gcClients.filter(c=>c.status==='Ativo').length,
    onboarding: gcClients.filter(c=>c.status==='Onboarding').length,
    aviso: gcClients.filter(c=>c.status==='Aviso 30 dias').length,
    mrr: gcClients.filter(c=>c.status==='Ativo').reduce((a,c)=>a+(c.orcamento||0),0),
  };

  function getLastNps(clientId){
    const nps = gcNps.filter(n=>n.client_id===clientId).sort((a,b)=>b.mes.localeCompare(a.mes));
    return nps[0]?.nota;
  }

  function getNpsColor(nota){
    if(nota===undefined||nota===null) return '#9CA3AF';
    if(nota>=9) return '#10B981';
    if(nota>=7) return '#F59E0B';
    return '#EF4444';
  }

  async function saveClient(e){
    e.preventDefault(); setSaving(true);
    const{error}=await sb.from('gc_clients').insert({...form,created_by:user.id,orcamento:parseFloat(form.orcamento)||0});
    if(error) toast('Erro: '+error.message);
    else{toast('✅ Cliente adicionado!');onRefresh();setShowAdd(false);setForm({name:'',status:'Onboarding',produto:'',orcamento:'',situacao:'Estável',responsavel:'',telefone:'',instagram:'',observacoes:''});}
    setSaving(false);
  }

  return(<>
    <div className="g4">
      <div className="card"><div className="card-title">Clientes Ativos</div><div className="metric-big" style={{color:'#10B981'}}>{kpis.ativos}</div></div>
      <div className="card"><div className="card-title">Em Onboarding</div><div className="metric-big" style={{color:'#F59E0B'}}>{kpis.onboarding}</div></div>
      <div className="card"><div className="card-title">Aviso 30 dias</div><div className="metric-big" style={{color:'#EF4444'}}>{kpis.aviso}</div></div>
      <div className="card"><div className="card-title">MRR Ativo</div><div className="metric-big" style={{fontSize:22}}>{fmtR(kpis.mrr)}</div></div>
    </div>

    <div style={{display:'flex',gap:12,marginBottom:18,alignItems:'center'}}>
      <input className="finput" style={{maxWidth:280}} placeholder="🔍 Buscar cliente..." value={search} onChange={e=>setSearch(e.target.value)}/>
      <select className="fselect" style={{maxWidth:180}} value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
        <option value="">Todos os status</option>
        {GC_STATUS.map(s=><option key={s}>{s}</option>)}
      </select>
      {isGestor&&<button className="btn btn-primary btn-sm" style={{marginLeft:'auto'}} onClick={()=>setShowAdd(true)}>+ Novo Cliente</button>}
    </div>

    {filtered.length===0&&<div className="card"><div className="empty"><div className="empty-icon">👥</div>Nenhum cliente encontrado</div></div>}

    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14}}>
      {filtered.map(c=>{
        const nps=getLastNps(c.id);
        return(
          <div key={c.id} className="card" style={{cursor:'pointer',transition:'all .15s'}} onClick={()=>onOpenClient(c)}>
            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:10}}>
              <div style={{fontWeight:700,fontSize:15}}>{c.name}</div>
              <span className={`tag ${GC_STATUS_COLORS[c.status]||'tag-gray'}`}>{c.status}</span>
            </div>
            <div style={{fontSize:13,color:'#6B7280',marginBottom:4}}>{c.produto||'—'}</div>
            <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:8}}>
              <span style={{fontSize:12,fontWeight:600,color:c.situacao==='Estável'?'#10B981':c.situacao==='Atenção'?'#F59E0B':'#EF4444'}}>● {c.situacao||'Estável'}</span>
              {c.orcamento>0&&<span style={{fontSize:12,color:'#9CA3AF'}}>{fmtR(c.orcamento)}/mês</span>}
            </div>
            {nps!==undefined&&<div style={{display:'flex',alignItems:'center',gap:6}}><span style={{fontSize:11,color:'#9CA3AF'}}>NPS</span><span style={{fontSize:16,fontWeight:700,color:getNpsColor(nps)}}>{nps}</span></div>}
            <div style={{fontSize:11,color:'#9CA3AF',marginTop:6}}>Ver ficha →</div>
          </div>
        );
      })}
    </div>

    {showAdd&&<div className="overlay" onClick={()=>setShowAdd(false)}><div className="modal modal-lg" onClick={e=>e.stopPropagation()}>
      <div className="modal-title">Novo Cliente</div>
      <form onSubmit={saveClient}>
        <div className="frow"><div className="fg"><label className="flabel">Nome *</label><input className="finput" required value={form.name} onChange={e=>setForm(v=>({...v,name:e.target.value}))}/></div><div className="fg"><label className="flabel">Produto</label><select className="fselect" value={form.produto} onChange={e=>setForm(v=>({...v,produto:e.target.value}))}><option value="">Selecionar...</option>{GC_PRODUTOS.map(p=><option key={p}>{p}</option>)}</select></div></div>
        <div className="frow"><div className="fg"><label className="flabel">Status</label><select className="fselect" value={form.status} onChange={e=>setForm(v=>({...v,status:e.target.value}))}>{GC_STATUS.map(s=><option key={s}>{s}</option>)}</select></div><div className="fg"><label className="flabel">Situação</label><select className="fselect" value={form.situacao} onChange={e=>setForm(v=>({...v,situacao:e.target.value}))}>{GC_SITUACAO.map(s=><option key={s}>{s}</option>)}</select></div></div>
        <div className="frow"><div className="fg"><label className="flabel">Orçamento Mensal (R$)</label><input className="finput" type="number" step="0.01" value={form.orcamento} onChange={e=>setForm(v=>({...v,orcamento:e.target.value}))}/></div><div className="fg"><label className="flabel">Responsável</label><input className="finput" value={form.responsavel} onChange={e=>setForm(v=>({...v,responsavel:e.target.value}))} placeholder="Nome do responsável"/></div></div>
        <div className="frow"><div className="fg"><label className="flabel">Telefone</label><input className="finput" value={form.telefone} onChange={e=>setForm(v=>({...v,telefone:e.target.value}))} placeholder="(21) 99999-9999"/></div><div className="fg"><label className="flabel">Instagram</label><input className="finput" value={form.instagram} onChange={e=>setForm(v=>({...v,instagram:e.target.value}))} placeholder="@usuario"/></div></div>
        <div className="fg"><label className="flabel">Observações</label><textarea className="ftextarea" value={form.observacoes} onChange={e=>setForm(v=>({...v,observacoes:e.target.value}))}/></div>
        <div className="modal-footer"><button type="button" className="btn btn-ghost" onClick={()=>setShowAdd(false)}>Cancelar</button><button type="submit" className="btn btn-primary" disabled={saving}>{saving?'Salvando...':'Criar Cliente'}</button></div>
      </form>
    </div></div>}
  </>);
}

// ── Ficha do Cliente ──────────────────────────────────────────────────────────
function ClienteFicha({user, profile, client, gcOnboarding, gcEstrategia, gcCalendario, gcMetricas, gcRoteiros, gcAtas, gcLogins, gcChurns, gcNps, onRefresh, toast, onBack}){
  const isGestor = profile?.role === 'gestor';
  const [tab, setTab] = useState('onboarding');
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({...client});
  const [saving, setSaving] = useState(false);

  async function saveEdit(){
    setSaving(true);
    await sb.from('gc_clients').update({...form,orcamento:parseFloat(form.orcamento)||0,updated_at:new Date().toISOString()}).eq('id',client.id);
    toast('✅ Cliente atualizado!'); setEditing(false); onRefresh(); setSaving(false);
  }
  async function deleteClient(){
    if(!confirm('Remover este cliente e todos os dados?')) return;
    await sb.from('gc_clients').delete().eq('id',client.id);
    toast('Cliente removido'); onBack();
  }

    {tab==='estrategia'&&<TabEstrategia clientId={client.id} gcEstrategia={gcEstrategia} onRefresh={onRefresh} toast={toast}/>}
    {tab==='calendario'&&<TabCalendario clientId={client.id} gcCalendario={gcCalendario} onRefresh={onRefresh} toast={toast}/>}
    {tab==='metricas'&&<TabMetricas clientId={client.id} gcMetricas={gcMetricas} onRefresh={onRefresh} toast={toast}/>}
    {tab==='roteiros'&&<TabRoteiros clientId={client.id} gcRoteiros={gcRoteiros} onRefresh={onRefresh} toast={toast}/>}
    {tab==='atas'&&<TabAtas clientId={client.id} gcAtas={gcAtas} onRefresh={onRefresh} toast={toast}/>}
    {tab==='logins'&&<TabLogins clientId={client.id} gcLogins={gcLogins} onRefresh={onRefresh} toast={toast}/>}
    {tab==='churn'&&<TabChurnNps clientId={client.id} gcChurns={gcChurns} gcNps={gcNps} onRefresh={onRefresh} toast={toast} user={user}/>}
  </>);
}

// ── Tab Onboarding ────────────────────────────────────────────────────────────
function TabOnboarding({clientId, gcOnboarding, onRefresh, toast}){
  const myChecks = gcOnboarding.filter(c=>c.client_id===clientId);
  const allItems = ONBOARDING_FASES.flatMap(f=>f.items.map((_,i)=>f.key+'_'+i));
  const doneCount = myChecks.filter(c=>c.done).length;
  const totalItems = allItems.length;
  const progress = pct(doneCount, totalItems);

  function isChecked(faseKey, idx){ return myChecks.find(c=>c.check_key===faseKey+'_'+idx)?.done||false; }

  async function toggleCheck(faseKey, idx){
    const key = faseKey+'_'+idx;
    const existing = myChecks.find(c=>c.check_key===key);
    if(existing){
      await sb.from('gc_onboarding').update({done:!existing.done,updated_at:new Date().toISOString()}).eq('id',existing.id);
    } else {
      await sb.from('gc_onboarding').insert({client_id:clientId,check_key:key,done:true});
    }
    onRefresh();
  }

  return(<>
    <div className="card mb">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
        <div style={{fontWeight:700}}>Progresso do Onboarding</div>
        <span className="tag tag-blue">{doneCount}/{totalItems} — {progress}%</span>
      </div>
      <div className="prog-wrap" style={{height:12}}><div className="prog-fill" style={{width:progress+'%',background:progress>=100?'#10B981':'#3B82F6'}}/></div>
    </div>
    {ONBOARDING_FASES.map(fase=>{
      const faseItems = fase.items;
      const faseDone = faseItems.filter((_,i)=>isChecked(fase.key,i)).length;
      return(
        <div key={fase.key} className="card mb">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
            <div style={{fontWeight:700,fontSize:14}}>{fase.label}</div>
            <span style={{fontSize:12,color:'#9CA3AF'}}>{faseDone}/{faseItems.length}</span>
          </div>
          {faseItems.map((item,i)=>{
            const checked = isChecked(fase.key,i);
            return(
              <div key={i} onClick={()=>toggleCheck(fase.key,i)} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0',borderBottom:'1px solid #FAFAFA',cursor:'pointer'}}>
                <div style={{width:20,height:20,borderRadius:5,border:`2px solid ${checked?'#3B82F6':'#D1D5DB'}`,background:checked?'#3B82F6':'#fff',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,transition:'all .15s'}}>
                  {checked&&<span style={{color:'#fff',fontSize:12}}>✓</span>}
                </div>
                <span style={{fontSize:14,color:checked?'#9CA3AF':'#111',textDecoration:checked?'line-through':'none'}}>{item}</span>
              </div>
            );
          })}
        </div>
      );
    })}
  </>);
}

// ── Tab Estratégia ────────────────────────────────────────────────────────────
function TabEstrategia({clientId, gcEstrategia, onRefresh, toast}){
  const existing = gcEstrategia.find(e=>e.client_id===clientId);
  const [form, setForm] = useState(existing||{objetivo:'',linha_primaria:'',linha_secundaria:'',persona1:'',persona2:'',cronograma:'',trafego_objetivo:'',orcamento_trafego:'',observacoes:''});
  const [saving, setSaving] = useState(false);

  useEffect(()=>{if(existing) setForm(existing);},[existing]);

  async function save(){
    setSaving(true);
    try {
      if(existing){
        const{error}=await sb.from('gc_estrategia').update({...form,updated_at:new Date().toISOString()}).eq('id',existing.id);
        if(error) throw error;
      } else {
        const{error}=await sb.from('gc_estrategia').insert({...form,client_id:clientId});
        if(error) throw error;
      }
      toast('✅ Estratégia salva!'); onRefresh();
    } catch(e){ toast('Erro ao salvar: '+e.message); }
    setSaving(false);
  }

  const fields=[['objetivo','Objetivo Principal'],['linha_primaria','Linha Editorial Primária'],['linha_secundaria','Linha Editorial Secundária'],['persona1','Persona 1'],['persona2','Persona 2'],['cronograma','Cronograma'],['trafego_objetivo','Objetivo de Tráfego'],['orcamento_trafego','Orçamento de Tráfego'],['observacoes','Observações']];

  return(<div className="card">
    <div className="sec-hdr"><h2>Estratégia do Cliente</h2><button className="btn btn-primary btn-sm" onClick={save} disabled={saving}>{saving?'Salvando...':'💾 Salvar'}</button></div>
    {fields.map(([key,label])=><div key={key} className="fg"><label className="flabel">{label}</label><textarea className="ftextarea" value={form[key]||''} onChange={e=>setForm(v=>({...v,[key]:e.target.value}))} placeholder={`${label}...`}/></div>)}
  </div>);
}

// ── Tab Calendário ────────────────────────────────────────────────────────────
const CAL_STATUS_POST = ['Planejado','Produzindo','Aguardando Aprovação','Aprovado','Publicado'];
const CAL_STATUS_COLORS = {'Planejado':'#9CA3AF','Produzindo':'#3B82F6','Aguardando Aprovação':'#F59E0B','Aprovado':'#10B981','Publicado':'#7C3AED'};

function TabCalendario({clientId, gcCalendario, onRefresh, toast}){
  const[currentDate,setCurrentDate]=useState(new Date());
  const[showAdd,setShowAdd]=useState(false);
  const[openPost,setOpenPost]=useState(null);
  const[shareLink,setShareLink]=useState(null);
  const[form,setForm]=useState({data_post:'',tipo:'Reels',titulo:'',legenda:'',status_post:'Planejado',arte_url:'',legenda_pronta:false,arte_pronta:false,aprovado_cliente:false});
  const[saving,setSaving]=useState(false);
  const[uploading,setUploading]=useState(false);

  const year=currentDate.getFullYear(),month=currentDate.getMonth();
  const monthKey=`${year}-${String(month+1).padStart(2,'0')}`;
  const myPosts=gcCalendario.filter(p=>p.client_id===clientId&&p.data_post?.startsWith(monthKey));
  const daysInMonth=new Date(year,month+1,0).getDate();
  const firstDay=new Date(year,month,1).getDay();
  const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const dias=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  async function savePost(e){
    e.preventDefault();setSaving(true);
    const{error}=await sb.from('gc_calendario').insert({...form,client_id:clientId,data_post:form.data_post||null});
    if(error)toast('Erro: '+error.message);
    else{toast('✅ Post adicionado!');onRefresh();setShowAdd(false);setForm({data_post:'',tipo:'Reels',titulo:'',legenda:'',status_post:'Planejado',arte_url:'',legenda_pronta:false,arte_pronta:false,aprovado_cliente:false});}
    setSaving(false);
  }

  async function updatePost(id, data){
    await sb.from('gc_calendario').update({...data}).eq('id',id);
    onRefresh();
  }

  async function deletePost(id){
    if(!confirm('Remover post?'))return;
    await sb.from('gc_calendario').delete().eq('id',id);
    toast('Post removido');onRefresh();
    setOpenPost(null);
  }

  async function uploadArte(file, postId){
    setUploading(true);
    const ext=file.name.split('.').pop();
    const path=`gc_artes/${clientId}/${postId||Date.now()}.${ext}`;
    const{data,error}=await sb.storage.from('attos-dashboard').upload(path,file,{upsert:true});
    if(error){toast('Erro upload: '+error.message);setUploading(false);return null;}
    const{data:{publicUrl}}=sb.storage.from('attos-dashboard').getPublicUrl(path);
    setUploading(false);
    return publicUrl;
  }

  function generateShareLink(post){
    const link=`${window.location.origin}${window.location.pathname}?post=${post.id}`;
    setShareLink(link);
    navigator.clipboard.writeText(link);
    toast('🔗 Link copiado!');
  }

  return(<>
    <div className="card mb">
      {/* Header do calendário */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>setCurrentDate(new Date(year,month-1,1))}>‹ Anterior</button>
        <div style={{fontWeight:700,fontSize:16}}>{meses[month]} {year}</div>
        <button className="btn btn-ghost btn-sm" onClick={()=>setCurrentDate(new Date(year,month+1,1))}>Próximo ›</button>
      </div>

      {/* Grid dos dias da semana */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:2}}>
        {dias.map(d=><div key={d} style={{textAlign:'center',fontSize:11.5,fontWeight:700,color:'#9CA3AF',padding:'6px 0',background:'#F8F9FB',borderRadius:4}}>{d}</div>)}
      </div>

      {/* Grid do calendário */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2}}>
        {Array.from({length:firstDay}).map((_,i)=><div key={'e'+i} style={{minHeight:100,background:'#FAFAFA',borderRadius:4}}/>)}
        {Array.from({length:daysInMonth}).map((_,i)=>{
          const day=i+1;
          const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
          const posts=myPosts.filter(p=>p.data_post===dateStr);
          const isToday=dateStr===today();
          return(
            <div key={day} style={{minHeight:100,background:isToday?'#EFF6FF':'#fff',border:`1px solid ${isToday?'#3B82F6':'#F0F0F0'}`,borderRadius:6,padding:4,position:'relative'}}>
              <div style={{fontSize:12,fontWeight:isToday?700:400,color:isToday?'#3B82F6':'#9CA3AF',textAlign:'right',marginBottom:3}}>{day}</div>
              {posts.map(p=>(
                <div key={p.id} style={{background:'#fff',border:`1px solid ${CAL_STATUS_COLORS[p.status_post]||'#E5E7EB'}30`,borderLeft:`3px solid ${CAL_STATUS_COLORS[p.status_post]||'#9CA3AF'}`,borderRadius:5,padding:'5px 7px',marginBottom:4,cursor:'pointer'}} onClick={()=>setOpenPost(p)}>
                  <div style={{fontSize:11.5,fontWeight:600,color:'#111',marginBottom:3,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{p.titulo||'Sem título'}</div>
                  <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:3}}>
                    <span style={{fontSize:10,background:CAL_STATUS_COLORS[p.status_post]+'20',color:CAL_STATUS_COLORS[p.status_post],borderRadius:99,padding:'1px 6px',fontWeight:600}}>● {p.status_post}</span>
                  </div>
                  {p.tipo&&<span style={{fontSize:10,background:'#F0F0F0',color:'#6B7280',borderRadius:4,padding:'1px 5px'}}>{p.tipo}</span>}
                  {/* Mini checkboxes */}
                  <div style={{display:'flex',gap:6,marginTop:4}} onClick={e=>e.stopPropagation()}>
                    <label style={{display:'flex',alignItems:'center',gap:3,fontSize:10,color:'#6B7280',cursor:'pointer'}}>
                      <input type="checkbox" checked={p.legenda_pronta||false} onChange={e=>updatePost(p.id,{legenda_pronta:e.target.checked})} style={{width:11,height:11}}/> Leg.
                    </label>
                    <label style={{display:'flex',alignItems:'center',gap:3,fontSize:10,color:'#6B7280',cursor:'pointer'}}>
                      <input type="checkbox" checked={p.arte_pronta||false} onChange={e=>updatePost(p.id,{arte_pronta:e.target.checked})} style={{width:11,height:11}}/> Arte
                    </label>
                    <label style={{display:'flex',alignItems:'center',gap:3,fontSize:10,color:p.aprovado_cliente?'#10B981':'#6B7280',cursor:'pointer'}}>
                      <input type="checkbox" checked={p.aprovado_cliente||false} onChange={e=>updatePost(p.id,{aprovado_cliente:e.target.checked})} style={{width:11,height:11}}/> Apr.
                    </label>
                  </div>
                </div>
              ))}
            </div>
          );
        })}
      </div>
    </div>

    {/* Legenda de status */}
    <div style={{display:'flex',gap:12,flexWrap:'wrap',marginBottom:16}}>
      {CAL_STATUS_POST.map(s=><span key={s} style={{fontSize:12,display:'flex',alignItems:'center',gap:5}}><span style={{width:10,height:10,borderRadius:'50%',background:CAL_STATUS_COLORS[s],display:'inline-block'}}/>{s}</span>)}
    </div>

    <div className="sec-hdr"><h2>Posts do Mês ({myPosts.length})</h2><button className="btn btn-primary btn-sm" onClick={()=>setShowAdd(true)}>+ Novo Post</button></div>

    {/* Modal adicionar post */}
    {showAdd&&<div className="overlay" onClick={()=>setShowAdd(false)}><div className="modal modal-lg" onClick={e=>e.stopPropagation()}>
      <div className="modal-title">Novo Post</div>
      <form onSubmit={savePost}>
        <div className="frow"><div className="fg"><label className="flabel">Data *</label><input className="finput" type="date" required value={form.data_post} onChange={e=>setForm(v=>({...v,data_post:e.target.value}))}/></div><div className="fg"><label className="flabel">Tipo</label><select className="fselect" value={form.tipo} onChange={e=>setForm(v=>({...v,tipo:e.target.value}))}>{GC_TIPOS_POST.map(t=><option key={t}>{t}</option>)}</select></div></div>
        <div className="fg"><label className="flabel">Título</label><input className="finput" value={form.titulo} onChange={e=>setForm(v=>({...v,titulo:e.target.value}))} placeholder="Ex: Tipos de balões"/></div>
        <div className="fg"><label className="flabel">Legenda</label><textarea className="ftextarea" value={form.legenda} onChange={e=>setForm(v=>({...v,legenda:e.target.value}))} style={{minHeight:100}}/></div>
        <div className="fg"><label className="flabel">Status</label><select className="fselect" value={form.status_post} onChange={e=>setForm(v=>({...v,status_post:e.target.value}))}>{CAL_STATUS_POST.map(s=><option key={s}>{s}</option>)}</select></div>
        <div style={{display:'flex',gap:20,marginBottom:14}}>
          <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13.5,cursor:'pointer'}}><input type="checkbox" checked={form.legenda_pronta} onChange={e=>setForm(v=>({...v,legenda_pronta:e.target.checked}))}/>Legenda pronta</label>
          <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13.5,cursor:'pointer'}}><input type="checkbox" checked={form.arte_pronta} onChange={e=>setForm(v=>({...v,arte_pronta:e.target.checked}))}/>Arte pronta</label>
        </div>
        <div className="modal-footer"><button type="button" className="btn btn-ghost" onClick={()=>setShowAdd(false)}>Cancelar</button><button type="submit" className="btn btn-primary" disabled={saving}>{saving?'Salvando...':'Salvar'}</button></div>
      </form>
    </div></div>}

    {/* Modal ficha do post */}
    {openPost&&<div className="overlay" onClick={()=>setOpenPost(null)}><div className="modal modal-lg" onClick={e=>e.stopPropagation()}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:16}}>
        <div>
          <div style={{fontSize:20,fontWeight:700,marginBottom:4}}>{openPost.titulo||'Sem título'}</div>
          <div style={{fontSize:13,color:'#9CA3AF'}}>{fmtDate(openPost.data_post)} · {openPost.tipo}</div>
        </div>
        <div style={{display:'flex',gap:6}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>generateShareLink(openPost)}>🔗 Compartilhar</button>

      </div>

      {/* Status */}
      <div className="fg"><label className="flabel">Status</label>
        <select className="fselect" value={openPost.status_post} onChange={e=>{updatePost(openPost.id,{status_post:e.target.value});setOpenPost({...openPost,status_post:e.target.value});}}>
          {CAL_STATUS_POST.map(s=><option key={s}>{s}</option>)}
        </select>
      </div>

      {/* Upload Arte */}
      <div className="fg"><label className="flabel">Arte</label>
        {openPost.arte_url&&<img src={openPost.arte_url} alt="arte" onClick={()=>window.open(openPost.arte_url,'_blank')} style={{width:'100%',borderRadius:8,marginBottom:8,maxHeight:400,objectFit:'contain',cursor:'zoom-in',background:'#F8F9FB'}}/>}}

      <div className="fg"><label className="flabel">Legenda</label>

// ── Tab Métricas ──────────────────────────────────────────────────────────────
function TabMetricas({clientId, gcMetricas, onRefresh, toast}){
  const myMetrics = gcMetricas.filter(m=>m.client_id===clientId).sort((a,b)=>b.mes.localeCompare(a.mes));
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({mes:'',seguidores:'',alcance:'',impressoes:'',curtidas:'',comentarios:'',salvamentos:'',compartilhamentos:'',visitas_perfil:'',cliques_bio:'',plays_reels:''});
  const [saving, setSaving] = useState(false);

  const last = myMetrics[0], prev = myMetrics[1];
  function varPct(key){ if(!last||!prev||!prev[key]) return null; return Math.round(((last[key]-prev[key])/prev[key])*100); }

  async function save(e){
    e.preventDefault(); setSaving(true);
    const payload={client_id:clientId};
    Object.keys(form).forEach(k=>{payload[k]=form[k]===''?null:isNaN(form[k])?form[k]:parseInt(form[k]);});
    await sb.from('gc_metricas').insert(payload);
    toast('✅ Métricas lançadas!'); onRefresh(); setShowAdd(false); setSaving(false);
  }

  const kpiFields=[['seguidores','Seguidores'],['alcance','Alcance'],['impressoes','Impressões'],['plays_reels','Plays Reels']];

  return(<>
    {last&&<div className="g4 mb">
      {kpiFields.map(([key,label])=>{
        const v = varPct(key);
        return(<div key={key} className="card">
          <div className="card-title">{label}</div>
          <div className="metric-big" style={{fontSize:26}}>{fmt(last[key])}</div>
          {v!==null&&<div style={{fontSize:12,marginTop:4,color:v>=0?'#10B981':'#EF4444',fontWeight:600}}>{v>=0?'▲':'▼'} {Math.abs(v)}% vs mês ant.</div>}
        </div>);
      })}
    </div>}

    <div className="sec-hdr"><h2>Histórico de Métricas</h2><button className="btn btn-primary btn-sm" onClick={()=>setShowAdd(true)}>+ Lançar Mês</button></div>
    <div className="card mb">
      <div className="tbl-wrap"><table><thead><tr><th>Mês</th><th>Seguidores</th><th>Alcance</th><th>Impressões</th><th>Curtidas</th><th>Comentários</th><th>Plays</th></tr></thead>
      <tbody>{myMetrics.length===0?<tr><td colSpan={7} style={{textAlign:'center',color:'#9CA3AF'}}>Sem métricas</td></tr>:myMetrics.map(m=><tr key={m.id}><td><strong>{m.mes}</strong></td><td>{fmt(m.seguidores)}</td><td>{fmt(m.alcance)}</td><td>{fmt(m.impressoes)}</td><td>{fmt(m.curtidas)}</td><td>{fmt(m.comentarios)}</td><td>{fmt(m.plays_reels)}</td></tr>)}</tbody>
      </table></div>
    </div>

    {myMetrics.length>1&&<div className="card mb">
      <div className="card-title">Evolução — Seguidores vs Alcance</div>
      <LineChart labels={[...myMetrics].reverse().map(m=>m.mes)} datasets={[{label:'Seguidores',data:[...myMetrics].reverse().map(m=>m.seguidores||0),color:'#3B82F6',bg:'rgba(59,130,246,.08)'},{label:'Alcance',data:[...myMetrics].reverse().map(m=>m.alcance||0),color:'#10B981',bg:'rgba(16,185,129,.06)'}]}/>
    </div>}

    {showAdd&&<div className="overlay" onClick={()=>setShowAdd(false)}><div className="modal modal-lg" onClick={e=>e.stopPropagation()}>
      <div className="modal-title">Lançar Métricas</div>
      <form onSubmit={save}>
        <div className="fg"><label className="flabel">Mês (ex: 2026-05) *</label><input className="finput" required placeholder="AAAA-MM" value={form.mes} onChange={e=>setForm(v=>({...v,mes:e.target.value}))}/></div>
        <div className="frow"><div className="fg"><label className="flabel">Seguidores</label><input className="finput" type="number" value={form.seguidores} onChange={e=>setForm(v=>({...v,seguidores:e.target.value}))}/></div><div className="fg"><label className="flabel">Alcance</label><input className="finput" type="number" value={form.alcance} onChange={e=>setForm(v=>({...v,alcance:e.target.value}))}/></div></div>
        <div className="frow"><div className="fg"><label className="flabel">Impressões</label><input className="finput" type="number" value={form.impressoes} onChange={e=>setForm(v=>({...v,impressoes:e.target.value}))}/></div><div className="fg"><label className="flabel">Plays Reels</label><input className="finput" type="number" value={form.plays_reels} onChange={e=>setForm(v=>({...v,plays_reels:e.target.value}))}/></div></div>
        <div className="frow"><div className="fg"><label className="flabel">Curtidas</label><input className="finput" type="number" value={form.curtidas} onChange={e=>setForm(v=>({...v,curtidas:e.target.value}))}/></div><div className="fg"><label className="flabel">Comentários</label><input className="finput" type="number" value={form.comentarios} onChange={e=>setForm(v=>({...v,comentarios:e.target.value}))}/></div></div>
        <div className="frow"><div className="fg"><label className="flabel">Salvamentos</label><input className="finput" type="number" value={form.salvamentos} onChange={e=>setForm(v=>({...v,salvamentos:e.target.value}))}/></div><div className="fg"><label className="flabel">Compartilhamentos</label><input className="finput" type="number" value={form.compartilhamentos} onChange={e=>setForm(v=>({...v,compartilhamentos:e.target.value}))}/></div></div>
        <div className="frow"><div className="fg"><label className="flabel">Visitas ao Perfil</label><input className="finput" type="number" value={form.visitas_perfil} onChange={e=>setForm(v=>({...v,visitas_perfil:e.target.value}))}/></div><div className="fg"><label className="flabel">Cliques na Bio</label><input className="finput" type="number" value={form.cliques_bio} onChange={e=>setForm(v=>({...v,cliques_bio:e.target.value}))}/></div></div>
        <div className="modal-footer"><button type="button" className="btn btn-ghost" onClick={()=>setShowAdd(false)}>Cancelar</button><button type="submit" className="btn btn-primary" disabled={saving}>{saving?'Salvando...':'Salvar'}</button></div>
      </form>
    </div></div>}
  </>);
